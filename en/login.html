<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px;
            background: rgba(13, 32, 56, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 140, 255, 0.2);
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7ec8ff, #008cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(0, 140, 255, 0.1);
        }

        .nav-links a.active {
            color: #7ec8ff;
            background: rgba(0, 140, 255, 0.08);
            border: 1px solid rgba(0, 140, 255, 0.15);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 40px 20px;
        }

        .auth-box {
            background: rgba(13, 32, 56, 0.6);
            backdrop-filter: blur(16px);
            padding: 40px 35px;
            border-radius: 28px;
            border: 1px solid rgba(0, 140, 255, 0.12);
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 140, 255, 0.04);
            transition: all 0.4s ease;
        }

        .auth-box:hover {
            border-color: rgba(0, 140, 255, 0.25);
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 140, 255, 0.06);
        }

        .auth-box h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #7ec8ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #061220;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-box input:focus {
            border-color: #008cff;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.05);
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 140, 255, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
            color: #a29bfe;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0d2038;
            border: 1px solid #008cff;
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.success {
            border-color: #00c853;
        }

        .footer {
            text-align: center;
            padding: 16px;
            color: rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: auto;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .header {
                padding: 10px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .nav-links {
                justify-content: center;
                gap: 8px;
            }
            .nav-links a {
                font-size: 0.8rem;
                padding: 4px 10px;
            }
            .auth-box {
                padding: 24px 16px;
                border-radius: 20px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
            }
            .toast {
                min-width: 150px;
                padding: 12px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ===== HEADER ===== -->
<header class="header">
    <div class="logo">💙 PackZone MC</div>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
        <a href="login.html" class="active">Login</a>
    </nav>
</header>

<!-- ===== LOGIN FORM ===== -->
<main class="auth-container">
    <section class="auth-box">
        <h1>🔐 Login</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Login</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <p style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.9rem;">
            Don't have an account? <a href="signup.html" style="color:#7ec8ff;text-decoration:none;font-weight:600;">Sign Up</a>
        </p>
    </section>
</main>

<footer class="footer">
    <p>© PackZone MC — All rights reserved</p>
</footer>
    <script>
        // ============================================================
        // ===== Toast System =====
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ============================================================
        // ===== Login System (LocalStorage) =====
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('❌ Please fill in all fields', 'error');
                return;
            }

            // Get users from localStorage
            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];

            // Find user
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showToast('❌ Invalid email or password', 'error');
                return;
            }

            // Save current user
            localStorage.setItem('pzmc_current_user', JSON.stringify(user));

            showToast('✅ Login successful! Welcome ' + (user.name || user.email), 'success');

            btn.disabled = true;
            btn.textContent = '⏳ Redirecting...';

            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1200);
        });

        // ============================================================
        // ===== Check if user is already logged in =====
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (currentUser && !window.location.pathname.includes('profile.html')) {
                window.location.href = 'profile.html';
            }
        });

        // ============================================================
        // ===== Enter Key Support =====
        // ============================================================
        document.getElementById('loginEmail').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        document.getElementById('loginPass').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
