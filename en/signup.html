<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #0d2038;
            border-bottom: 2px solid #008cff;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7ec8ff;
        }

        .nav a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #008cff;
        }

        /* ===== FORM ===== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 75vh;
            padding: 30px 20px;
        }

        .auth-box {
            background: #0d2038;
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid #008cff;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 140, 255, 0.08);
        }

        .auth-box h1 {
            text-align: center;
            color: #7ec8ff;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #061220;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-box input:focus {
            border-color: #008cff;
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.2);
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                padding: 12px 16px;
            }
            .nav a {
                margin: 0 6px;
                font-size: 0.9rem;
            }
            .auth-box {
                padding: 25px 18px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">💙 PackZone MC</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="signup.html" style="color:#7ec8ff;">Sign Up</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <!-- ===== FORM ===== -->
    <main class="auth-container">
        <section class="auth-box">
            <h1>📝 Sign Up</h1>
            <form id="signupForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© PackZone MC</p>
    </footer>

    <script>
        // ===== Sign Up =====
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!name || name.length < 3) {
                alert('❌ Full name must be at least 3 characters');
                return;
            }
            if (!email || !email.includes('@')) {
                alert('❌ Please enter a valid email');
                return;
            }
            if (password.length < 6) {
                alert('❌ Password must be at least 6 characters');
                return;
            }
            if (password !== confirm) {
                alert('❌ Passwords do not match');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            if (users.find(u => u.email === email)) {
                alert('❌ This email is already registered');
                return;
            }

            users.push({
                name: name,
                email: email,
                password: password,
                createdAt: new Date().toLocaleDateString('en-US')
            });

            localStorage.setItem('pzmc_users', JSON.stringify(users));
            alert('✅ Sign up successful! Welcome ' + name);
            this.reset();
            window.location.href = 'login.html';
        });
    </script>

</body>
</html>
