<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PackZone MC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Orbitron:wght@500..900&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pzmc-global.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'Vazirmatn', sans-serif;
}

.gate {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: rgba(10, 18, 38, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--pz-border);
    border-radius: 34px;
    padding: 46px 34px 34px;
    box-shadow: 0 30px 100px rgba(0, 0, 0, 0.55), 0 0 90px rgba(56, 189, 248, 0.05);
    position: relative;
    z-index: 1;
    animation: pzUp 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    animation-delay: 0.5s;
}

@keyframes pzUp {
    from { opacity: 0; transform: translateY(34px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.gate-cube {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 0 26px rgba(56, 189, 248, 0.5));
    animation: pzBob 3.4s ease-in-out infinite;
}

@keyframes pzBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-9px) rotate(2deg); }
}

.gate h1 {
    font-family: 'Orbitron', sans-serif !important;
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, #fff 10%, #7dd3fc 45%, #22d3ee 70%, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    filter: drop-shadow(0 0 22px rgba(56, 189, 248, 0.35));
}

.gate .sub {
    color: var(--pz-muted);
    font-size: 0.92rem;
    margin: 6px 0 26px;
}

.gate h2 {
    font-family: 'Lalezar', 'Vazirmatn', sans-serif !important;
    font-weight: 400 !important;
    color: #cdd9ee;
    font-size: 1.15rem;
    margin-bottom: 20px;
}

.langs { display: flex; flex-direction: column; gap: 14px; }

.langs a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 17px 0;
    border-radius: 60px;
    font-size: 1.1rem;
    font-weight: 800;
    text-decoration: none;
    color: #fff;
    position: relative;
    overflow: hidden;
    transition: var(--pz-tr);
}

.langs a .flag { font-size: 1.45rem; }

.langs .fa-btn {
    background: linear-gradient(135deg, #0ea5e9, #0369a1);
    box-shadow: 0 8px 34px rgba(14, 165, 233, 0.30);
}

.langs .fa-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 48px rgba(14, 165, 233, 0.45); }

.langs .en-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--pz-border);
    color: #cdd9ee;
}

.langs .en-btn:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(56, 189, 248, 0.4);
    transform: translateY(-3px);
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.35);
}

.langs a:active { transform: scale(0.96); }

.gate-footer {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.8rem;
    color: #54617e;
}

.gate-footer i { color: var(--pz-blue); font-style: normal; }

@media (max-width: 480px) {
    .gate { padding: 34px 20px 26px; border-radius: 26px; }
    .gate h1 { font-size: 1.55rem; }
    .langs a { font-size: 1rem; padding: 15px 0; }
}
</style>
</head>
<body>

<div class="pz-loader" id="pzLoader">
    <div class="pz-loader-inner">
        <div class="pz-loader-ring"><span class="pz-loader-core"><svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.6"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5z"/><path d="M12 22V12M3.3 7.2 12 12l8.7-4.8"/></svg></span></div>
        <div class="pz-loader-brand">PACKZONE MC</div>
        <div class="pz-loader-bar"><span></span></div>
    </div>
</div>

<div class="pz-bg">
    <div class="pz-bg-grid"></div>
    <div class="pz-bg-glow pz-bg-glow--a"></div>
    <div class="pz-bg-glow pz-bg-glow--b"></div>
    <div class="pz-bg-glow pz-bg-glow--c"></div>
    <div class="pz-bg-icon" style="top:14%;left:8%;width:58px;height:58px;animation-delay:0s;animation-duration:20s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5z"/><path d="M12 22V12M3.3 7.2 12 12l8.7-4.8"/></svg></div>
    <div class="pz-bg-icon" style="bottom:12%;right:7%;width:44px;height:44px;opacity:0.08;animation-delay:-6s;animation-duration:26s;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20M9.5 3 7 9l5 12M14.5 3 17 9l-5 12"/></svg></div>
    <div class="pz-bg-shape pz-bg-shape--sq" style="top:24%;right:14%;width:52px;height:52px;animation-delay:-4s;"></div>
    <div class="pz-bg-shape pz-bg-shape--rd" style="bottom:26%;left:12%;width:38px;height:38px;animation-delay:-9s;"></div>
    <div class="pz-bg-shape pz-bg-shape--ln" style="top:60%;left:20%;width:160px;animation-delay:-2s;animation-duration:30s;"></div>
    <div class="pz-bg-dot" style="top:32%;left:28%;width:6px;height:6px;"></div>
    <div class="pz-bg-dot" style="bottom:30%;right:24%;width:8px;height:8px;animation-delay:-3s;"></div>
    <div class="pz-bg-dot" style="top:18%;right:38%;width:5px;height:5px;animation-delay:-5s;"></div>
</div>

<div class="gate">
    <svg class="gate-cube" viewBox="0 0 24 24" fill="none"><path d="M12 2 21 7v10l-9 5-9-5V7l9-5z" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="1.1"/><path d="M12 22V12M3.3 7.2 12 12l8.7-4.8" stroke="#22d3ee" stroke-width="1.1"/></svg>
    <h1>PACKZONE MC</h1>
    <p class="sub">✦ Professional Minecraft Resource Packs ✦</p>
    <h2>🌍 انتخاب زبان / Choose Language</h2>
    <div class="langs">
        <a href="fa/index.html" class="fa-btn" onclick="saveLanguage('fa')"><span class="flag">🇮🇷</span> فارسی</a>
        <a href="en/index.html" class="en-btn" onclick="saveLanguage('en')"><span class="flag">🇺🇸</span> English</a>
    </div>
    <div class="gate-footer"><i>❤</i> PackZone © 2026</div>
</div>

<script>
function saveLanguage(lang) {
    localStorage.setItem('packzone-lang', lang);
    localStorage.setItem('PZMC_language', lang);
}
document.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('packzone-lang') || localStorage.getItem('PZMC_language');
    if (saved === 'fa') window.location.href = 'fa/index.html';
    else if (saved === 'en') window.location.href = 'en/index.html';
});
(function() {
    function hide() {
        var l = document.getElementById('pzLoader');
        if (l) { l.classList.add('is-hidden'); setTimeout(function() { l.remove(); }, 700); }
    }
    window.addEventListener('load', function() { setTimeout(hide, 500); });
    setTimeout(hide, 2400);
})();
</script>

</body>
</html>
