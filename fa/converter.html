<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PackZone MC - Resource Pack Converter v2.7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #0a0e1a;
            color: #e0e6f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
        }
        .container {
            background: #141b2b;
            padding: 20px;
            border-radius: 20px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a3a5a;
            margin-top: 10px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }
        h1 span {
            color: #4a9eff;
        }
        .version {
            text-align: center;
            color: #ff2e63;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #8899bb;
            margin-bottom: 16px;
            font-size: 13px;
        }

        /* ===== پنل تنظیمات ===== */
        .settings-panel {
            background: #0f1626;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #1a2a4a;
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .settings-panel label {
            font-size: 12px;
            color: #8899bb;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .settings-panel input,
        .settings-panel select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #2a3a5a;
            background: #0a0e1a;
            color: #e0e6f0;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
        }
        .settings-panel input:focus,
        .settings-panel select:focus {
            border-color: #4a9eff;
        }
        .settings-panel .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-panel .color-picker input[type="color"] {
            width: 38px;
            height: 34px;
            padding: 2px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #2a3a5a;
            background: transparent;
        }
        .settings-panel .undo-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            background: #3a1a1a;
            color: #ff6b6b;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        .settings-panel .undo-btn:active {
            transform: scale(0.95);
        }

        /* ===== دراپ زون ===== */
        .drop-zone {
            border: 2px dashed #2a3a5a;
            border-radius: 14px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #0f1626;
            touch-action: manipulation;
        }
        .drop-zone:active {
            transform: scale(0.98);
        }
        .drop-zone:hover {
            border-color: #4a9eff;
            background: #18203a;
        }
        .drop-zone.dragover {
            border-color: #4a9eff;
            background: #1a2a4a;
        }
        .drop-zone svg {
            width: 50px;
            height: 50px;
            fill: #4a9eff;
            margin-bottom: 8px;
            pointer-events: none;
        }
        .drop-zone p {
            font-size: 15px;
            color: #aabbdd;
            pointer-events: none;
        }
        .drop-zone .hint {
            font-size: 12px;
            color: #667799;
            margin-top: 4px;
            pointer-events: none;
        }
        #file-input {
            display: none !important;
        }

        /* ===== فایل اینفو ===== */
        .file-info {
            display: none;
            background: #0f1626;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 12px;
            border: 1px solid #1a2a4a;
        }
        .file-info.show {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .file-info .name {
            color: #4a9eff;
            font-weight: 500;
            font-size: 14px;
            word-break: break-all;
        }
        .file-info .size {
            color: #667799;
            font-size: 13px;
        }

        /* ===== دکمه‌ها ===== */
        .btn-convert {
            width: 100%;
            padding: 14px;
            margin-top: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4a9eff, #2a6eff);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            touch-action: manipulation;
        }
        .btn-convert:active {
            transform: scale(0.97);
        }
        .btn-convert:hover:not(:disabled) {
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(74, 158, 255, 0.3);
        }
        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== پروگرس ===== */
        .progress-container {
            display: none;
            margin-top: 14px;
            background: #0f1626;
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #1a2a4a;
        }
        .progress-container.show {
            display: block;
        }
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #1a2a4a;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 6px;

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a9eff, #00d4ff);
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .progress-text {

            justify-content: space-between;
            font-size: 13px;
            color: #8899bb;
        }

        /* ===== لاگ ===== */
        .log {

            background: #0a0e1a;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #667799;

            overflow-y: auto;

            text-align: left;

        .log.show {

        .log .success {
            color: #66ddaa;
        }
        .log .error {
            color: #ff6b6b;
        }
        .log .info {
            color: #4a9eff;
        }
        .log .special {
            color: #ff6bff;
        }
        .log .warn {
            color: #ffd93d;
        }

            display: none;
            margin-top: 14px;
            background: #0f1626;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1a4a3a;
            text-align: center;
        }
        .result.show {
            display: block;
        }
        .result .icon {
            font-size: 36px;
            margin-bottom: 4px;
        }
        .result .msg {
            color: #66ddaa;
            font-weight: 500;
            font-size: 16px;

            color: #8899bb;
            font-size: 13px;

            border-radius: 10px;
            background: #1a4a3a;
            color: #66ddaa;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;

            background: #1a5a4a;

            border-top: 1px solid #1a2a4a;
            padding-top: 16px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .history-header h2 {
            font-size: 17px;
            color: #e0e6f0;
        }
        .history-header h2 span {
            color: #4a9eff;
        }
        .history-search {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #2a3a5a;
            background: #0f1626;
            color: #e0e6f0;

            font-size: 13px;

            transition: 0.3s;
        }
        .history-search:focus {
            border-color: #4a9eff;
        }
        .history-search::placeholder {
            color: #667799;
        }
        .btn-clear-history {

            border: none;
            border-radius: 8px;
            background: #3a1a1a;
            color: #ff6b6b;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            touch-action: manipulation;
        }
        .btn-clear-history:active {
            transform: scale(0.95);
        }

        .history-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .history-item {
            background: #0f1626;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #1a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;

        .history-item .info {

            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 120px;
        }
        .history-item .info .name {
            color: #e0e6f0;
            font-weight: 500;
            font-size: 13px;
        }
        .history-item .info .meta {
            color: #667799;
            font-size: 11px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-item .actions {
            display: flex;
            gap: 5px;
        }
        .history-item .actions button {
            padding: 4px 10px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            touch-action: manipulation;
            transition: 0.2s;
        }
        .history-item .actions button:active {
            transform: scale(0.93);
        }
        .btn-download-history {
            background: #1a4a3a;
            color: #66ddaa;
        }
        .btn-delete-history {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        .history-empty {
            text-align: center;
            color: #667799;
            font-size: 13px;
            padding: 16px 0;
        }

        @media (max-width: 500px) {
            .settings-panel {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 12px;
            }
            .container {
                padding: 14px;
            }
            .drop-zone {
                padding: 20px 12px;
            }
            .drop-zone svg {
                width: 40px;
                height: 40px;
            }
            .history-item {
                flex-direction: column;
                align-items: stretch;
            }
            .history-item .actions {
                justify-content: flex-start;
            }
            .history-search {
                width: 100%;
            }
            .history-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn-convert {
                font-size: 15px;
                padding: 12px;
            }
            .file-info .name {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="container">

<script>
    // ============================================================
    //  کلاس Storage (تاریخچه)
    // ============================================================
    class PackStorage {
        static getKey() { return 'packHistory'; }
        static getAll() {
            try { return JSON.parse(localStorage.getItem(this.getKey()) || '[]'); } catch { return []; }
        }
        static save(packData) {
            const history = this.getAll();
            history.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                ...packData,
                date: new Date().toISOString()
            });
            localStorage.setItem(this.getKey(), JSON.stringify(history));
            return history;
        }
        static delete(id) {
            let history = this.getAll().filter(p => p.id !== id);
            localStorage.setItem(this.getKey(), JSON.stringify(history));
            return history;
        }
        static clear() {
            localStorage.removeItem(this.getKey());
            return [];
        }
        static search(query) {
            if (!query.trim()) return this.getAll();
            const q = query.trim().toLowerCase();
            return this.getAll().filter(p => p.name.toLowerCase().includes(q));
        }
    }

    // ============================================================
    //  کلاس اصلی کانورتر - نسخه ۲.۷
    // ============================================================

            // دیتابیس مسیرهای تبدیل
            this.pathDatabase = {
                'textures/models/armor/chainmail_layer_1.png': 'textures/models/armor/chain_1.png',

                'textures/models/armor/gold_layer_1.png': 'textures/models/armor/gold_1.png',

                'textures/models/armor/leather_layer_2.png': 'textures/models/armor/leather_2.png',
                'textures/models/armor/leather_layer_1_overlay.png': 'textures/models/armor/leather_1_overlay.png',
                'textures/models/armor/leather_layer_2_overlay.png': 'textures/models/armor/leather_2_overlay.png'
            };

            this.buggyFiles = [
                'textures/items/diamond_sword.png',
                'textures/items/iron_sword.png',
                'textures/items/golden_sword.png',
                'textures/items/stone_sword.png',

            this.flipbookTemplate = [

                { "flipbook_texture": "textures/items/stone_sword", "atlas_tile": "stone_sword", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/wooden_sword", "atlas_tile": "wooden_sword", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },

            this.packColorInput = document.getElementById('packColorInput');
            this.packFontInput = document.getElementById('packFontInput');

// ============================================================
//  رویدادها
// ============================================================
initEvents() {
    const self = this;

    // ===== کلیک روی دراپ زون =====
    this.dropZone.addEventListener('click', function(e) {
        e.stopPropagation();
        e.preventDefault();
        self.fileInput.click();
    });

    // ===== تاچ روی دراپ زون (موبایل) =====
    this.dropZone.addEventListener('touchstart', function(e) {
        // فقط برای اطمینان از باز شدن file input
        this.style.borderColor = '#4a9eff';
    }, { passive: true });

    this.dropZone.addEventListener('touchend', function(e) {
        this.style.borderColor = '';
    }, { passive: true });

    // ===== درگ & دراپ =====
    this.dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        this.dropZone.classList.add('dragover');
    });
    this.dropZone.addEventListener('dragleave', () => {
        this.dropZone.classList.remove('dragover');
    });
    this.dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        this.dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            this.handleFile(e.dataTransfer.files[0]);
        }
    });

    // ===== تغییر فایل =====
    this.fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            this.handleFile(e.target.files[0]);
        }
        // ریست کردن input برای انتخاب مجدد
        this.fileInput.value = '';
    });

    // ===== دکمه‌ها =====
    this.convertBtn.addEventListener('click', () => this.startConversion());
    this.downloadBtn.addEventListener('click', () => this.downloadPack());

    // ===== تنظیمات =====
    this.packNameInput.addEventListener('input', () => this.saveSettings());
    this.packColorInput.addEventListener('input', () => this.saveSettings());
    this.packFontInput.addEventListener('change', () => this.saveSettings());
    this.packVersionInput.addEventListener('change', () => this.saveSettings());
    this.undoColorBtn.addEventListener('click', () => {
        this.packColorInput.value = this.defaultSettings.color;
        this.saveSettings();
    });

    // ===== تاریخچه =====
    this.historySearch.addEventListener('input', () => this.renderHistory());
    this.clearHistoryBtn.addEventListener('click', () => {
        if (confirm('همه تاریخچه پاک شود؟')) {
            PackStorage.clear();
            this.renderHistory();
        }
    });
}

// ============================================================
//  مدیریت تنظیمات
// ============================================================
loadSettings() {
    try {
        const saved = JSON.parse(localStorage.getItem('packSettings') || 'null');
        if (saved) {
            this.currentSettings = saved;
            this.packNameInput.value = saved.packName || '';
            this.packColorInput.value = saved.color || '#4a9eff';
            this.packFontInput.value = saved.font || 'bold';
            this.packVersionInput.value = saved.version || '1.20';
        }
    } catch { /* ignore */ }
}

saveSettings() {
    this.currentSettings = {
        packName: this.packNameInput.value || '',
        color: this.packColorInput.value || '#4a9eff',
        font: this.packFontInput.value || 'bold',
        version: this.packVersionInput.value || '1.20'
    };
    try {
        localStorage.setItem('packSettings', JSON.stringify(this.currentSettings));
    } catch { /* ignore */ }
}

getFormattedPackName() {
    let name = this.currentSettings.packName || 'PackZoneMC';
    const color = this.currentSettings.color || '#4a9eff';
    const font = this.currentSettings.font || 'bold';

    const hexToMcColor = (hex) => {
        const colors = {
            '#000000': '0', '#0000AA': '1', '#00AA00': '2', '#00AAAA': '3',
            '#AA0000': '4', '#AA00AA': '5', '#FFAA00': '6', '#AAAAAA': '7',
            '#555555': '8', '#5555FF': '9', '#55FF55': 'a', '#55FFFF': 'b',
            '#FF5555': 'c', '#FF55FF': 'd', '#FFFF55': 'e', '#FFFFFF': 'f'
        };
        const hexLower = hex.toLowerCase();
        return colors[hexLower] || 'f';
    };

    const mcColor = hexToMcColor(color);
    let prefix = '';
    if (font === 'bold') prefix = '§l';
    else if (font === 'italic') prefix = '§o';
    else if (font === 'bold_italic') prefix = '§l§o';

    return `§${mcColor}${prefix}${name}`;
}

// ============================================================
//  مدیریت فایل
// ============================================================
handleFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'zip') {
        this.addLog('❌ فقط فرمت ZIP پشتیبانی می‌شود', 'error');
        return;
    }
    if (file.size > 100 * 1024 * 1024) {
        this.addLog('❌ حجم فایل بیش از ۱۰۰ مگابایت است', 'error');
        return;
    }

    this.file = file;
    this.fileName.textContent = file.name;
    this.fileSize.textContent = (file.size / 1024 / 1024).toFixed(1) + ' مگابایت';
    this.fileInfo.classList.add('show');
    this.convertBtn.disabled = false;
    this.result.classList.remove('show');
    this.logEl.classList.remove('show');
    this.logEl.innerHTML = '';
    this.addLog(`📂 فایل انتخاب شد: ${file.name}`, 'info');
}

addLog(msg, type = 'info') {
    const icons = { success: '✅', error: '❌', info: 'ℹ️', special: '✨', warn: '⚠️' };
    const prefix = icons[type] || 'ℹ️';
    this.logs.push({ msg, type });
    this.logEl.innerHTML += `<div class="${type}">${prefix} ${msg}</div>`;
    this.logEl.classList.add('show');
    this.logEl.scrollTop = this.logEl.scrollHeight;
}

setProgress(percent, label) {
    this.progress = Math.min(percent, 100);
    this.progressBar.style.width = this.progress + '%';
    this.progressPercent.textContent = Math.round(this.progress) + '%';
    if (label) this.progressLabel.textContent = label;
    this.progressContainer.classList.add('show');
}

// ============================================================
//  متدهای کمکی تصویر
// ============================================================
async rotateImage180(base64Data) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(Math.PI);
                ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
        img.src = 'data:image/png;base64,' + base64Data;
    });
}

async cropImage(base64Data, x, y, width, height) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
        img.src = 'data:image/png;base64,' + base64Data;
    });
}

async arrayBufferToBase64(buffer) {
    const blob = new Blob([buffer], { type: 'image/png' });
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
    });
    }
// ============================================================
//  پردازش اسکای معمولی
// ============================================================
async processSky(mcFolder, bedrockPack) {
    const skyFolder = mcFolder.folder('textures/environment/sky');
    if (!skyFolder) {
        this.addLog('ℹ️ پوشه اسکای معمولی یافت نشد', 'info');
        return;
    }

    const allFiles = skyFolder.file(/./);
    const pngFiles = [];
    for (const file of allFiles) {
        if (!file.dir && file.name.endsWith('.png')) {
            pngFiles.push(file);
        }
    }

    if (pngFiles.length === 0) {
        this.addLog('ℹ️ هیچ فایل PNG در پوشه اسکای معمولی یافت نشد', 'info');
        return;
    }

    let convertedCount = 0;
    let skippedCount = 0;

    for (const file of pngFiles) {
        try {
            const fileData = await file.async('arraybuffer');
            const fileSizeKB = fileData.byteLength / 1024;

            if (fileSizeKB < 500) {
                this.addLog(`⚠️ ${file.name} سایز ${fileSizeKB.toFixed(0)}KB (کمتر از ۵۰۰KB)، رد شد`, 'warn');
                skippedCount++;
                continue;
            }

            const data = await this.arrayBufferToBase64(fileData);
            bedrockPack.file(`textures/environment/overworld_cubemap/${file.name}`, data, { base64: true });
            convertedCount++;
            this.addLog(`🌤️ ${file.name} (${fileSizeKB.toFixed(0)}KB) → textures/environment/overworld_cubemap/`, 'special');
        } catch (err) {
            this.addLog(`⚠️ خطا در ${file.name}: ${err.message}`, 'error');
        }
    }

    if (convertedCount > 0) {
        this.addLog(`✅ ${convertedCount} فایل اسکای معمولی تبدیل شد`, 'success');
    }
    if (skippedCount > 0) {
        this.addLog(`⚠️ ${skippedCount} فایل اسکای به دلیل سایز زیر ۵۰۰KB رد شد`, 'warn');
    }
}

// ============================================================
//  پردازش McPatcher Sky با انتخاب کاربر
// ============================================================
async processMcpatcherSkyWithSubpacks(mcFolder, bedrockPack) {
    const skyFolder = mcFolder.folder('mcpatcher/sky/world0');
    if (!skyFolder) {
        this.addLog('ℹ️ پوشه mcpatcher/sky/world0 یافت نشد', 'info');
        return null;
    }

    const allFiles = skyFolder.file(/./);
    const pngFiles = [];
    for (const file of allFiles) {
        if (!file.dir && file.name.endsWith('.png')) {
            pngFiles.push(file);
        }
    }

    if (pngFiles.length === 0) {
        this.addLog('ℹ️ هیچ فایل .png در mcpatcher/sky/world0 یافت نشد', 'info');
        return null;
    }

    this.addLog(`🖼️ ${pngFiles.length} فایل اسکای یافت شد`, 'info');
    for (let i = 0; i < pngFiles.length; i++) {
        const file = pngFiles[i];
        const fileData = await file.async('arraybuffer');
        const fileSizeKB = fileData.byteLength / 1024;
        const status = fileSizeKB >= 500 ? '✅' : '⚠️ (زیر ۵۰۰KB)';
        this.addLog(`   ${i+1}. ${file.name} (${fileSizeKB.toFixed(0)}KB) ${status}`, 'info');
    }

    const useManual = confirm(
        `🔍 ${pngFiles.length} فایل اسکای پیدا شد!\n\n` +
        `آیا می‌خواهید خودتان انتخاب کنید؟\n` +
        `(OK → دستی | Cancel → خودکار)`
    );

    let selectedFiles = [];
    if (useManual) {
        const options = pngFiles.map((f, i) => `${i+1}. ${f.name}`).join('\n');
        const input = prompt(
            `شماره فایل‌ها را با کاما وارد کنید:\n\n${options}`
        );
        if (input && input.trim()) {
            const indices = input.split(',').map(s => parseInt(s.trim()) - 1).filter(n => n >= 0 && n < pngFiles.length);
            selectedFiles = indices.map(i => pngFiles[i]);
        } else {
            selectedFiles = pngFiles;
        }
    } else {
        for (const file of pngFiles) {
            const fileData = await file.async('arraybuffer');
            const fileSizeKB = fileData.byteLength / 1024;
            if (fileSizeKB >= 500) {
                selectedFiles.push(file);
            }
        }
    }

    if (selectedFiles.length === 0) {
        this.addLog('⚠️ هیچ فایل اسکای انتخاب نشد', 'warn');
        return null;
    }

    const skyData = [];
    const subpackNames = ['Day Sky', 'Sunset Sky', 'Starfield I', 'Starfield II'];
    const subpackColors = ['§b§l', '§6§l', '§7§l', '§f§l'];
    const subpackFolders = ['daysky', 'sunsetsky', 'starfield1', 'starfield2'];

    let validCount = 0;
    for (let i = 0; i < Math.min(selectedFiles.length, 4); i++) {
        const file = selectedFiles[i];
        const fileData = await file.async('arraybuffer');
        const fileSizeKB = fileData.byteLength / 1024;

        if (fileSizeKB < 500) {
            this.addLog(`⚠️ ${file.name} زیر ۵۰۰KB است، رد شد`, 'warn');
            continue;
        }

        const data = await this.arrayBufferToBase64(fileData);
        const img = new Image();
        img.src = 'data:image/png;base64,' + data;
        await new Promise((resolve) => { img.onload = resolve; });

        const imgWidth = img.width;
        const imgHeight = img.height;
        const partWidth = Math.floor(imgWidth / 3);
        const partHeight = Math.floor(imgHeight / 2);

        const cropMap = [
            { col: 0, row: 0, name: 'cubemap_5.png', rotate: true },
            { col: 1, row: 0, name: 'cubemap_4.png', rotate: true },
            { col: 2, row: 0, name: 'cubemap_0.png', rotate: false },
            { col: 0, row: 1, name: 'cubemap_1.png', rotate: false },
            { col: 1, row: 1, name: 'cubemap_2.png', rotate: false },
            { col: 2, row: 1, name: 'cubemap_3.png', rotate: false }
        ];

        const subpackData = {};
        for (const part of cropMap) {
            const x = part.col * partWidth;
            const y = part.row * partHeight;
            let cropped = await this.cropImage(data, x, y, partWidth, partHeight);
            if (part.rotate) {
                cropped = await this.rotateImage180(cropped);
            }
            subpackData[part.name] = cropped;
        }

        let displayName = subpackNames[validCount] || `Sky ${validCount + 1}`;
        if (selectedFiles.length > 1) {
            const customName = prompt(
                `اسم این اسکای را توی بازی وارد کنید:\n(فایل: ${file.name})`
            );
            if (customName && customName.trim()) {
                displayName = customName.trim();
            }
        }

        skyData.push({
            fileName: file.name,
            folderName: subpackFolders[validCount] || `sky${validCount + 1}`,
            name: (subpackColors[validCount] || '§f§l') + displayName,
            memoryTier: 0,
            data: subpackData,
            sizeKB: fileSizeKB
        });

        validCount++;
        this.addLog(`🌤️ ${file.name} → ساب‌پک ${subpackFolders[validCount-1]} (اسم: ${displayName})`, 'special');
    }

    if (skyData.length === 0) {
        this.addLog('⚠️ هیچ فایل اسکای معتبری انتخاب نشد', 'warn');
        return null;
    }

    this.addLog(`✅ ${skyData.length} فایل اسکای انتخاب شد`, 'success');
    return skyData;
}

                    { "flipbook_texture": "textures/items/iron_ingot", "atlas_tile": "iron_ingot", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                    { "flipbook_texture": "textures/items/magma_cream", "atlas_tile": "magma_cream", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                    { "flipbook_texture": "textures/items/watch_atlas", "atlas_tile": "watch_atlas", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                    { "flipbook_texture": "textures/items/water_flow", "atlas_tile": "water_flow", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                    { "flipbook_texture": "textures/items/water_still", "atlas_tile": "water_still", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false }
                ];
            }

            // ============================================================
            //  تاریخچه
            // ============================================================
            renderHistory() {
                const query = this.historySearch ? this.historySearch.value : '';
                const history = PackStorage.search(query);

                if (history.length === 0) {
                    this.historyList.innerHTML = `<div class="history-empty">${query.trim() ? '🔍 پکی با این نام یافت نشد.' : 'هنوز هیچ پکی تبدیل نشده است.'}</div>`;
                    return;
                }

                let html = '';
                for (const item of history) {
                    const date = new Date(item.date);
                    const dateStr = date.toLocaleDateString('fa-IR') + ' ' + date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div class="history-item">
                            <div class="info">
                                <div class="name">🎨 ${item.name}</div>
                                <div class="meta">
                                    <span>📅 ${dateStr}</span>
                                    <span>📦 ${item.size} مگابایت</span>
                                    <span>⏱️ ${item.time} ثانیه</span>
                                    ${item.hasSky ? '<span>🌤️ اسکای</span>' : ''}
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-download-history" onclick="window.downloadHistoryPack('${item.id}')">📥 دانلود</button>
                                <button class="btn-delete-history" onclick="window.deleteHistoryPack('${item.id}')">🗑️</button>
                            </div>
                        </div>
                    `;
                }
                this.historyList.innerHTML = html;
            }

            downloadPack() {
                if (this.convertedBlob) {
                    const name = this.currentSettings.packName || this.file?.name.replace(/\.zip$/, '') || 'converted';
                    saveAs(this.convertedBlob, `${name}.mcpack`);
                }
            }

            blobToBase64(blob) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
            }

            // ============================================================
            //  تابع اصلی تبدیل
            // ============================================================
            async startConversion() {
                if (this.isConverting || !this.file) return;
                this.isConverting = true;
                this.convertBtn.disabled = true;
                this.result.classList.remove('show');
                this.logs = [];
                this.logEl.innerHTML = '';
                this.logEl.classList.add('show');
                this.startTime = Date.now();
                this.setProgress(0, '⏳ آماده‌سازی...');

                try {
                    const fileData = await this.file.arrayBuffer();
                    const zip = await JSZip.loadAsync(fileData);
                    this.addLog('📦 فایل ZIP با موفقیت باز شد', 'success');

                    const bedrockPack = new JSZip();
                    this.setProgress(10, '🔄 ایجاد ساختار بدراک...');

                    const packPng = zip.file('pack.png');
                    if (packPng) {
                        const pngData = await packPng.async('base64');
                        bedrockPack.file('pack_icon.png', pngData, { base64: true });
                        this.addLog('🖼️ pack_icon.png ساخته شد', 'success');
                    } else {
                        const defaultIcon = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
                        bedrockPack.file('pack_icon.png', defaultIcon, { base64: true });
                        this.addLog('⚠️ pack.png پیدا نشد، آیکون پیش‌فرض', 'warn');
                    }

                    this.setProgress(15, '🔄 پردازش اسکای...');
                    const assetsFolder = zip.folder('assets');
                    if (!assetsFolder) {
                        throw new Error('پوشه assets/minecraft پیدا نشد!');
                    }
                    const mcFolder = assetsFolder.folder('minecraft');
                    if (!mcFolder) {
                        throw new Error('پوشه assets/minecraft پیدا نشد!');
                    }

                    const skyData = await this.processMcpatcherSkyWithSubpacks(mcFolder, bedrockPack);

                    const packName = this.currentSettings.packName || this.file.name.replace(/\.zip$/, '');
                    const manifest = this.generateManifestWithSettings(packName, skyData);
                    bedrockPack.file('manifest.json', JSON.stringify(manifest, null, 2));
                    this.addLog(`✅ manifest.json ساخته شد`, 'success');

                    if (skyData && skyData.length > 0) {
                        for (const sky of skyData) {
                            const subpackFolder = `subpacks/${sky.folderName}/textures/environment/overworld_cubemap/`;
                            for (const [name, data] of Object.entries(sky.data)) {
                                bedrockPack.file(`${subpackFolder}${name}`, data, { base64: true });
                            }
                            this.addLog(`📁 ساب‌پک ${sky.folderName} ساخته شد`, 'special');
                        }
                    }

                    this.setProgress(35, '🔄 کپی فایل‌ها...');

                    const foldersToCopy = ['textures', 'sounds'];
                    let copiedCount = 0;

                    for (const folderName of foldersToCopy) {
                        const folder = mcFolder.folder(folderName);
                        if (folder) {
                            this.addLog(`📁 کپی ${folderName}...`, 'info');
                            const files = folder.file(/./);
                            for (const file of files) {
                                if (!file.dir) {
                                    const data = await file.async('base64');
                                    const newPath = file.name.replace(`assets/minecraft/${folderName}/`, '');
                                    bedrockPack.file(`${folderName}/${newPath}`, data, { base64: true });
                                }
                            }
                            copiedCount++;
                            this.addLog(`✅ ${folderName} کپی شد (${files.filter(f => !f.dir).length} فایل)`, 'success');
                        } else {
                            this.addLog(`⚠️ پوشه ${folderName} پیدا نشد`, 'warn');
                        }
                        const progress = 35 + (copiedCount / foldersToCopy.length) * 20;
                        this.setProgress(progress, `🔄 کپی ${folderName}...`);
                    }

                    const texturesFolder = mcFolder.folder('textures');

                    await this.copyGuiContainer(mcFolder, bedrockPack);

                    if (texturesFolder) {
                        await this.processArmor(texturesFolder, bedrockPack);
                    }

                    await this.processFont(mcFolder, bedrockPack);

                    if (texturesFolder) {
                        await this.fixBugs(texturesFolder, bedrockPack);
                    }

                    this.setProgress(75, '🔄 پردازش اسکای معمولی...');

                    if (!skyData || skyData.length === 0) {
                        await this.processSky(mcFolder, bedrockPack);
                    } else {
                        this.addLog('ℹ️ اسکای معمولی نادیده گرفته شد (ساب‌پک وجود دارد)', 'info');
                    }

                    if (texturesFolder) {
                        const blocksFolder = texturesFolder.folder('blocks');
                        if (blocksFolder) {
                            let destroyCount = 0;
                            for (let i = 0; i <= 9; i++) {
                                const file = blocksFolder.file(`destroy_stage_${i}.png`);
                                if (file) {
                                    const data = await file.async('base64');
                                    bedrockPack.file(`textures/environment/destroy_stage_${i}.png`, data, { base64: true });
                                    destroyCount++;
                                }
                            }
                            if (destroyCount > 0) {
                                this.addLog(`🔄 ${destroyCount} فایل destroy_stage اضافه شد`, 'special');
                            }

                            const fire0 = blocksFolder.file('fire_layer_0.png');
                            if (fire0) {
                                const data = await fire0.async('base64');
                                bedrockPack.file('textures/flame_atlas.png', data, { base64: true });
                                const flipbook = this.generateCompleteFlipbook();
                                bedrockPack.file('textures/flipbook_textures.json', JSON.stringify(flipbook, null, 2));
                                this.addLog('🔥 flame_atlas.png و flipbook_textures.json اضافه شد', 'special');
                            }
                        }
                    }

                    this.setProgress(92, '📦 فشرده‌سازی...');

                    this.convertedBlob = await bedrockPack.generateAsync({
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 6 }
                    });

                    const elapsedTime = ((Date.now() - this.startTime) / 1000).toFixed(1);
                    this.setProgress(100, '✅ تبدیل کامل شد!');

                    const finalPackName = this.currentSettings.packName || this.file.name.replace(/\.zip$/, '');
                    this.addLog(`🎉 تبدیل با موفقیت انجام شد! زمان: ${elapsedTime} ثانیه`, 'success');
                    this.addLog(`📦 حجم: ${(this.convertedBlob.size / 1024 / 1024).toFixed(2)} مگابایت`, 'info');

                    this.convertTime.textContent = elapsedTime;
                    this.resultDetail.innerHTML =
                        `⏱️ زمان تبدیل: <span id="convertTime">${elapsedTime}</span> ثانیه • حجم: ${(this.convertedBlob.size / 1024 / 1024).toFixed(2)} مگابایت`;
                    this.result.classList.add('show');

                    const historyData = {
                        name: finalPackName,
                        size: (this.convertedBlob.size / 1024 / 1024).toFixed(2),
                        time: elapsedTime,
                        blob: await this.blobToBase64(this.convertedBlob),
                        hasSky: skyData && skyData.length > 0
                    };
                    PackStorage.save(historyData);
                    this.renderHistory();

                } catch (err) {
                    this.addLog(`❌ خطا: ${err.message}`, 'error');
                    this.setProgress(0, '❌ خطا در تبدیل');
                    console.error(err);
                } finally {
                    this.isConverting = false;
                    this.convertBtn.disabled = false;
                }
            }
        }

        // ============================================================
        //  توابع سراسری تاریخچه
        // ============================================================
        window.downloadHistoryPack = async function(id) {
            const history = PackStorage.getAll();
            const item = history.find(p => p.id === id);
            if (item && item.blob) {
                const blob = await fetch(item.blob).then(r => r.blob());
                saveAs(blob, `${item.name}.mcpack`);
            }
        };

        window.deleteHistoryPack = function(id) {
            if (confirm('آیا مطمئن هستید؟')) {
                PackStorage.delete(id);
                const converter = new PackConverter();
                converter.renderHistory();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            new PackConverter();
        });
    </script>
</body>
</html>
