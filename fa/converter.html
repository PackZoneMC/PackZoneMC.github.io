<script>
    // ============================================================
    //  کلاس Storage (مدیریت تاریخچه)
    // ============================================================
    class PackStorage {
        static getKey() { return 'packHistory'; }

        static getAll() {
            try {
                return JSON.parse(localStorage.getItem(this.getKey()) || '[]');
            } catch { return []; }
        }

        static save(packData) {
            const history = this.getAll();
            history.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                ...packData,
                date: new Date().toISOString()
            });
            localStorage.setItem(this.getKey(), JSON.stringify(history));
            return history;
        }

        static delete(id) {
            let history = this.getAll().filter(p => p.id !== id);
            localStorage.setItem(this.getKey(), JSON.stringify(history));
            return history;
        }

        static clear() {
            localStorage.removeItem(this.getKey());
            return [];
        }

        static search(query) {
            if (!query.trim()) return this.getAll();
            const q = query.trim().toLowerCase();
            return this.getAll().filter(p => 
                p.name.toLowerCase().includes(q) ||
                (p.description && p.description.toLowerCase().includes(q))
            );
        }
    }

    // ============================================================
    //  کلاس اصلی کانورتر - نسخه ۱.۶
    // ============================================================
    class PackConverter {
        constructor() {
            this.file = null;
            this.convertedBlob = null;
            this.logs = [];
            this.progress = 0;
            this.isConverting = false;
            this.startTime = 0;

            // DOM
            this.dropZone = document.getElementById('dropZone');
            this.fileInput = document.getElementById('file-input');
            this.fileInfo = document.getElementById('fileInfo');
            this.fileName = document.getElementById('fileName');
            this.fileSize = document.getElementById('fileSize');
            this.convertBtn = document.getElementById('convertBtn');
            this.progressContainer = document.getElementById('progressContainer');
            this.progressBar = document.getElementById('progressBar');
            this.progressLabel = document.getElementById('progressLabel');
            this.progressPercent = document.getElementById('progressPercent');
            this.logEl = document.getElementById('log');
            this.result = document.getElementById('result');
            this.downloadBtn = document.getElementById('downloadBtn');
            this.convertTime = document.getElementById('convertTime');
            this.resultDetail = document.getElementById('resultDetail');
            this.historyList = document.getElementById('historyList');
            this.historySearch = document.getElementById('historySearch');
            this.clearHistoryBtn = document.getElementById('clearHistoryBtn');

            this.initEvents();
            this.renderHistory();
        }

        initEvents() {
            const self = this;
            this.dropZone.addEventListener('click', function(e) {
                e.stopPropagation();
                self.fileInput.click();
            });

            this.dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                this.dropZone.classList.add('dragover');
            });
            this.dropZone.addEventListener('dragleave', () => {
                this.dropZone.classList.remove('dragover');
            });
            this.dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                this.dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    this.handleFile(e.dataTransfer.files[0]);
                }
            });

            this.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    this.handleFile(e.target.files[0]);
                }
            });

            this.convertBtn.addEventListener('click', () => this.startConversion());
            this.downloadBtn.addEventListener('click', () => this.downloadPack());

            this.historySearch.addEventListener('input', () => this.renderHistory());
            this.clearHistoryBtn.addEventListener('click', () => {
                if (confirm('آیا مطمئن هستید که همه تاریخچه پاک شود؟')) {
                    PackStorage.clear();
                    this.renderHistory();
                }
            });
        }

        handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'zip') {
                this.addLog('❌ فقط فرمت ZIP پشتیبانی می‌شود', 'error');
                return;
            }
            if (file.size > 100 * 1024 * 1024) {
                this.addLog('❌ حجم فایل بیش از ۱۰۰ مگابایت است', 'error');
                return;
            }

            this.file = file;
            this.fileName.textContent = file.name;
            this.fileSize.textContent = (file.size / 1024 / 1024).toFixed(1) + ' مگابایت';
            this.fileInfo.classList.add('show');
            this.convertBtn.disabled = false;
            this.result.classList.remove('show');
            this.logEl.classList.remove('show');
            this.logEl.innerHTML = '';
            this.addLog(`📂 فایل انتخاب شد: ${file.name}`, 'info');
        }

        addLog(msg, type = 'info') {
            const icons = { success: '✅', error: '❌', info: 'ℹ️', special: '✨', warn: '⚠️' };
            const prefix = icons[type] || 'ℹ️';
            this.logs.push({ msg, type });
            this.logEl.innerHTML += `<div class="${type}">${prefix} ${msg}</div>`;
            this.logEl.classList.add('show');
            this.logEl.scrollTop = this.logEl.scrollHeight;
        }

        setProgress(percent, label) {
            this.progress = Math.min(percent, 100);
            this.progressBar.style.width = this.progress + '%';
            this.progressPercent.textContent = Math.round(this.progress) + '%';
            if (label) this.progressLabel.textContent = label;
            this.progressContainer.classList.add('show');
        }

// ============================================================
async rotateImage180(base64Data) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(Math.PI);
                ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
        img.src = 'data:image/png;base64,' + base64Data;
    });
}

async cropImage(base64Data, x, y, width, height) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
                resolve(canvas.toDataURL('image/png').split(',')[1]);
            } catch (err) { reject(err); }
        };
        img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
        img.src = 'data:image/png;base64,' + base64Data;
    });
}

// ============================================================
//  پردازش اسکای معمولی
// ============================================================
async processSky(mcFolder, bedrockPack) {
    const skyFolder = mcFolder.folder('textures/environment/sky');
    if (!skyFolder) {
        this.addLog('ℹ️ پوشه اسکای معمولی یافت نشد', 'info');
        return;
    }
    const skyMapping = [
        ['up.png', 'cubemap_0.png', false],
        ['front.png', 'cubemap_4.png', true],
        ['right.png', 'cubemap_1.png', false],
        ['left.png', 'cubemap_5.png', true],
        ['down.png', 'cubemap_2.png', false],
        ['back.png', 'cubemap_3.png', false]
    ];
    let convertedCount = 0;
    for (const [javaName, bedrockName, rotate] of skyMapping) {
        const file = skyFolder.file(javaName);
        if (file) {
            try {
                let data = await file.async('base64');
                if (rotate) {
                    data = await this.rotateImage180(data);
                    this.addLog(`🌤️ ${javaName} → ${bedrockName} (۱۸۰°)`, 'special');
                } else {
                    this.addLog(`🌤️ ${javaName} → ${bedrockName} (بدون چرخش)', 'special');
                }
                bedrockPack.file(`textures/environment/overworld_cubemap/${bedrockName}`, data, { base64: true });
                convertedCount++;
            } catch (err) {
                this.addLog(`⚠️ خطا در ${javaName}: ${err.message}`, 'error');
            }
        }
    }
    if (convertedCount > 0) {
        this.addLog(`✅ ${convertedCount} فایل اسکای معمولی به cubemap تبدیل شد`, 'success');
    }
}

// ============================================================
//  پردازش McPatcher Sky (۳×۲ → ۶ تکه)
// ============================================================
async processMcpatcherSky(mcFolder, bedrockPack) {
    const skyFolder = mcFolder.folder('mcpatcher/sky/world0');
    if (!skyFolder) {
        this.addLog('ℹ️ پوشه mcpatcher/sky/world0 یافت نشد', 'info');
        return;
    }

    const allFiles = skyFolder.file(/./);
    let pngFile = null;
    let pngName = '';
    for (const file of allFiles) {
        if (!file.dir && file.name.endsWith('.png')) {
            pngFile = file;
            pngName = file.name;
            break;
        }
    }
    if (!pngFile) {
        this.addLog('ℹ️ هیچ فایل .png در mcpatcher/sky/world0 یافت نشد', 'info');
        return;
    }

    const data = await pngFile.async('base64');
    const img = new Image();
    img.src = 'data:image/png;base64,' + data;
    await new Promise((resolve) => { img.onload = resolve; });

    const imgWidth = img.width;
    const imgHeight = img.height;
    const partWidth = Math.floor(imgWidth / 3);
    const partHeight = Math.floor(imgHeight / 2);

    this.addLog(`📐 ابعاد عکس: ${imgWidth}×${imgHeight}`, 'info');

    const cropMap = [
        { col: 0, row: 0, name: 'cubemap_5.png', rotate: true },
        { col: 1, row: 0, name: 'cubemap_4.png', rotate: true },
        { col: 2, row: 0, name: 'cubemap_0.png', rotate: false },
        { col: 0, row: 1, name: 'cubemap_1.png', rotate: false },
        { col: 1, row: 1, name: 'cubemap_2.png', rotate: false },
        { col: 2, row: 1, name: 'cubemap_3.png', rotate: false }
    ];

    for (const part of cropMap) {
        const x = part.col * partWidth;
        const y = part.row * partHeight;
        let cropped = await this.cropImage(data, x, y, partWidth, partHeight);
        if (part.rotate) {
            cropped = await this.rotateImage180(cropped);
            this.addLog(`🌤️ ${part.name} (۱۸۰°)`, 'special');
        } else {
            this.addLog(`🌤️ ${part.name} (بدون چرخش)`, 'special');
        }
        bedrockPack.file(`textures/environment/overworld_cubemap/${part.name}`, cropped, { base64: true });
    }
    this.addLog(`✅ McPatcher Sky به ۶ تکه cubemap تبدیل شد`, 'success');
}

async processArmor(texturesFolder, bedrockPack) {
    const armorFolder = texturesFolder.folder('models/armor');
    if (!armorFolder) {
        this.addLog('ℹ️ پوشه models/armor یافت نشد', 'info');
        return;
    }

    const armorMap = {
        'chainmail_layer_1.png': 'chain_1.png',
        'chainmail_layer_2.png': 'chain_2.png',
        'diamond_layer_1.png': 'diamond_1.png',
        'diamond_layer_2.png': 'diamond_2.png',
        'gold_layer_1.png': 'gold_1.png',
        'gold_layer_2.png': 'gold_2.png',
        'iron_layer_1.png': 'iron_1.png',
        'iron_layer_2.png': 'iron_2.png',
        'leather_layer_1.png': 'leather_1.png',
        'leather_layer_2.png': 'leather_2.png',
        'leather_layer_1_overlay.png': 'leather_1_overlay.png',
        'leather_layer_2_overlay.png': 'leather_2_overlay.png'
    };

    const files = armorFolder.file(/./);
    let convertedCount = 0;

    for (const file of files) {
        if (!file.dir) {
            const name = file.name;
            if (armorMap[name]) {
                const data = await file.async('base64');
                bedrockPack.file(`textures/models/armor/${armorMap[name]}`, data, { base64: true });
                convertedCount++;
                this.addLog(`🛡️ ${name} → ${armorMap[name]}`, 'special');
            } else {
                // کپی معمولی
                const data = await file.async('base64');
                bedrockPack.file(`textures/models/armor/${name}`, data, { base64: true });
            }
        }
    }

    if (convertedCount > 0) {
        this.addLog(`✅ ${convertedCount} فایل armor تبدیل شد`, 'success');
    }
}
        // ============================================================
        //  تابع اصلی تبدیل
        // ============================================================
        async startConversion() {
            if (this.isConverting || !this.file) return;
            this.isConverting = true;
            this.convertBtn.disabled = true;
            this.result.classList.remove('show');
            this.logs = [];
            this.logEl.innerHTML = '';
            this.logEl.classList.add('show');
            this.startTime = Date.now();
            this.setProgress(0, '⏳ آماده‌سازی...');

            try {
                const fileData = await this.file.arrayBuffer();
                const zip = await JSZip.loadAsync(fileData);
                this.addLog('📦 فایل زیپ با موفقیت باز شد', 'success');

                // ========================================
                // چک کردن pack.mcmeta
                // ========================================
                const mcmetaFile = zip.file('pack.mcmeta');
                if (mcmetaFile) {
                    try {
                        const mcmetaContent = await mcmetaFile.async('string');
                        const mcmetaJson = JSON.parse(mcmetaContent);
                        const packFormat = mcmetaJson?.pack?.pack_format;
                        if (packFormat && packFormat > 1) {
                            this.addLog(`❌ این پک با فرمت ${packFormat} است. فقط پک‌های فرمت ۱ (۱.۸.۹ و پایین‌تر) پشتیبانی می‌شوند.`, 'error');
                            this.setProgress(0, '❌ فرمت پک پشتیبانی نمی‌شود');
                            this.isConverting = false;
                            this.convertBtn.disabled = false;
                            return;
                        }
                        this.addLog(`✅ pack_format: ${packFormat || 'نامشخص'} (پشتیبانی می‌شود)`, 'success');
                    } catch (e) {
                        this.addLog('⚠️ خطا در خواندن pack.mcmeta، ادامه می‌دهیم...', 'warn');
                    }
                } else {
                    this.addLog('ℹ️ فایل pack.mcmeta یافت نشد، ادامه می‌دهیم...', 'info');
                }

                const bedrockPack = new JSZip();
                this.setProgress(10, '🔄 ایجاد ساختار بدراک...');

                // pack.png → pack_icon.png
                const packPng = zip.file('pack.png');
                if (packPng) {
                    const pngData = await packPng.async('base64');
                    bedrockPack.file('pack_icon.png', pngData, { base64: true });
                    this.addLog('🖼️ pack_icon.png ساخته شد', 'success');
                } else {
                    const defaultIcon = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
                    bedrockPack.file('pack_icon.png', defaultIcon, { base64: true });
                    this.addLog('⚠️ pack.png پیدا نشد، آیکون پیش‌فرض استفاده شد', 'warn');
                }
                this.setProgress(15, '🔄 ساخت مانیفست...');

                const packName = this.file.name.replace(/\.zip$/, '');
                const manifest = this.generateManifest(packName);
                bedrockPack.file('manifest.json', JSON.stringify(manifest, null, 2));
                this.addLog(`✅ manifest.json ساخته شد`, 'success');
                this.setProgress(20, '🔄 کپی فایل‌ها...');

                const assetsFolder = zip.folder('assets');
                if (!assetsFolder) {
                    throw new Error('پوشه assets/minecraft در پک پیدا نشد!');
                }
                const mcFolder = assetsFolder.folder('minecraft');
                if (!mcFolder) {
                    throw new Error('پوشه assets/minecraft در پک پیدا نشد!');
                }

                // ========================================
                // کپی پوشه‌ها
                // ========================================
                const foldersToCopy = ['textures', 'sounds'];
                let copiedCount = 0;

                for (const folderName of foldersToCopy) {
                    const folder = mcFolder.folder(folderName);
                    if (folder) {
                        this.addLog(`📁 کپی ${folderName}...`, 'info');
                        const files = folder.file(/./);
                        for (const file of files) {
                            if (!file.dir) {
                                const data = await file.async('base64');
                                const newPath = file.name.replace(`assets/minecraft/${folderName}/`, '');
                                bedrockPack.file(`${folderName}/${newPath}`, data, { base64: true });
                            }
                        }
                        copiedCount++;
                        this.addLog(`✅ ${folderName} کپی شد (${files.filter(f => !f.dir).length} فایل)`, 'success');
                    } else {
                        this.addLog(`⚠️ پوشه ${folderName} پیدا نشد، رد می‌شود`, 'warn');
                    }
                    const progress = 20 + (copiedCount / foldersToCopy.length) * 30;
                    this.setProgress(progress, `🔄 کپی ${folderName}...`);
                }

                // ========================================
                // پردازش armor
                // ========================================
                const texturesFolder = mcFolder.folder('textures');
                if (texturesFolder) {
                    await this.processArmor(texturesFolder, bedrockPack);
                }

                // ========================================
                // پردازش font (دو جا)
                // ========================================
                const fontFolder = mcFolder.folder('font');
                if (fontFolder) {
                    const fontFiles = fontFolder.file(/./);
                    let fontCount = 0;
                    for (const file of fontFiles) {
                        if (!file.dir) {
                            const data = await file.async('base64');
                            // داخل textures/font
                            bedrockPack.file(`textures/font/${file.name}`, data, { base64: true });
                            // بیرون از textures (ریشه)
                            if (file.name === 'ascii.png') {
                                bedrockPack.file(`font/default8.png`, data, { base64: true });
                                this.addLog('📝 ascii.png → default8.png (ریشه)', 'special');
                            } else {
                                bedrockPack.file(`font/${file.name}`, data, { base64: true });
                            }
                            fontCount++;
                        }
                    }
                    this.addLog(`📁 ${fontCount} فایل font کپی شد (داخل textures و ریشه)`, 'success');
                }

                this.setProgress(65, '🔄 پردازش اسکای...');

                // ========================================
                // اسکای معمولی
                // ========================================
                await this.processSky(mcFolder, bedrockPack);

                // ========================================
                // McPatcher Sky
                // ========================================
                await this.processMcpatcherSky(mcFolder, bedrockPack);

                // ========================================
                // قابلیت‌های ویژه (destroy_stage, flame_atlas)
                // ========================================
                if (texturesFolder) {
                    const blocksFolder = texturesFolder.folder('blocks');
                    if (blocksFolder) {
                        let destroyCount = 0;
                        for (let i = 0; i <= 9; i++) {
                            const file = blocksFolder.file(`destroy_stage_${i}.png`);
                            if (file) {
                                const data = await file.async('base64');
                                bedrockPack.file(`textures/environment/destroy_stage_${i}.png`, data, { base64: true });
                                destroyCount++;
                            }
                        }
                        if (destroyCount > 0) {
                            this.addLog(`🔄 ${destroyCount} فایل destroy_stage به environment اضافه شد`, 'special');
                        }

                        const fire0 = blocksFolder.file('fire_layer_0.png');
                        if (fire0) {
                            const data = await fire0.async('base64');
                            bedrockPack.file('textures/flame_atlas.png', data, { base64: true });
                            const flipbook = this.generateFlipbook();
                            bedrockPack.file('textures/flipbook_textures.json', JSON.stringify(flipbook, null, 2));
                            this.addLog('🔥 flame_atlas.png و flipbook_textures.json اضافه شد', 'special');
                        }
                    }
                }

                this.setProgress(92, '📦 فشرده‌سازی...');

                this.convertedBlob = await bedrockPack.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                const elapsedTime = ((Date.now() - this.startTime) / 1000).toFixed(1);
                this.setProgress(100, '✅ تبدیل کامل شد!');

                this.addLog(`🎉 تبدیل با موفقیت انجام شد! زمان: ${elapsedTime} ثانیه`, 'success');
                this.addLog(`📦 حجم: ${(this.convertedBlob.size / 1024 / 1024).toFixed(2)} مگابایت`, 'info');

                // نمایش نتیجه
                this.convertTime.textContent = elapsedTime;
                this.resultDetail.innerHTML = `⏱️ زمان تبدیل: <span id="convertTime">${elapsedTime}</span> ثانیه • حجم: ${(this.convertedBlob.size / 1024 / 1024).toFixed(2)} مگابایت`;
                this.result.classList.add('show');

                // ========================================
                // ذخیره در تاریخچه
                // ========================================
                const historyData = {
                    name: packName,
                    size: (this.convertedBlob.size / 1024 / 1024).toFixed(2),
                    time: elapsedTime,
                    blob: await this.blobToBase64(this.convertedBlob),
                    hasSky: true,
                    description: `پک ${packName} با ${this.logs.filter(l => l.type === 'special').length} قابلیت ویژه`
                };
                PackStorage.save(historyData);
                this.renderHistory();

            } catch (err) {
                this.addLog(`❌ خطا: ${err.message}`, 'error');
                this.setProgress(0, '❌ خطا در تبدیل');
                console.error(err);
            } finally {
                this.isConverting = false;
                this.convertBtn.disabled = false;
            }
        }

        // ============================================================
        //  دانلود پک
        // ============================================================
        downloadPack() {
            if (this.convertedBlob) {
                const name = this.file ? this.file.name.replace(/\.zip$/, '') : 'converted';
                saveAs(this.convertedBlob, `${name}.mcpack`);
            }
        }

        // ============================================================
        //  تبدیل Blob به Base64
        // ============================================================
        blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        // ============================================================
        //  رندر تاریخچه
        // ============================================================
        renderHistory() {
            const query = this.historySearch ? this.historySearch.value : '';
            const history = PackStorage.search(query);

            if (history.length === 0) {
                this.historyList.innerHTML = `<div class="history-empty">${query.trim() ? '🔍 پکی با این نام یافت نشد.' : 'هنوز هیچ پکی تبدیل نشده است.'}</div>`;
                return;
            }

            let html = '';
            for (const item of history) {
                const date = new Date(item.date);
                const dateStr = date.toLocaleDateString('fa-IR') + ' ' + date.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                html += `
                    <div class="history-item">
                        <div class="info">
                            <div class="name">🎨 ${item.name}</div>
                            <div class="meta">
                                <span>📅 ${dateStr}</span>
                                <span>📦 ${item.size} مگابایت</span>
                                <span>⏱️ ${item.time} ثانیه</span>
                                ${item.hasSky ? '<span>🌤️ اسکای</span>' : ''}
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-download-history" onclick="window.downloadHistoryPack('${item.id}')">📥 دانلود</button>
                            <button class="btn-delete-history" onclick="window.deleteHistoryPack('${item.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            }
            this.historyList.innerHTML = html;
        }

        // ============================================================
        //  تولید مانیفست
        // ============================================================
        generateManifest(packName) {
            return {
                format_version: 2,
                header: {
                    name: packName,
                    description: 'RP Converter PackZoneMC!!',
                    uuid: this.generateUUID(),
                    version: [1, 0, 0],
                    min_engine_version: [1, 20, 0]
                },
                modules: [{ type: 'resources', uuid: this.generateUUID(), version: [1, 0, 0] }]
            };
        }

        // ============================================================
        //  تولید flipbook_textures.json
        // ============================================================
        generateFlipbook() {
            return [
                { "flipbook_texture": "textures/blocks/fire_0", "atlas_tile": "fire_0", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/fire_1", "atlas_tile": "fire_1", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/lava_flow", "atlas_tile": "lava_flow", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/lava_still", "atlas_tile": "lava_still", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/portal", "atlas_tile": "portal", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/sea_lantern", "atlas_tile": "sea_lantern", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/water_flow", "atlas_tile": "water_flow", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/water_flowing", "atlas_tile": "water_flowing", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/blocks/water_still", "atlas_tile": "water_still", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/compass_atlas", "atlas_tile": "compass_atlas", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/diamond", "atlas_tile": "diamond", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/emerald", "atlas_tile": "emerald", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/ender_eye", "atlas_tile": "ender_eye", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/gold_ingot", "atlas_tile": "gold_ingot", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/iron_ingot", "atlas_tile": "iron_ingot", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/magma_cream", "atlas_tile": "magma_cream", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/watch_atlas", "atlas_tile": "watch_atlas", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/water_flow", "atlas_tile": "water_flow", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false },
                { "flipbook_texture": "textures/items/water_still", "atlas_tile": "water_still", "atlas_index": 0, "atlas_tile_variant": 0, "replicate": 1, "blend_frames": false }
            ];
        }

        // ============================================================
        //  تولید UUID
        // ============================================================
        generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
    }

    // ============================================================
    //  توابع سراسری برای تاریخچه
    // ============================================================
    window.downloadHistoryPack = async function(id) {
        const history = PackStorage.getAll();
        const item = history.find(p => p.id === id);
        if (item && item.blob) {
            const blob = await fetch(item.blob).then(r => r.blob());
            saveAs(blob, `${item.name}.mcpack`);
        }
    };

    window.deleteHistoryPack = function(id) {
        if (confirm('آیا مطمئن هستید که این پک از تاریخچه حذف شود؟')) {
            PackStorage.delete(id);
            // رفرش تاریخچه
            const converter = new PackConverter();
            converter.renderHistory();
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        new PackConverter();
    });
</script>
