<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 چقدر منو بلدی؟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #ffe4ec, #ffb6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
        }

        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .heart-bg span {
            position: absolute;
            font-size: 2rem;
            color: rgba(255, 100, 150, 0.15);
            animation: floatHeart 14s infinite linear;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.7);
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 240, 245, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 22px 18px;
            max-width: 460px;
            width: 100%;
            border: 2px solid rgba(255, 150, 180, 0.3);
            box-shadow: 0 30px 60px rgba(200, 80, 120, 0.18);
            max-height: 96vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #a02c5a;
            text-shadow: 0 2px 15px rgba(200, 50, 100, 0.15);
        }

        .header .subtitle {
            font-size: 0.8rem;
            color: #b3416e;
            margin-top: 2px;
        }

        /* ===== پروگرس ===== */
        .progress-wrap {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f0c0d0;
            transition: all 0.3s ease;
        }

        .progress-dot.done {
            background: #d43f6b;
            box-shadow: 0 0 12px rgba(212, 63, 107, 0.4);
        }

        .progress-dot.active {
            background: #ff6b8a;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 107, 138, 0.5);
        }

        .progress-dot.wrong {
            background: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }

        .counter-text {
            text-align: center;
            color: #b3416e;
            font-size: 0.75rem;
            margin-bottom: 12px;
        }

        /* ===== سوال ===== */
        .question-box {
            background: rgba(255, 240, 245, 0.6);
            border-radius: 28px;
            padding: 20px 16px;
            border: 2px solid rgba(255, 150, 180, 0.25);
            box-shadow: inset 0 2px 20px rgba(255, 150, 180, 0.08);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .question-box.show {
            display: block;
        }

        .question-text {
            font-size: 1.1rem;
            color: #3a1a2a;
            font-weight: 500;
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .question-text .emoji {
            font-size: 1.4rem;
        }

        /* ===== گزینه‌ها ===== */
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            padding: 14px 16px;
            border-radius: 18px;
            border: 2px solid rgba(200, 100, 150, 0.12);
            background: rgba(255, 255, 255, 0.35);
            color: #8a5a6a;
            font-size: 0.95rem;
            text-align: center;
            font-family: inherit;
            line-height: 1.6;
            transition: all 0.3s ease;
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        .option-btn.correct-option {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            border-color: rgba(212, 63, 107, 0.25);
            color: #3a1a2a;
            background: rgba(255, 200, 220, 0.25);
        }

        .option-btn.correct-option:hover {
            background: rgba(255, 200, 220, 0.5);
            transform: scale(1.02);
            border-color: #d43f6b;
        }

        .option-btn.correct-option:active {
            transform: scale(0.97);
        }

        .option-btn.selected-correct {
            background: rgba(212, 63, 107, 0.2);
            border-color: #d43f6b;
            box-shadow: 0 0 25px rgba(212, 63, 107, 0.15);
        }

        .option-btn.selected-wrong {
            background: rgba(231, 76, 60, 0.2);
            border-color: #e74c3c;
            animation: shake 0.5s ease;
        }

        .option-btn.reveal-correct {
            background: rgba(212, 63, 107, 0.15);
            border-color: #d43f6b;
            opacity: 1;
        }

        /* ===== دکمه تکان دادن ===== */
        .shake-btn-wrap {
            text-align: center;
            margin: 12px 0 8px;
        }

        .shake-btn {
            padding: 14px 32px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #ff6b8a, #d43f6b);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(212, 63, 107, 0.3);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .shake-btn:active {
            transform: scale(0.95);
        }

        .shake-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .shake-btn .icon {
            font-size: 1.3rem;
        }

        /* ===== انیمیشن تکان ===== */
        .shake-animation {
            display: none;
            text-align: center;
            padding: 16px 0;
        }

        .shake-animation.show {
            display: block;
            animation: shakePhone 0.8s ease;
        }

        .shake-animation .big-emoji {
            font-size: 3.8rem;
            display: block;
            animation: bounce 0.6s ease infinite alternate;
        }

        .shake-animation .text {
            color: #b3416e;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        /* ===== پیام موقت ===== */
        .temp-message {
            text-align: center;
            padding: 14px;
            margin: 10px 0 0;
            background: rgba(212, 63, 107, 0.08);
            border-radius: 18px;
            border: 1px solid rgba(212, 63, 107, 0.15);
            animation: fadeIn 0.4s ease;
        }

        .temp-message .big {
            font-size: 2.4rem;
            display: block;
        }

        .temp-message .text {
            color: #3a1a2a;
            font-size: 1rem;
        }

        /* ===== پایان ===== */
        .final-box {
            display: none;
            text-align: center;
            padding: 20px 10px;
            animation: fadeIn 0.7s ease;
        }

        .final-box.show {
            display: block;
        }

        .final-box .emoji-big {
            font-size: 4rem;
            display: block;
            margin-bottom: 12px;
        }

        .final-box .big-text {
            font-size: 1.7rem;
            color: #a02c5a;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .final-box .sub-text {
            color: #6a3a4a;
            font-size: 1rem;
            margin-bottom: 18px;
            line-height: 1.8;
        }

        .btn-send {
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #d43f6b, #a02c5a);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(160, 44, 90, 0.3);
            font-family: inherit;
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== انیمیشن‌ها ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-14px);
            }
            40% {
                transform: translateX(14px);
            }
            60% {
                transform: translateX(-10px);
            }
            80% {
                transform: translateX(10px);
            }
        }

        @keyframes shakePhone {
            0% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-14deg) scale(1.08);
            }
            50% {
                transform: rotate(14deg) scale(1.08);
            }
            75% {
                transform: rotate(-8deg) scale(1.04);
            }
            100% {
                transform: rotate(0deg) scale(1);
            }
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-18px);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }
            .question-text {
                font-size: 1rem;
            }
            .option-btn {
                font-size: 0.85rem;
                padding: 12px 14px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .shake-btn {
                padding: 12px 22px;
                font-size: 0.9rem;
            }
            .final-box .big-text {
                font-size: 1.3rem;
            }
            .heart-bg span {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 12px 8px;
            }
            .question-text {
                font-size: 0.9rem;
            }
            .option-btn {
                font-size: 0.8rem;
                padding: 10px 10px;
            }
            .shake-btn {
                padding: 10px 18px;
                font-size: 0.8rem;
            }
        }

        ::-webkit-scrollbar {
            width: 0;
        }
    </style>
</head>
<body>
    <!-- ===== قلب‌های پس‌زمینه ===== -->
    <div class="heart-bg" id="heartBg"></div>

    <div class="container">

        <!-- ===== هدر ===== -->
        <div class="header">
            <h1>🎮 چقدر منو بلدی؟</h1>
            <div class="subtitle">💖 با ریحانه جان</div>
        </div>

        <!-- ===== پروگرس ===== -->
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-dot active" data-i="0"></div>
            <div class="progress-dot" data-i="1"></div>
            <div class="progress-dot" data-i="2"></div>
            <div class="progress-dot" data-i="3"></div>
            <div class="progress-dot" data-i="4"></div>
            <div class="progress-dot" data-i="5"></div>
            <div class="progress-dot" data-i="6"></div>
            <div class="progress-dot" data-i="7"></div>
            <div class="progress-dot" data-i="8"></div>
            <div class="progress-dot" data-i="9"></div>
        </div>
        <div class="counter-text" id="counterText">سوال 1 از 10</div>

        <!-- ===== دکمه تکان دادن ===== -->
        <div class="shake-btn-wrap" id="shakeBtnWrap">
            <button class="shake-btn" id="shakeBtn">
                <span class="icon">📱</span>
                گوشی رو تکون بده!
            </button>
        </div>

        <!-- ===== انیمیشن تکان ===== -->
        <div class="shake-animation" id="shakeAnim">
            <span class="big-emoji">📱</span>
            <div class="text">🌀 داره تکون میخوره...</div>
        </div>

        <!-- ===== جای سوالات ===== -->
        <div id="questionContainer"></div>

        <!-- ===== باکس پایان ===== -->
        <div class="final-box" id="finalBox">
            <span class="emoji-big">🎉</span>
            <div class="big-text">آفرین عزیزم! 😎🔥</div>
            <div class="sub-text" id="finalSubText">
                یعنی واقعاً منو بلدی!<br>
                بیا بریم یه بستنی باحال بخوریم! 🍦
            </div>
            <button class="btn-send" id="sendBtn">📨 بفرست براش</button>
        </div>

    </div>

    <script>
        // ============================================================
        //  قلب‌های شناور
        // ============================================================
        (function createHearts() {
            const bg = document.getElementById('heartBg');
            const icons = ['❤️', '💖', '💗', '💓', '🌸', '🌺'];
            for (let i = 0; i < 24; i++) {
                const span = document.createElement('span');
                span.textContent = icons[Math.floor(Math.random() * icons.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.fontSize = (1.4 + Math.random() * 3) + 'rem';
                span.style.animationDuration = (10 + Math.random() * 18) + 's';
                span.style.animationDelay = (Math.random() * 12) + 's';
                bg.appendChild(span);
            }
        })();

        // ============================================================
        //  دیتا (۱۰ سوال)
        // ============================================================
        const questions = [{
            text: 'چرا بعضی وقتا وقتی میای خونه‌ی ننه، بهم محل نمیدی؟',
            needsShake: true,
            options: [
                'چون خیلی با هم صمیمی نیستیم',
                'چون به اندازه‌ی کافی خوب نیستم توی حرف زدن',
                'چون اصن آدم بامزه‌ای نیستم و خجالتیم و اصن حرف زدن بلد نیستم و خیلی خجالت میکشم با تو حرف بزنم امیر جان 😅'
            ],
            correctIndex: 2,
            emoji: '😂',
            feedback: 'آفرین امیر جان! اینو که میدونستم!'
        }, {
            text: 'چرا بعضی وقتا به پیامام جواب نمیدی؟',
            needsShake: false,
            options: [
                'چون حوصله‌ام سر میره',
                'چون دوست ندارم با کسی حرف بزنم',
                'چون وقتی پیامت میاد، یادم میره همه‌چی و فقط بهت فکر میکنم عزیز دلم 💙'
            ],
            correctIndex: 2,
            emoji: '💙',
            feedback: 'ایول! این رو هم بلدی!'
        }, {
            text: 'چرا بعضی وقتا اینقدر باحالی؟',
            needsShake: true,
            options: [
                'چون خوش شانسی آوردم',
                'چون آدم خاصی هستم',
                'چون تو هستی که باعث میشی من باحال باشم داداش گلم 🤩'
            ],
            correctIndex: 2,
            emoji: '🤩',
            feedback: 'آفرین امیر جان! تو هم باحالی!'
        }, {
            text: 'به نظرت چرا انقدر بهت فکر میکنم؟',
            needsShake: false,
            options: [
                'چون کاری ندارم',
                'چون تو رو دوست دارم',
                'چون تو یکی از خاص‌ترین آدم‌های زندگیم شدی امیر جان عزیز ❤️'
            ],
            correctIndex: 2,
            emoji: '❤️',
            feedback: 'دقیقاً! تو خاصی!'
        }, {
            text: 'چرا با تو راحت‌تر از بقیه حرف می‌زنم؟',
            needsShake: true,
            options: [
                'چون حوصله‌ام سر میره',
                'چون تو به حرفام گوش می‌دی',
                'چون با تو بودن، یعنی امنیت، یعنی آرامش، یعنی خونه رفیق عزیزم 🏠'
            ],
            correctIndex: 2,
            emoji: '🏠',
            feedback: 'آفرین! اینو خوب فهمیدی!'
        }, {
            text: 'چرا بعضی وقتا دلم میخواد باهات باشم؟',
            needsShake: false,
            options: [
                'چون کاری ندارم',
                'چون خوش میگذره',
                'چون کنار تو بودن، یعنی بهترین لحظه‌های زندگیم امیر جان گلم 💫'
            ],
            correctIndex: 2,
            emoji: '💫',
            feedback: 'ایول! اینو هم بلدی!'
        }, {
            text: 'چرا وقتی حالت بده، اولین کسی که بهش فکر میکنی منم؟',
            needsShake: true,
            options: [
                'چون بهت می‌خنده',
                'چون حوصله‌ات رو ندارم',
                'چون میدونم همیشه میتونم بهت تکیه کنم امیر جان مهربون 🌸'
            ],
            correctIndex: 2,
            emoji: '🌸',
            feedback: 'آفرین امیر جان! اینو خوب بلدی!'
        }, {
            text: 'چرا بعضی وقتا باهام اینقدر راحت صحبت میکنی؟',
            needsShake: false,
            options: [
                'چون مجبوری',
                'چون کس دیگه‌ای نیست',
                'چون میدونم هیچوقت قضاوت نمیکنی و همیشه درکم میکنی امیر جان عزیز 💎'
            ],
            correctIndex: 2,
            emoji: '💎',
            feedback: 'دقیقاً! تو همیشه درکم میکنی!'
        }, {
            text: 'چرا انقدر برام ارزش قائلی؟',
            needsShake: true,
            options: [
                'چون وقت دارم',
                'چون کار خاصی نیست',
                'چون میدونم تو یکی از بهترین چیزایی هستی که توی زندگیم اتفاق افتاده امیر جان گلم 🌟'
            ],
            correctIndex: 2,
            emoji: '🌟',
            feedback: 'آفرین! اینو که میدونستم!'
        }, {
            text: 'چرا بعضی وقتا دلم میخواد برات آهنگ بخونم؟',
            needsShake: false,
            options: [
                'چون حوصل‌ام سر رفته',
                'چون کار خاصی نیست',
                'چون میدونم با خوندن آهنگ میتونم لبخند رو لبات بیارم امیر جان عزیز 🎵'
            ],
            correctIndex: 2,
            emoji: '🎵',
            feedback: 'ایول! این رو هم بلدی!'
        }];

        // ============================================================
        //  عناصر DOM
        // ============================================================
        const container = document.getElementById('questionContainer');
        const progressDots = document.querySelectorAll('.progress-dot');
        const counterText = document.getElementById('counterText');
        const shakeBtnWrap = document.getElementById('shakeBtnWrap');
        const shakeBtn = document.getElementById('shakeBtn');
        const shakeAnim = document.getElementById('shakeAnim');
        const finalBox = document.getElementById('finalBox');
        const finalSubText = document.getElementById('finalSubText');
        const sendBtn = document.getElementById('sendBtn');

        let currentIndex = 0;
        let isLocked = false; // جلوگیری از کلیک‌های همزمان
        let totalCorrect = 0;
        let answersLog = [];
        let isShaking = false;

        // ============================================================
        //  توابع اصلی
        // ============================================================

        function updateProgress(index) {
            progressDots.forEach((dot, i) => {
                dot.classList.remove('active', 'done', 'wrong');
                if (i === index) {
                    dot.classList.add('active');
                } else if (i < index) {
                    dot.classList.add('done');
                }
            });
            counterText.textContent = `سوال ${index + 1} از ${questions.length}`;
        }

        function renderQuestion(index) {
            // اگر به آخر رسیدیم
            if (index >= questions.length) {
                showFinal();
                return;
            }

            const q = questions[index];
            isLocked = false;

            // مخفی کردن انیمیشن تکان
            shakeAnim.classList.remove('show');

            // مدیریت دکمه تکان دادن
            if (q.needsShake) {
                shakeBtnWrap.style.display = 'block';
                shakeBtn.disabled = false;
                shakeBtn.innerHTML = `<span class="icon">📱</span> گوشی رو تکون بده!`;
                // گزینه‌ها رو مخفی نگه دار تا تکان بخوره
                container.innerHTML = `
                    <div class="question-box show" id="qbox">
                        <div class="question-text">
                            <span class="emoji">🤔</span>
                            ${q.text}
                        </div>
                        <div class="options" id="optionsContainer"></div>
                    </div>
                `;
                // گزینه‌ها رو خالی میذاریم تا بعد از تکان پر بشن
                document.getElementById('optionsContainer').innerHTML = '';
            } else {
                shakeBtnWrap.style.display = 'none';
                // مستقیم گزینه‌ها رو نشون بده
                container.innerHTML = `
                    <div class="question-box show" id="qbox">
                        <div class="question-text">
                            <span class="emoji">🤔</span>
                            ${q.text}
                        </div>
                        <div class="options" id="optionsContainer"></div>
                    </div>
                `;
                renderOptions(index);
            }

            updateProgress(index);
        }

        function renderOptions(index) {
            const q = questions[index];
            const optionsContainer = document.getElementById('optionsContainer');
            if (!optionsContainer) return;

            let html = '';
            q.options.forEach((opt, i) => {
                const isCorrect = (i === q.correctIndex);
                const cls = isCorrect ? 'option-btn correct-option' : 'option-btn';
                html += `<button class="${cls}" data-i="${i}" data-correct="${isCorrect}">${opt}</button>`;
            });
            optionsContainer.innerHTML = html;

            // رویداد برای گزینه‌ها
            optionsContainer.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    if (isLocked) return;
                    const isCorrect = this.dataset.correct === 'true';
                    const optIndex = parseInt(this.dataset.i);
                    handleOptionClick(this, optIndex, isCorrect, index);
                });
            });
        }

        function handleOptionClick(btn, optIndex, isCorrect, index) {
            if (isLocked) return;
            isLocked = true;

            const q = questions[index];
            const allOptions = btn.parentElement.querySelectorAll('.option-btn');

            if (isCorrect) {
                // پاسخ درست
                btn.classList.add('selected-correct');
                totalCorrect++;
                answersLog.push({
                    question: q.text,
                    answer: q.options[optIndex],
                    correct: true
                });

                // نمایش پیام موفقیت
                showTempMessage(q.emoji, q.feedback);

                // بعد از ۱.۵ ثانیه برو سوال بعد
                setTimeout(() => {
                    goToNext(index);
                }, 1500);

            } else {
                // پاسخ اشتباه
                btn.classList.add('selected-wrong');

                // علامت روی پروگرس
                progressDots.forEach((dot, i) => {
                    if (i === index) {
                        dot.classList.remove('active');
                        dot.classList.add('wrong');
                    }
                });

                // غیرفعال کردن همه گزینه‌ها
                allOptions.forEach(b => {
                    b.style.pointerEvents = 'none';
                    b.style.opacity = '0.3';
                });

                // نمایش گزینه درست
                allOptions.forEach((b, i) => {
                    if (i === q.correctIndex) {
                        b.classList.add('reveal-correct');
                        b.style.opacity = '1';
                    }
                });

                answersLog.push({
                    question: q.text,
                    answer: q.options[optIndex],
                    correct: false
                });

                // بعد از ۲ ثانیه برو سوال بعد
                setTimeout(() => {
                    goToNext(index);
                }, 2000);
            }
        }

        function showTempMessage(emoji, text) {
            // حذف پیام قبلی
            const old = document.querySelector('.temp-message');
            if (old) old.remove();

            const div = document.createElement('div');
            div.className = 'temp-message';
            div.innerHTML = `
                <span class="big">${emoji}</span>
                <span class="text">${text}</span>
            `;
            const qbox = document.getElementById('qbox');
            if (qbox) qbox.appendChild(div);
        }

        function goToNext(index) {
            const next = index + 1;
            if (next < questions.length) {
                renderQuestion(next);
            } else {
                showFinal();
            }
        }

        function showFinal() {
            container.innerHTML = '';
            shakeBtnWrap.style.display = 'none';
            document.querySelector('.progress-wrap').style.display = 'none';
            counterText.style.display = 'none';

            finalBox.classList.add('show');
            finalSubText.innerHTML = `
                از ۱۰ تا سوال، <strong style="color:#d43f6b;">${totalCorrect}</strong> تاش رو درست جواب دادی!<br>
                یعنی واقعاً منو بلدی! 😎<br>
                بیا بریم یه بستنی باحال بخوریم! 🍦
            `;
        }

        // ============================================================
        //  دکمه تکان دادن
        // ============================================================
        shakeBtn.addEventListener('click', function() {
            if (isShaking) return;
            const q = questions[currentIndex];
            if (!q || !q.needsShake) return;

            isShaking = true;
            this.disabled = true;
            this.innerHTML = `<span class="icon">🌀</span> داره تکون میخوره...`;

            // نمایش انیمیشن تکان
            shakeAnim.classList.add('show');

            // لرزش گوشی (اگه پشتیبانی کنه)
            if (navigator.vibrate) {
                navigator.vibrate([80, 40, 80, 40, 150]);
            }

            // بعد از ۱ ثانیه گزینه‌ها رو نشون بده
            setTimeout(() => {
                shakeAnim.classList.remove('show');
                shakeBtnWrap.style.display = 'none';
                isShaking = false;
                renderOptions(currentIndex);
            }, 1100);
        });

        // ============================================================
        //  دکمه ارسال
        // ============================================================
        sendBtn.addEventListener('click', function() {
            const log = {
                time: new Date().toLocaleString('fa-IR'),
                totalCorrect: totalCorrect,
                answers: answersLog
            };
            localStorage.setItem('amirGameLog', JSON.stringify(log));

            this.disabled = true;
            this.textContent = '✅ ارسال شد!';
            this.style.opacity = '0.5';

            finalSubText.innerHTML += `<br><br><span style="color:#d43f6b;">❤️ برات فرستادم عزیزم!</span>`;

            setTimeout(() => {
                alert('😍 ارسال شد! منتظرتم عزیزم!');
            }, 400);
        });

        // ============================================================
        //  شروع بازی
        // ============================================================
        renderQuestion(0);

        // ============================================================
        //  جلوگیری از خروج
        // ============================================================
        window.addEventListener('beforeunload', function(e) {
            e.preventDefault();
            e.returnValue = '';
        });

        console.log('🎮 بازی چقدر منو بلدی؟ (نسخه جدید بدون باگ)');
    </script>
</body>
</html>
