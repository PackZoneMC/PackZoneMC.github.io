<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackZone MC | McMeta Builder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1040 40%, #0d0d2b 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            padding: 40px 20px 30px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 30px;
        }

        .main-logo {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .hero h2 {
            color: #fff;
            font-size: 1.8rem;
            margin-top: 10px;
        }

        .hero p {
            color: #aaa;
            margin-top: 8px;
        }

        .home-button {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            color: #ddd;
            padding: 8px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.95rem;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .home-button:hover {
            background: rgba(108, 92, 231, 0.25);
            border-color: #6c5ce7;
            color: #fff;
            transform: scale(1.05);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            text-align: center;
        }

        .card:hover {
            border-color: rgba(108, 92, 231, 0.2);
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.05);
        }

        .card h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #7ec8ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card p {
            color: #aaa;
            font-size: 1.1rem;
            line-height: 2;
        }

        .btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.15);
        }

        .btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 35px rgba(108, 92, 231, 0.3);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .main-logo {
                font-size: 1.8rem;
            }
            .hero h2 {
                font-size: 1.3rem;
            }
            .card {
                padding: 30px 20px;
            }
            .card h1 {
                font-size: 1.8rem;
            }
            .btn {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <section class="hero">
            <h1 class="main-logo">💙 PackZone MC</h1>
            <a href="index.html" class="home-button">🏠 خانه</a>
            <h2>📄 ساخت McMeta</h2>
            <p>فایل pack.mcmeta رو برای جاوا بساز</p>
        </section>

        <div class="card">
            <h1>💙 سلام!</h1>
            <p>به بخش ساخت McMeta خوش آمدی.</p>
            <p>این صفحه به‌زودی کامل میشه.</p>
            <button class="btn" onclick="alert('سلام داداش! 😊')">کلیک کن</button>
        </div>

        <footer>© PackZone MC 💙</footer>

    </div>
</body>

</html>
