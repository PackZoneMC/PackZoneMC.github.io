<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px;
            background: rgba(13, 32, 56, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid rgba(0, 140, 255, 0.2);
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7ec8ff, #008cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(0, 140, 255, 0.1);
        }

        .nav-links .btn-dashboard {
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            padding: 8px 20px;
            border-radius: 10px;
            font-weight: 600;
        }

        .nav-links .btn-dashboard:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.25);
            background: none;
        }

        .nav-links .user-name {
            color: #7ec8ff;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 6px 12px;
            background: rgba(0, 140, 255, 0.08);
            border-radius: 20px;
            border: 1px solid rgba(0, 140, 255, 0.1);
        }

        .logout-btn {
            background: rgba(255, 23, 68, 0.12);
            color: #ff1744;
            border: 1px solid rgba(255, 23, 68, 0.2);
            padding: 6px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
            font-family: inherit;
        }

        .logout-btn:hover {
            background: #ff1744;
            color: #fff;
            border-color: #ff1744;
            transform: scale(1.05);
        }

        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 40px 20px;
        }

        .profile-box {
            background: rgba(13, 32, 56, 0.6);
            backdrop-filter: blur(16px);
            padding: 40px 35px;
            border-radius: 28px;
            border: 1px solid rgba(0, 140, 255, 0.12);
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 140, 255, 0.04);
            transition: all 0.4s ease;
        }

        .profile-box:hover {
            border-color: rgba(0, 140, 255, 0.25);
            box-shadow: 0 25px 100px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 140, 255, 0.06);
        }

        .profile-box h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #7ec8ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-avatar {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .profile-avatar .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .profile-avatar img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(135deg, #008cff, #6c3cff) padding-box,
                linear-gradient(135deg, #008cff, #6c3cff, #a29bfe) border-box;
            object-fit: cover;
            transition: all 0.4s ease;
            box-shadow: 0 0 40px rgba(0, 140, 255, 0.15);
        }

        .profile-avatar img:hover {
            transform: scale(1.04);
            box-shadow: 0 0 60px rgba(0, 140, 255, 0.25);
        }

        .avatar-upload-btn {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            border: 2px solid #0d2038;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 140, 255, 0.3);
        }

        .avatar-upload-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 140, 255, 0.4);
        }

        .avatar-upload-btn input {
            display: none;
        }

        .profile-info {
            margin-bottom: 22px;
        }

        .profile-info .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-info .info-row:last-child {
            border-bottom: none;
        }

        .profile-info .info-label {
            color: #9ecfff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info .info-value {
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            background: rgba(0, 140, 255, 0.05);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 140, 255, 0.06);
        }

        .profile-info .info-value.editable {
            cursor: pointer;
            transition: all 0.3s ease;
            border-style: dashed;
            border-color: rgba(0, 140, 255, 0.15);
        }

        .profile-info .info-value.editable:hover {
            background: rgba(0, 140, 255, 0.12);
            border-color: #008cff;
        }

        .profile-info .info-value .edit-icon {
            font-size: 0.7rem;
            opacity: 0.4;
            margin-right: 6px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .profile-stats .stat-item {
            text-align: center;
        }

        .profile-stats .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7ec8ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-stats .stat-label {
            font-size: 0.7rem;
            color: #9ecfff;
            opacity: 0.6;
            margin-top: 2px;
        }

        .favorites-section {
            margin: 18px 0;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .favorites-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .favorites-section h2 {
            color: #7ec8ff;
            font-size: 1rem;
            font-weight: 600;
        }

        .favorites-section .favorite-count {
            font-size: 0.75rem;
            color: #9ecfff;
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 20px;
        }

        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .favorites-list .empty-msg {
            color: #9ecfff;
            text-align: center;
            padding: 16px;
            opacity: 0.4;
            font-size: 0.85rem;
        }

        .favorite-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .favorite-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 140, 255, 0.1);
        }

        .favorite-item span {
            color: #7ec8ff;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .favorite-item .remove-btn {
            background: rgba(255, 23, 68, 0.1);
            color: #ff1744;
            border: 1px solid rgba(255, 23, 68, 0.15);
            padding: 3px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.3s;
            font-family: inherit;
        }

        .favorite-item .remove-btn:hover {
            background: #ff1744;
            color: #fff;
            border-color: #ff1744;
        }

        .profile-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .profile-actions .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .profile-actions .btn-primary {
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
        }

        .profile-actions .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 140, 255, 0.25);
        }

        .profile-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #9ecfff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .profile-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .profile-actions .btn-gold {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
            color: #1a1a2e;
        }

        .profile-actions .btn-gold:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(243, 156, 18, 0.25);
        }

        .profile-actions .btn-danger {
            background: linear-gradient(135deg, #ff1744, #d50000);
            color: #fff;
        }

        .profile-actions .btn-danger:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(255, 23, 68, 0.25);
        }

        .profile-actions .btn-full {
            grid-column: 1 / -1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.open {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-box {
            background: #0d2038;
            padding: 32px 30px;
            border-radius: 24px;
            border: 1px solid rgba(0, 140, 255, 0.15);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
        }

        .modal-box h2 {
            color: #7ec8ff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #061220;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
            transition: 0.3s;
        }

        .modal-box input:focus {
            border-color: #008cff;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .modal-actions .btn-primary {
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
        }

        .modal-actions .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(0, 140, 255, 0.25);
        }

        .modal-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            color: #9ecfff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0d2038;
            border: 1px solid #008cff;
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.success {
            border-color: #00c853;
        }

        .footer {
            text-align: center;
            padding: 16px;
            color: rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            margin-top: auto;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .header {
                padding: 10px 16px;
                flex-direction: column;
                gap: 8px;
            }
            .nav-links {
                justify-content: center;
                gap: 8px;
            }
            .nav-links a {
                font-size: 0.8rem;
                padding: 4px 10px;
            }
            .nav-links .user-name {
                font-size: 0.8rem;
                padding: 4px 10px;
            }
            .logout-btn {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
            .profile-box {
                padding: 24px 16px;
                border-radius: 20px;
            }
            .profile-box h1 {
                font-size: 1.4rem;
            }
            .profile-avatar img {
                width: 85px;
                height: 85px;
            }
            .profile-info .info-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 10px 0;
            }
            .profile-info .info-value {
                font-size: 0.85rem;
                padding: 4px 12px;
            }
            .profile-stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
                padding: 12px;
            }
            .profile-stats .stat-number {
                font-size: 1.2rem;
            }
            .profile-actions {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .profile-actions .btn {
                padding: 10px;
                font-size: 0.85rem;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .toast {
                min-width: 150px;
                padding: 12px 20px;
                font-size: 0.85rem;
            }
            .favorites-section {
                padding: 12px 14px;
            }
            .favorite-item {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ===== HEADER ===== -->
<header class="header" id="mainHeader">
    <div class="logo">💙 PackZone MC</div>
    <nav class="nav-links" id="navLinks">
        <!-- توسط JS پر میشه -->
    </nav>
</header>

<!-- ===== PROFILE ===== -->
<main class="profile-container">
    <section class="profile-box">
        <h1>👤 پروفایل</h1>

        <div class="profile-avatar">
            <div class="avatar-wrapper">
                <img id="profileAvatar" src="" alt="آواتار">
                <label class="avatar-upload-btn" title="آپلود عکس پروفایل">
                    📷
                    <input type="file" id="avatarInput" accept="image/*">
                </label>
            </div>
        </div>

        <div class="profile-info">
            <div class="info-row">
                <span class="info-label">👤 نام کاربری</span>
                <span class="info-value editable" id="profileName" onclick="openEditModal()">
                    <span id="profileNameText">---</span>
                    <span class="edit-icon">✏️</span>
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">📧 ایمیل</span>
                <span class="info-value" id="profileEmail">---</span>
            </div>
            <div class="info-row">
                <span class="info-label">📅 تاریخ عضویت</span>
                <span class="info-value" id="profileDate">---</span>
            </div>
        </div>

        <div class="profile-stats">
            <div class="stat-item">
                <div class="stat-number" id="statPacks">0</div>
                <div class="stat-label">پک ذخیره شده</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="statFavorites">0</div>
                <div class="stat-label">علاقه‌مندی</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="statDays">0</div>
                <div class="stat-label">روز عضویت</div>
            </div>
        </div>

        <div class="favorites-section">
            <div class="section-header">
                <h2>⭐ علاقه‌مندی‌ها</h2>
                <span class="favorite-count" id="favoriteCount">۰</span>
            </div>
            <div class="favorites-list" id="favoritesList">
                <p class="empty-msg">در حال بارگذاری...</p>
            </div>
        </div>

        <div class="profile-actions">
            <button class="btn btn-primary" onclick="openEditModal()">✏️ ویرایش نام</button>
            <button class="btn btn-secondary" onclick="openPasswordModal()">🔑 تغییر رمز</button>
            <a href="dashboard.html" class="btn btn-gold btn-full">📊 رفتن به داشبورد</a>
            <button class="btn btn-danger btn-full" onclick="confirmDeleteAccount()">🗑️ حذف حساب کاربری</button>
        </div>
    </section>
</main>

<!-- ===== MODALS ===== -->
<div class="modal" id="editModal">
    <div class="modal-box">
        <h2>✏️ ویرایش نام</h2>
        <input type="text" id="editNameInput" placeholder="نام جدید">
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="saveName()">💾 ذخیره</button>
            <button class="btn btn-secondary" onclick="closeModal('editModal')">انصراف</button>
        </div>
    </div>
</div>

<div class="modal" id="passwordModal">
    <div class="modal-box">
        <h2>🔑 تغییر رمز</h2>
        <input type="password" id="newPassInput" placeholder="رمز جدید (حداقل ۶ کاراکتر)">
        <input type="password" id="confirmPassInput" placeholder="تکرار رمز جدید">
        <div class="modal-actions">
            <button class="btn btn-primary" onclick="savePassword()">💾 ذخیره</button>
            <button class="btn btn-secondary" onclick="closeModal('passwordModal')">انصراف</button>
        </div>
    </div>
</div>

<footer class="footer">
    <p>© PackZone MC — تمامی حقوق محفوظ است</p>
</footer>
    <script>
        // ============================================================
        // ===== Toast System =====
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ============================================================
        // ===== Check User & Load Profile =====
        // ============================================================
        function checkUser() {
            const user = JSON.parse(localStorage.getItem('pzmc_current_user'));

            if (!user) {
                showToast('❌ شما وارد حساب خود نشده‌اید!', 'error');
                setTimeout(() => window.location.href = 'login.html', 1200);
                return;
            }

            const nav = document.getElementById('navLinks');
            nav.innerHTML = `
                <a href="dashboard.html" class="btn-dashboard">📊 داشبورد</a>
                <span class="user-name">${user.name || 'کاربر'}</span>
                <button class="logout-btn" onclick="logoutUser()">🚪 خروج</button>
            `;

            loadProfile(user);
        }

        // ============================================================
        // ===== Logout =====
        // ============================================================
        function logoutUser() {
            if (confirm('آیا مطمئن هستید که می‌خواهید خارج شوید؟')) {
                localStorage.removeItem('pzmc_current_user');
                showToast('👋 شما با موفقیت خارج شدید', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        }

        // ============================================================
        // ===== Load Profile =====
        // ============================================================
        function loadProfile(user) {
            document.getElementById('profileNameText').textContent = user.name || '---';
            document.getElementById('profileEmail').textContent = user.email || '---';
            document.getElementById('profileDate').textContent = user.createdAt || '---';

            const savedAvatar = localStorage.getItem('pzmc_avatar_' + user.email);
            if (savedAvatar) {
                document.getElementById('profileAvatar').src = savedAvatar;
            } else {
                document.getElementById('profileAvatar').src =
                    `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=008cff&color=fff&size=110&bold=true`;
            }

            updateStats(user);
            loadFavorites();
        }

        // ============================================================
        // ===== Update Stats =====
        // ============================================================
        function updateStats(user) {
            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const index = users.findIndex(u => u.email === user.email);

            if (index === -1) return;

            const userData = users[index];
            const favorites = userData.favorites || [];
            const packs = userData.packs || [];

            document.getElementById('statFavorites').textContent = favorites.length;
            document.getElementById('statPacks').textContent = packs.length;

            if (userData.createdAt) {
                try {
                    const joinDate = new Date(userData.createdAt.split('/').reverse().join('/'));
                    const now = new Date();
                    const diffTime = Math.abs(now - joinDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    document.getElementById('statDays').textContent = diffDays || 1;
                } catch {
                    document.getElementById('statDays').textContent = '۱';
                }
            } else {
                document.getElementById('statDays').textContent = '۱';
            }
        }

        // ============================================================
        // ===== Avatar Upload =====
        // ============================================================
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('❌ لطفاً یک عکس انتخاب کنید', 'error');
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                showToast('❌ حجم عکس نباید بیشتر از ۲ مگابایت باشد', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const imageData = event.target.result;
                document.getElementById('profileAvatar').src = imageData;
                const user = JSON.parse(localStorage.getItem('pzmc_current_user'));
                if (user) {
                    localStorage.setItem('pzmc_avatar_' + user.email, imageData);
                    showToast('✅ عکس پروفایل با موفقیت آپلود شد!', 'success');
                }
            };
            reader.readAsDataURL(file);
        });

        // ============================================================
        // ===== Modals =====
        // ============================================================
        function openEditModal() {
            const user = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (user) {
                document.getElementById('editNameInput').value = user.name || '';
            }
            document.getElementById('editModal').classList.add('open');
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.add('open');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('open');
        }

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                }
            });
        });

        // ============================================================
        // ===== Save Name =====
        // ============================================================
        function saveName() {
            const newName = document.getElementById('editNameInput').value.trim();

            if (!newName || newName.length < 3) {
                showToast('❌ نام باید حداقل ۳ کاراکتر باشد', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));

            const index = users.findIndex(u => u.email === currentUser.email);
            if (index !== -1) {
                users[index].name = newName;
                localStorage.setItem('pzmc_users', JSON.stringify(users));

                currentUser.name = newName;
                localStorage.setItem('pzmc_current_user', JSON.stringify(currentUser));

                showToast('✅ نام با موفقیت تغییر کرد!', 'success');
                closeModal('editModal');
                checkUser();
            }
        }

        // ============================================================
        // ===== Save Password =====
        // ============================================================
        function savePassword() {
            const newPass = document.getElementById('newPassInput').value;
            const confirmPass = document.getElementById('confirmPassInput').value;

            if (newPass.length < 6) {
                showToast('❌ رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
                return;
            }

            if (newPass !== confirmPass) {
                showToast('❌ رمز عبور و تکرار آن مطابقت ندارند', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));

            const index = users.findIndex(u => u.email === currentUser.email);
            if (index !== -1) {
                users[index].password = newPass;
                localStorage.setItem('pzmc_users', JSON.stringify(users));

                showToast('✅ رمز عبور با موفقیت تغییر کرد!', 'success');
                closeModal('passwordModal');
                document.getElementById('newPassInput').value = '';
                document.getElementById('confirmPassInput').value = '';
            }
        }

        // ============================================================
        // ===== Delete Account =====
        // ============================================================
        function confirmDeleteAccount() {
            if (!confirm('⚠️ آیا مطمئن هستید که می‌خواهید حساب خود را حذف کنید؟ این عمل غیرقابل بازگشت است!')) {
                return;
            }

            if (!confirm('⚠️ برای تأیید نهایی، دکمه "بله" را بزنید')) {
                return;
            }

            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (!currentUser) return;

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const newUsers = users.filter(u => u.email !== currentUser.email);

            localStorage.setItem('pzmc_users', JSON.stringify(newUsers));
            localStorage.removeItem('pzmc_current_user');
            localStorage.removeItem('pzmc_avatar_' + currentUser.email);

            showToast('🗑️ حساب کاربری شما با موفقیت حذف شد', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        }

        // ============================================================
        // ===== Favorites =====
        // ============================================================
        function loadFavorites() {
            const container = document.getElementById('favoritesList');
            const countEl = document.getElementById('favoriteCount');
            if (!container) return;

            const user = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (!user) {
                container.innerHTML = '<p class="empty-msg">❌ لطفاً وارد شوید</p>';
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const index = users.findIndex(u => u.email === user.email);

            if (index === -1) {
                container.innerHTML = '<p class="empty-msg">❌ کاربر پیدا نشد</p>';
                return;
            }

            const favorites = users[index].favorites || [];

            if (countEl) countEl.textContent = favorites.length;

            if (favorites.length === 0) {
                container.innerHTML = '<p class="empty-msg">⭐ شما هیچ پکی ذخیره نکرده‌اید</p>';
                return;
            }

            let html = '';
            favorites.forEach(pack => {
                html += `
                    <div class="favorite-item">
                        <span>⭐ ${pack}</span>
                        <button class="remove-btn" onclick="removeFavorite('${pack}')">✕ حذف</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // ===== Remove Favorite =====
        // ============================================================
        function removeFavorite(packName) {
            const user = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (!user) {
                showToast('❌ لطفاً اول وارد شوید', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const index = users.findIndex(u => u.email === user.email);

            if (index === -1) return;

            if (!users[index].favorites) return;

            const packIndex = users[index].favorites.indexOf(packName);
            if (packIndex === -1) return;

            users[index].favorites.splice(packIndex, 1);
            localStorage.setItem('pzmc_users', JSON.stringify(users));

            user.favorites = users[index].favorites;
            localStorage.setItem('pzmc_current_user', JSON.stringify(user));

            showToast(`🗑️ پک "${packName}" از علاقه‌مندی‌ها حذف شد`, 'success');
            loadFavorites();
            updateStats(user);
        }

        // ============================================================
        // ===== Init =====
        // ============================================================
        document.addEventListener('DOMContentLoaded', checkUser);

        document.getElementById('editNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveName();
        });

        document.getElementById('newPassInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') savePassword();
        });

        document.getElementById('confirmPassInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') savePassword();
        });
    </script>
</body>
</html>
