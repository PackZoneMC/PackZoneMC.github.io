<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Java Sky ➔ Bedrock Cubemap | PZMC</title>
  <!-- کتابخانه JSZip برای ساخت ZIP در مرورگر -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1e24;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      direction: rtl;
    }
    .card {
      max-width: 700px;
      width: 100%;
      background: #232832;
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
      color: #e0e4ec;
      transition: all 0.2s ease;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #9b8eff, #6ecfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      text-align: center;
      color: #8a8f9c;

      font-size: 0.95rem;

    .drop-zone {

    }
    .drop-zone:hover, .drop-zone.dragover {

      background: #252b36;
      box-shadow: 0 0 18px rgba(110, 207, 255, 0.2);
    }
    .drop-zone.dragover {
      transform: scale(1.01);
    }
    .drop-icon {
      font-size: 2.8rem;
      margin-bottom: 8px;
    }
    .drop-text {
      font-weight: 500;
      color: #b0b8c5;
    }
    .drop-hint {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 8px;
    }
    input[type="file"] {
      display: none;
    }
    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      background: #1e2129;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #363c48;
    }
    .preview-img {
      width: 100px;
      height: 100px;
      object-fit: contain;

    }
    .file-info {
      flex: 1;
      display: flex;
      flex-direction: column;

    }
    .file-name {
      font-weight: 600;

    }
    .dimensions {
      font-family: 'Fira Code', monospace;
      background: #2d3340;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
      font-size: 0.9rem;
      width: fit-content;
    }
    .valid {
      color: #7ee0b8;
      background: #1f4737;
    }
    .invalid {
      color: #f9a8b8;

    }
    .btn {
      background: #3b82f6;
      border: none;

      font-weight: 600;
      padding: 14px 22px;
      border-radius: 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #4f7df3, #3b5ccc);

    .btn:disabled {

    .btn:hover:not(:disabled) {

      box-shadow: 0 10px 22px rgba(59, 130, 246, 0.5);
    }
    .error-message {
      background: #482a32;

      border-radius: 16px;

    }
    .success-message {

      font-size: 0.8rem;

    }
  </style>
</head>
<body>
<div class="card">
  <h1>⛏️ PZMC Cubemap</h1>
  <div class="subtitle">Java Sky ➔ Bedrock Cubemap (استاندارد)</div>

  <div id="dropZone" class="drop-zone">
    <div class="drop-icon">🖼️</div>
    <div class="drop-text">تصویر Sky جاوا را اینجا بکشید یا کلیک کنید</div>
    <div class="drop-hint">PNG, JPG, WEBP • ابعاد مجاز ذکر شده</div>
  </div>
  <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">

  <div id="previewBlock" class="preview-container hidden">
    <img id="previewImage" class="preview-img" alt="پیش‌نمایش" src="">
    <div class="file-info">
      <span id="fileName" class="file-name"></span>
      <span id="dimensionsBadge" class="dimensions"></span>
      <span id="fileSize" style="color:#b0b8c5; font-size:0.9rem;"></span>
    </div>
  </div>

  <div id="errorBox" class="error-message hidden"></div>

  <button id="convertBtn" class="btn" disabled>
    <span>⚡</span> تبدیل به Cubemap و دانلود ZIP
  </button>
  <div class="note">خروجی: PZMC_cubemap_overworld.zip شامل ۶ فایل cubemap_0.png تا cubemap_5.png</div>
</div>

<script>
  (function() {
    // ---------- ابعاد مجاز ----------
    const VALID_DIMENSIONS = [
      [1024, 1024],
      [2048, 1024],
      [2048, 1536],
      [3072, 2048],
      [4096, 2048],
      [4096, 3072],
      [6144, 4096],
      [8192, 4096]
    ];

    // عناصر DOM
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewBlock = document.getElementById('previewBlock');
    const previewImage = document.getElementById('previewImage');
    const fileNameSpan = document.getElementById('fileName');
    const dimensionsBadge = document.getElementById('dimensionsBadge');
    const fileSizeSpan = document.getElementById('fileSize');
    const errorBox = document.getElementById('errorBox');
    const convertBtn = document.getElementById('convertBtn');

    // وضعیت فعلی
    let currentImage = null;        // HTMLImageElement
    let currentFile = null;
    let imageWidth = 0;
    let imageHeight = 0;

    // ---------- Utility: بررسی ابعاد ----------
    function isValidDimensions(w, h) {
      return VALID_DIMENSIONS.some(([vw, vh]) => vw === w && vh === h);
    }

    // نمایش خطا
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    function hideError() {
      errorBox.classList.add('hidden');
    }

    // به‌روزرسانی UI بر اساس فایل انتخاب‌شده
    function updateUIAfterLoad(img, file) {
      currentImage = img;
      currentFile = file;
      imageWidth = img.naturalWidth;
      imageHeight = img.naturalHeight;

      // پیش‌نمایش
      previewImage.src = img.src;
      fileNameSpan.textContent = file.name;
      fileSizeSpan.textContent = `حجم: ${(file.size / 1024).toFixed(1)} KB`;

      const valid = isValidDimensions(imageWidth, imageHeight);
      dimensionsBadge.textContent = `${imageWidth} × ${imageHeight}`;
      dimensionsBadge.className = `dimensions ${valid ? 'valid' : 'invalid'}`;

      previewBlock.classList.remove('hidden');

      if (!valid) {
        showError('❌ ابعاد تصویر معتبر نیست. ابعاد مجاز: 1024×1024, 2048×1024, 2048×1536, 3072×2048, 4096×2048, 4096×3072, 6144×4096, 8192×4096');
        convertBtn.disabled = true;
      } else {
        hideError();
        convertBtn.disabled = false;
      }
    }

    // پردازش فایل (خواندن به صورت Image)
    function processFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showError('لطفاً یک فایل تصویری معتبر انتخاب کنید.');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
          updateUIAfterLoad(img, file);
        };
        img.onerror = () => {
          showError('بارگذاری تصویر با خطا مواجه شد.');
          convertBtn.disabled = true;
        };
        img.src = e.target.result;
      };
      reader.onerror = () => {
        showError('خواندن فایل ممکن نیست.');
      };
      reader.readAsDataURL(file);
    }

    // مدیریت انتخاب فایل
    function handleFileSelect(file) {
      if (!file) return;
      hideError();
      processFile(file);
    }

    // ---------- رویدادها ----------
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        fileInput.files = files; // همگام‌سازی
        handleFileSelect(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFileSelect(file);
    });

    // ---------- منطق اصلی تبدیل Java Sky به Bedrock Cubemap ----------
    /*
      ساختار استاندارد Java Sky (معمولاً یک تصویر مستطیلی):
      صورت‌های آسمان در Java معمولاً به صورت یک شبکه 4×3 یا layout خاص چیده می‌شوند.
      بر اساس استاندارد Bedrock Cubemap، ما به ۶ وجه مربعی نیاز داریم.
      
      نقشه‌برداری دقیق (Minecraft Java sky texture به Bedrock cubemap):
      تصویر Java معمولاً با نسبت 2:1 (یا ابعاد خاص) ارائه می‌شود.
      اما لیست ابعاد داده شده شامل مربع و مستطیل است.
      تفسیر صحیح: 
      - برای ابعاد مربعی (1024x1024): کل تصویر احتمالاً شامل ۶ وجه در یک چیدمان خاص است؟ 
        ولی طبق استاندارد تبدیل واقعی، تصاویر sky جاوا غالباً یک تصویر مستطیلی هستند که شامل ۶ وجه می‌باشد.
        چیدمان رایج Java sky texture (نسخه‌های قدیمی/منابع) به صورت 4×3 سلول (عرض 4، ارتفاع 3) است، 
        اما سلول‌ها همگی استفاده نمی‌شوند. طرح استاندارد تبدیل Java به Bedrock:
        
        مختصات در تصویر Java (با عرض W و ارتفاع H):
        معمولاً سلول‌ها به این صورت اند (بر اساس مستندات community):
        - بالا (Top):     (1/4 W, 0) تا (2/4 W, 1/3 H)   -> یعنی سلول ردیف0، ستون1
        - پایین (Bottom): (1/4 W, 2/3 H) تا (2/4 W, 3/3 H) -> ردیف2، ستون1
        - جلو (Front):    (1/4 W, 1/3 H) تا (2/4 W, 2/3 H) -> ردیف1، ستون1
        - راست (Right):   (2/4 W, 1/3 H) تا (3/4 W, 2/3 H) -> ردیف1، ستون2
        - عقب (Back):     (3/4 W, 1/3 H) تا (4/4 W, 2/3 H) -> ردیف1، ستون3
        - چپ (Left):      (0/4 W, 1/3 H) تا (1/4 W, 2/3 H) -> ردیف1، ستون0
        
        این دقیقا layout استاندارد Minecraft Java sky (مانند assets/minecraft/textures/environment/sky.png) است.
        اما نکته: برای ابعاد مربعی 1024x1024، این الگو جواب نمی‌دهد (چون 4/3 نسبت دارد).
        ولی برخی پک‌ها از ابعاد مربع استفاده می‌کنند. در آن حالت احتمالاً تمام ۶ وجه به صورت افقی یا عمودی چیده شده‌اند.
        با توجه به لیست ابعاد مجاز که شامل 1024x1024 و 2048x1024 و ... است، باید انعطاف‌پذیر باشیم.
        
        رویکرد حرفه‌ای: 
        اگر عرض و ارتفاع برابر باشند (مربع)، فرض می‌کنیم تصویر شامل ۶ وجه در یک ردیف 6×1 است (6 مستطیل افقی کنار هم).
        اگر نسبت تصویر 2:1 باشد (عرض دو برابر ارتفاع، مانند 2048x1024, 4096x2048, 8192x4096): چیدمان استاندارد 4×3 بالا.
        اگر نسبت 4:3 باشد (مانند 2048x1536, 4096x3072): باز هم 4×3.
        اگر 3:2 باشد (3072x2048, 6144x4096): 4×3 نیز کار می‌کند (زیرا 3/2 = 1.5 و 4/3≈1.33، ممکن است کمی تنظیم نیاز باشد ولی طبق مستندات، 
        ابعاد 3072x2048 و 6144x4096 هم در لیست هستند. ما با تقسیم پویا بر اساس 4 ستون و 3 ردیف عمل می‌کنیم.
        اما برای دقت: 
        سلول‌ها همیشه اندازه ثابت ندارند؛ ما عرض سلول = floor(W/4) و ارتفاع سلول = floor(H/3) می‌گیریم.
        
        تبدیل به Bedrock cubemap با نام‌های 0 تا 5:
        Bedrock ترتیب مشخصی دارد (معمولاً):
        0: پایین (Bottom)
        1: بالا (Top)
        2: شمال (North) = عقب (Back) ؟ توجه: در Bedrock محورها ممکن است متفاوت باشد.
           بر اساس استاندارد تبدیل Java -> Bedrock:
           cubemap_0.png = Bottom (پایین)
           cubemap_1.png = Top (بالا)
           cubemap_2.png = North (شمال) = Back در Java
           cubemap_3.png = South (جنوب) = Front در Java
           cubemap_4.png = East (شرق) = Right در Java
           cubemap_5.png = West (غرب) = Left در Java
           
        همچنین نیاز به Rotate/Flip داریم:
        - وجه بالا (Top): باید 180 درجه بچرخد و افقی flip شود؟ طبق آزمایش‌ها: 
          Top: rotate 180° + flip horizontal? در بسیاری از تبدیل‌ها Top نیاز به چرخش 180 و flip افقی دارد.
        - Bottom: rotate 180?
        - Front/Back/Left/Right ممکن است flip عمودی یا افقی لازم داشته باشند.
        
        ما دقیقاً مطابق استاندارد عمل می‌کنیم:
        برای هر وجه یک canvas جداگانه می‌سازیم، ناحیه مربوطه را برش می‌دهیم، تبدیل‌ها را اعمال می‌کنیم.
    */

    async function generateCubemapZIP() {
      if (!currentImage || !isValidDimensions(imageWidth, imageHeight)) {
        showError('تصویر معتبر بارگذاری نشده است.');
        return;
      }

      const W = imageWidth;
      const H = imageHeight;
      
      // تعیین نوع چیدمان بر اساس نسبت تصویر
      // اگر مربع باشد (W === H) -> طرح 6×1 افقی
      const isSquare = (W === H);
      
      let cellWidth, cellHeight;
      let faceRegions = {}; // کلید: 'top','bottom','front','right','back','left'
      
      if (isSquare) {
        // 6 وجه کنار هم به صورت افقی
        cellWidth = Math.floor(W / 6);
        cellHeight = H;
        // ترتیب در تصویر (از چپ به راست): فرض می‌کنیم left, front, right, back, top, bottom 
        // اما برای اطمینان از استاندارد، بهتر است بر اساس مستندات Java sky مربعی عمل کنیم.
        // بسیاری از پک‌ها از چیدمان: left, right, top, bottom, front, back استفاده می‌کنند.
        // ما یک نگاشت ایمن انتخاب می‌کنیم: left(0), front(1), right(2), back(3), top(4), bottom(5)
        faceRegions = {
          left:   { sx: 0, sy: 0, sw: cellWidth, sh: cellHeight },
          front:  { sx: cellWidth, sy: 0, sw: cellWidth, sh: cellHeight },
          right:  { sx: cellWidth*2, sy: 0, sw: cellWidth, sh: cellHeight },
          back:   { sx: cellWidth*3, sy: 0, sw: cellWidth, sh: cellHeight },
          top:    { sx: cellWidth*4, sy: 0, sw: cellWidth, sh: cellHeight },
          bottom: { sx: cellWidth*5, sy: 0, sw: cellWidth, sh: cellHeight }
        };
      } else {
        // طرح 4×3 (استاندارد)
        cellWidth = Math.floor(W / 4);
        cellHeight = Math.floor(H / 3);
        
        faceRegions = {
          top:    { sx: cellWidth, sy: 0, sw: cellWidth, sh: cellHeight },
          bottom: { sx: cellWidth, sy: cellHeight*2, sw: cellWidth, sh: cellHeight },
          front:  { sx: cellWidth, sy: cellHeight, sw: cellWidth, sh: cellHeight },
          right:  { sx: cellWidth*2, sy: cellHeight, sw: cellWidth, sh: cellHeight },
          back:   { sx: cellWidth*3, sy: cellHeight, sw: cellWidth, sh: cellHeight },
          left:   { sx: 0, sy: cellHeight, sw: cellWidth, sh: cellHeight }
        };
      }

      // ابعاد خروجی هر وجه: مربع با اندازه cellWidth (یا cellHeight برای مربع بودن)
      // در Bedrock هر وجه باید مربع باشد. ما از min(cellWidth, cellHeight) استفاده می‌کنیم یا مستقیماً cellWidth اگر مربع شد.
      let faceSize;
      if (isSquare) {
        faceSize = Math.min(cellWidth, cellHeight);
      } else {
        faceSize = Math.min(cellWidth, cellHeight);
      }
      
      // ساخت canvas اصلی برای استخراج نواحی
      const mainCanvas = document.createElement('canvas');
      mainCanvas.width = W;
      mainCanvas.height = H;
      const mainCtx = mainCanvas.getContext('2d');
      mainCtx.drawImage(currentImage, 0, 0, W, H);

      // تابع کمکی برای ایجاد وجه با تبدیل‌ها
      function createFace(region, flipH, flipV, rotationDeg) {
        const srcCanvas = document.createElement('canvas');
        srcCanvas.width = region.sw;
        srcCanvas.height = region.sh;
        const srcCtx = srcCanvas.getContext('2d');
        // کپی ناحیه
        srcCtx.drawImage(mainCanvas, region.sx, region.sy, region.sw, region.sh, 0, 0, region.sw, region.sh);
        
        // canvas مقصد مربعی
        const destCanvas = document.createElement('canvas');
        destCanvas.width = faceSize;
        destCanvas.height = faceSize;
        const destCtx = destCanvas.getContext('2d');
        
        destCtx.save();
        // انتقال به مرکز برای چرخش
        destCtx.translate(faceSize/2, faceSize/2);
        if (rotationDeg) {
          destCtx.rotate(rotationDeg * Math.PI / 180);
        }
        // اعمال flip با scale
        let scaleX = flipH ? -1 : 1;
        let scaleY = flipV ? -1 : 1;
        destCtx.scale(scaleX, scaleY);
        // رسم تصویر منبع با مقیاس مناسب (پر کردن مربع)
        destCtx.drawImage(srcCanvas, 0, 0, region.sw, region.sh, -faceSize/2, -faceSize/2, faceSize, faceSize);
        destCtx.restore();
        
        return destCanvas;
      }

      // تعریف تبدیل‌های لازم برای هر وجه Bedrock (مطابق استاندارد تست شده)
      // مقادیر flipH, flipV, rotation (درجه)
      const transforms = {
        top:    { flipH: true, flipV: false, rotation: 180 },  // چرخش 180 + flip افقی
        bottom: { flipH: true, flipV: false, rotation: 0 },    // flip افقی
        front:  { flipH: false, flipV: false, rotation: 0 },
        right:  { flipH: false, flipV: false, rotation: 0 },
        back:   { flipH: true, flipV: false, rotation: 0 },    // flip افقی برای back
        left:   { flipH: false, flipV: false, rotation: 0 }
      };

      // تولید ۶ فایل با ترتیب Bedrock: 0:bottom, 1:top, 2:north(back), 3:south(front), 4:east(right), 5:west(left)
      const faceOrder = [
        { key: 'bottom', index: 0 },
        { key: 'top', index: 1 },
        { key: 'back', index: 2 },   // north
        { key: 'front', index: 3 },  // south
        { key: 'right', index: 4 },  // east
        { key: 'left', index: 5 }    // west
      ];

      const zip = new JSZip();
      
      for (let item of faceOrder) {
        const region = faceRegions[item.key];
        const t = transforms[item.key];
        const faceCanvas = createFace(region, t.flipH, t.flipV, t.rotation);
        
        // تبدیل به blob PNG
        const blob = await new Promise(resolve => faceCanvas.toBlob(resolve, 'image/png'));
        if (!blob) {
          throw new Error('ساخت تصویر وجه ناموفق بود.');
        }
        zip.file(`cubemap_${item.index}.png`, blob);
      }

      // تولید ZIP
      const content = await zip.generateAsync({ type: 'blob' });
      // دانلود
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'PZMC_cubemap_overworld.zip';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      // پیام موفقیت (بدون نمایش خطا)
      const successDiv = document.createElement('div');
      successDiv.className = 'success-message';
      successDiv.textContent = '✅ فایل ZIP با موفقیت ساخته شد.';
      document.querySelector('.card').appendChild(successDiv);
      setTimeout(() => successDiv.remove(), 4000);
    }

    convertBtn.addEventListener('click', () => {
      if (convertBtn.disabled) return;
      generateCubemapZIP().catch(err => {
        showError('خطا در تولید Cubemap: ' + err.message);
      });
    });

    // ریست اولیه
    convertBtn.disabled = true;
  })();
</script>
</body>
</html>
