<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #0d2038;
            border-bottom: 2px solid #008cff;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7ec8ff;
        }

        .nav a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #008cff;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 75vh;
            padding: 30px 20px;
        }

        .auth-box {
            background: #0d2038;
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid #008cff;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 140, 255, 0.08);
        }

        .auth-box h1 {
            text-align: center;
            color: #7ec8ff;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #061220;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-box input:focus {
            border-color: #008cff;
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn-google:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-phone {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c853, #009624);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-phone:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .phone-section {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .phone-section.open {
            display: block;
        }

        .phone-section h3 {
            color: #7ec8ff;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .timer-text {
            text-align: center;
            color: #7ec8ff;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .recaptcha-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0d2038;
            border: 1px solid #008cff;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                padding: 12px 16px;
            }
            .nav a {
                margin: 0 6px;
                font-size: 0.9rem;
            }
            .auth-box {
                padding: 25px 18px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary,
            .btn-google,
            .btn-phone {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Toast Notification ===== -->
    <div class="toast" id="toast"></div>
<header class="header">
    <div class="logo">💙 PackZone MC</div>
    <nav class="nav">
        <a href="index.html">خانه</a>
        <a href="signup.html">ثبت‌نام</a>
        <a href="login.html" style="color:#7ec8ff;">ورود</a>
    </nav>
</header>

<main class="auth-container">
    <section class="auth-box">
        <h1>🔐 ورود</h1>

        <!-- ===== فرم ورود با ایمیل ===== -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">ایمیل</label>
                <input type="email" id="loginEmail" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label for="loginPass">رمز عبور</label>
                <input type="password" id="loginPass" placeholder="رمز عبور خود را وارد کنید" required>
            </div>
            <button type="submit" class="btn-primary" id="emailLoginBtn">ورود</button>
        </form>

        <!-- ===== خط جداکننده ===== -->
        <div class="divider">
            <span>یا</span>
        </div>

        <!-- ===== دکمه‌های ورود با گوگل و شماره ===== -->
        <div style="display:flex;flex-direction:column;gap:10px;">

            <button onclick="loginWithGoogle()" class="btn-google" id="googleBtn">
                <img src="https://www.google.com/favicon.ico" style="width:20px;height:20px;">
                ورود با گوگل
            </button>

            <button onclick="togglePhoneSection()" class="btn-phone" id="phoneToggleBtn">
                📱 ورود با شماره تلفن
            </button>

        </div>

        <!-- ===== بخش ورود با شماره تلفن ===== -->
        <div class="phone-section" id="phoneSection">
            <h3>📱 ورود با شماره تلفن</h3>
            <div class="form-group">
                <label for="phoneNumber">شماره تلفن</label>
                <input type="tel" id="phoneNumber" placeholder="09xxxxxxxxx" dir="ltr">
            </div>
            <div class="form-group" id="codeGroup" style="display:none;">
                <label for="phoneCode">کد تایید</label>
                <input type="text" id="phoneCode" placeholder="کد ۶ رقمی" dir="ltr" maxlength="6">
            </div>
            <div class="recaptcha-container" id="recaptchaContainer"></div>
            <button onclick="sendPhoneCode()" class="btn-primary" id="sendCodeBtn">📨 ارسال کد</button>
            <button onclick="verifyPhoneCode()" class="btn-primary" id="verifyCodeBtn" style="display:none;">✅ تایید کد</button>
            <div id="timerDisplay" class="timer-text"></div>
        </div>

        <p class="auth-footer">عضو نیستی؟ <a href="signup.html">ثبت‌نام</a></p>
    </section>
</main>

<footer class="footer">
    <p>© PackZone MC</p>
</footer>
    <script>
        // ============================================================
        // ===== Firebase Configuration =====
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBV9clBhPAMlcBhCS7DgfkotrgqsFrTNSA",
            authDomain: "packzonemc.firebaseapp.com",
            projectId: "packzonemc",
            storageBucket: "packzonemc.firebasestorage.app",
            messagingSenderId: "113323335089",
            appId: "1:113323335089:web:a710482a0153dd077d3190",
            measurementId: "G-WE3RFLBFCV"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ============================================================
        // ===== Toast =====
        // ============================================================
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.borderColor = isError ? '#e74c3c' : '#008cff';
            toast.style.border = isError ? '1px solid #e74c3c' : '1px solid #008cff';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        // ===== ورود با ایمیل =====
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('emailLoginBtn');

            if (!email || !password) {
                showToast('❌ لطفاً همه فیلدها را پر کنید', true);
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ در حال ورود...';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const userData = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || user.email.split('@')[0],
                    phone: user.phoneNumber || '',
                    photoURL: user.photoURL || ''
                };
                localStorage.setItem('pzmc_current_user', JSON.stringify(userData));

                showToast('✅ ورود موفق! خوش آمدید ' + userData.name);
                setTimeout(() => window.location.href = 'profile.html', 1000);

            } catch (error) {
                let msg = '❌ خطا در ورود';
                if (error.code === 'auth/user-not-found') msg = '❌ کاربری با این ایمیل یافت نشد';
                else if (error.code === 'auth/wrong-password') msg = '❌ رمز عبور اشتباه است';
                else if (error.code === 'auth/invalid-email') msg = '❌ فرمت ایمیل نامعتبر است';
                else if (error.code === 'auth/user-disabled') msg = '❌ این حساب کاربری غیرفعال شده است';
                else if (error.code === 'auth/too-many-requests') msg = '❌ درخواست‌های زیاد، لطفاً بعداً تلاش کن';
                else msg = '❌ ' + error.message;

                showToast(msg, true);
            }

            btn.disabled = false;
            btn.textContent = 'ورود';
        });

        // ============================================================
        // ===== ورود با گوگل =====
        // ============================================================
        async function loginWithGoogle() {
            const btn = document.getElementById('googleBtn');
            btn.disabled = true;
            btn.textContent = '⏳ در حال اتصال...';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');

                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                const userData = {
                    uid: user.uid,
                    email: user.email,
                    name: user.displayName || 'کاربر گوگل',
                    phone: user.phoneNumber || '',
                    photoURL: user.photoURL || '',
                    provider: 'google'
                };

                localStorage.setItem('pzmc_current_user', JSON.stringify(userData));

                showToast('✅ ورود با گوگل موفق! خوش آمدید ' + userData.name);
                setTimeout(() => window.location.href = 'profile.html', 1000);

            } catch (error) {
                let msg = '❌ خطا در ورود با گوگل';
                if (error.code === 'auth/popup-closed-by-user') {
                    msg = '❌ پنجره ورود بسته شد';
                } else if (error.code === 'auth/cancelled-popup-request') {
                    msg = '❌ درخواست ورود لغو شد';
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    msg = '❌ این ایمیل با روش دیگری ثبت شده است';
                } else {
                    msg = '❌ ' + error.message;
                }
                showToast(msg, true);
            }

            btn.disabled = false;
            btn.textContent = 'ورود با گوگل';
        }

        // ============================================================
        // ===== ورود با شماره تلفن =====
        // ============================================================
        let phoneData = { phone: '', verificationId: '', code: '' };
        let timerInterval = null;
        let recaptchaVerifier = null;

        function togglePhoneSection() {
            const section = document.getElementById('phoneSection');
            const isOpen = section.classList.toggle('open');

            if (isOpen) {
                if (!recaptchaVerifier) {
                    try {
                        recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptchaContainer', {
                            size: 'normal',
                            callback: function(response) {
                                document.getElementById('sendCodeBtn').disabled = false;
                            },
                            'expired-callback': function() {
                                document.getElementById('sendCodeBtn').disabled = true;
                            }
                        });
                        recaptchaVerifier.render();
                    } catch (e) {
                        console.log('reCAPTCHA already rendered');
                    }
                }
            }
        }

        async function sendPhoneCode() {
            const phoneInput = document.getElementById('phoneNumber');
            const phone = phoneInput.value.trim();
            const sendBtn = document.getElementById('sendCodeBtn');

            let formattedPhone = phone;
            if (phone.startsWith('09')) {
                formattedPhone = '+98' + phone.substring(1);
            } else if (phone.startsWith('9')) {
                formattedPhone = '+98' + phone;
            } else if (!phone.startsWith('+')) {
                formattedPhone = '+98' + phone;
            }

            if (!phone || phone.length < 10) {
                showToast('❌ لطفاً شماره تلفن معتبر وارد کنید', true);
                return;
            }

            if (!recaptchaVerifier) {
                showToast('❌ لطفاً منتظر بارگذاری reCAPTCHA باشید', true);
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ در حال ارسال...';

            try {
                const phoneProvider = new firebase.auth.PhoneAuthProvider();
                const verificationId = await phoneProvider.verifyPhoneNumber(
                    formattedPhone,
                    recaptchaVerifier
                );

                phoneData.phone = phone;
                phoneData.verificationId = verificationId;

                document.getElementById('codeGroup').style.display = 'block';
                document.getElementById('sendCodeBtn').style.display = 'none';
                document.getElementById('verifyCodeBtn').style.display = 'block';

                showToast('✅ کد تایید به شماره شما ارسال شد');
                startTimer(60);

            } catch (error) {
                let msg = '❌ خطا در ارسال کد';
                if (error.code === 'auth/invalid-phone-number') {
                    msg = '❌ شماره تلفن نامعتبر است';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = '❌ درخواست‌های زیاد، لطفاً بعداً تلاش کن';
                } else if (error.code === 'auth/captcha-check-failed') {
                    msg = '❌ تأیید کپچا ناموفق بود، دوباره تلاش کن';
                } else {
                    msg = '❌ ' + error.message;
                }
                showToast(msg, true);
                sendBtn.disabled = false;
                sendBtn.textContent = '📨 ارسال کد';
                recaptchaVerifier.clear();
                recaptchaVerifier = null;
            }
        }

        async function verifyPhoneCode() {
            const code = document.getElementById('phoneCode').value.trim();
            const verifyBtn = document.getElementById('verifyCodeBtn');

            if (!code || code.length < 6) {
                showToast('❌ لطفاً کد ۶ رقمی را وارد کنید', true);
                return;
            }

            if (!phoneData.verificationId) {
                showToast('❌ ابتدا کد تایید را دریافت کنید', true);
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = '⏳ در حال بررسی...';

            try {
                const credential = firebase.auth.PhoneAuthProvider.credential(
                    phoneData.verificationId,
                    code
                );

                const result = await auth.signInWithCredential(credential);
                const user = result.user;

                const userData = {
                    uid: user.uid,
                    email: user.email || 'phone_' + Date.now() + '@temp.com',
                    name: 'کاربر تلفن همراه',
                    phone: phoneData.phone,
                    photoURL: user.photoURL || '',
                    provider: 'phone'
                };

                localStorage.setItem('pzmc_current_user', JSON.stringify(userData));

                showToast('✅ ورود با شماره تلفن موفق! خوش آمدید');
                setTimeout(() => window.location.href = 'profile.html', 1000);

            } catch (error) {
                let msg = '❌ خطا در تأیید کد';
                if (error.code === 'auth/invalid-verification-code') {
                    msg = '❌ کد تایید اشتباه است';
                } else if (error.code === 'auth/expired-action-code') {
                    msg = '❌ کد تایید منقضی شده است، دوباره درخواست کن';
                } else {
                    msg = '❌ ' + error.message;
                }
                showToast(msg, true);
            }

            verifyBtn.disabled = false;
            verifyBtn.textContent = '✅ تایید کد';
        }

        // ============================================================
        // ===== تایمر =====
        // ============================================================
        function startTimer(seconds) {
            const timerDisplay = document.getElementById('timerDisplay');
            let remaining = seconds;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                remaining--;
                timerDisplay.textContent = `⏳ ارسال مجدد کد پس از ${remaining} ثانیه`;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = '📨 می‌توانید دوباره کد درخواست کنید';

                    document.getElementById('sendCodeBtn').style.display = 'block';
                    document.getElementById('sendCodeBtn').disabled = false;
                    document.getElementById('sendCodeBtn').textContent = '📨 ارسال مجدد کد';
                    document.getElementById('verifyCodeBtn').style.display = 'none';
                    document.getElementById('codeGroup').style.display = 'none';
                    phoneData.verificationId = '';
                }
            }, 1000);
        }

        // ============================================================
        // ===== بررسی وضعیت ورود =====
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                const userData = JSON.parse(localStorage.getItem('pzmc_current_user'));
                if (userData && window.location.pathname.includes('login.html')) {
                    window.location.href = 'profile.html';
                }
            }
        });

        // ============================================================
        // ===== پشتیبانی از Enter =====
        // ============================================================
        document.getElementById('phoneNumber').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (document.getElementById('sendCodeBtn').style.display !== 'none') {
                    sendPhoneCode();
                }
            }
        });

        document.getElementById('phoneCode').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (document.getElementById('verifyCodeBtn').style.display !== 'none') {
                    verifyPhoneCode();
                }
            }
        });
    </script>
</body>
</html>
