<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #0d2038;
            border-bottom: 2px solid #008cff;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7ec8ff;
        }

        .nav a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #008cff;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 75vh;
            padding: 30px 20px;
        }

        .auth-box {
            background: #0d2038;
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid #008cff;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 140, 255, 0.08);
        }

        .auth-box h1 {
            text-align: center;
            color: #7ec8ff;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #061220;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-box input:focus {
            border-color: #008cff;
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.2);
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
        }

        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .btn-phone {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c853, #009624);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-phone:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .phone-section {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .phone-section.open {
            display: block;
        }

        .phone-section h3 {
            color: #7ec8ff;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                padding: 12px 16px;
            }
            .nav a {
                margin: 0 6px;
                font-size: 0.9rem;
            }
            .auth-box {
                padding: 25px 18px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary,
            .btn-google,
            .btn-phone {
                padding: 12px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">💙 PackZone MC</div>
        <nav class="nav">
            <a href="index.html">خانه</a>
            <a href="signup.html">ثبت‌نام</a>
            <a href="login.html" style="color:#7ec8ff;">ورود</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-box">
            <h1>🔐 ورود</h1>

            <!-- ===== فرم ورود با ایمیل ===== -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">ایمیل</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPass">رمز عبور</label>
                    <input type="password" id="loginPass" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                <button type="submit" class="btn-primary">ورود</button>
            </form>

            <!-- ===== خط جداکننده ===== -->
            <div class="divider">
                <span>یا</span>
            </div>

            <!-- ===== دکمه‌های ورود با گوگل و شماره ===== -->
            <div style="display:flex;flex-direction:column;gap:10px;">

                <button onclick="loginWithGoogle()" class="btn-google">
                    <img src="https://www.google.com/favicon.ico" style="width:20px;height:20px;">
                    ورود با گوگل
                </button>

                <button onclick="togglePhoneSection()" class="btn-phone">
                    📱 ورود با شماره تلفن
                </button>

            </div>

            <!-- ===== بخش ورود با شماره تلفن ===== -->
            <div class="phone-section" id="phoneSection">
                <h3>📱 ورود با شماره تلفن</h3>
                <div class="form-group">
                    <label for="phoneNumber">شماره تلفن</label>
                    <input type="tel" id="phoneNumber" placeholder="09xxxxxxxxx">
                </div>
                <div class="form-group" id="codeGroup" style="display:none;">
                    <label for="phoneCode">کد تایید</label>
                    <input type="text" id="phoneCode" placeholder="کد ۶ رقمی">
                </div>
                <button onclick="sendPhoneCode()" class="btn-primary" id="sendCodeBtn">ارسال کد</button>
                <button onclick="verifyPhoneCode()" class="btn-primary" id="verifyCodeBtn" style="display:none;">تایید کد</button>
            </div>

            <p class="auth-footer">عضو نیستی؟ <a href="signup.html">ثبت‌نام</a></p>
        </section>
    </main>

    <footer class="footer">
        <p>© PackZone MC</p>
    </footer>

    <script>
        // ============================================================
        // ===== ورود با ایمیل و رمز =====
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;

            if (!email || !password) {
                alert('❌ لطفاً همه فیلدها را پر کنید');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                alert('❌ ایمیل یا رمز عبور اشتباه است');
                return;
            }

            localStorage.setItem('pzmc_current_user', JSON.stringify(user));
            alert('✅ ورود با موفقیت انجام شد! خوش آمدید ' + user.name);
            window.location.href = 'profile.html';
        });

        // ============================================================
        // ===== ورود با گوگل (شبیه‌سازی) =====
        // ============================================================
        function loginWithGoogle() {
            const googleUser = {
                name: 'کاربر گوگل',
                email: 'google_user_' + Date.now() + '@gmail.com',
                password: 'google_login',
                createdAt: new Date().toLocaleDateString('fa-IR')
            };

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const existingUser = users.find(u => u.email === googleUser.email);

            if (!existingUser) {
                users.push(googleUser);
                localStorage.setItem('pzmc_users', JSON.stringify(users));
            }

            localStorage.setItem('pzmc_current_user', JSON.stringify(googleUser));
            alert('✅ ورود با گوگل موفقیت‌آمیز بود! خوش آمدید ' + googleUser.name);
            window.location.href = 'profile.html';
        }

        // ============================================================
        // ===== ورود با شماره تلفن =====
        // ============================================================
        let phoneData = { phone: '', code: '' };

        function togglePhoneSection() {
            const section = document.getElementById('phoneSection');
            section.classList.toggle('open');
        }

        function sendPhoneCode() {
            const phone = document.getElementById('phoneNumber').value.trim();

            if (!phone || phone.length < 11) {
                alert('❌ لطفاً شماره تلفن معتبر وارد کنید');
                return;
            }

            phoneData.phone = phone;
            phoneData.code = Math.floor(100000 + Math.random() * 900000).toString();

            console.log('📱 کد تایید:', phoneData.code);

            alert('📱 کد تایید به شماره ' + phone + ' ارسال شد! (کد: ' + phoneData.code + ')');

            document.getElementById('codeGroup').style.display = 'block';
            document.getElementById('sendCodeBtn').style.display = 'none';
            document.getElementById('verifyCodeBtn').style.display = 'block';
        }

        function verifyPhoneCode() {
            const enteredCode = document.getElementById('phoneCode').value.trim();

            if (!enteredCode) {
                alert('❌ لطفاً کد تایید را وارد کنید');
                return;
            }

            if (enteredCode !== phoneData.code) {
                alert('❌ کد تایید اشتباه است');
                return;
            }

            const phoneUser = {
                name: 'کاربر تلفن همراه',
                email: 'phone_' + phoneData.phone + '@temp.com',
                phone: phoneData.phone,
                password: 'phone_login_' + phoneData.code,
                createdAt: new Date().toLocaleDateString('fa-IR')
            };

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const existingUser = users.find(u => u.phone === phoneData.phone);

            if (!existingUser) {
                users.push(phoneUser);
                localStorage.setItem('pzmc_users', JSON.stringify(users));
            }

            localStorage.setItem('pzmc_current_user', JSON.stringify(phoneUser));
            alert('✅ ورود با شماره تلفن موفقیت‌آمیز بود! خوش آمدید');
            window.location.href = 'profile.html';
        }
    </script>

</body>
</html>
