<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #0d2038;
            border-bottom: 2px solid #008cff;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7ec8ff;
        }

        .nav a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav a:hover {
            color: #008cff;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 30px 20px;
        }

        .auth-box {
            background: #0d2038;
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid #008cff;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 140, 255, 0.08);
            transition: all 0.3s ease;
        }

        .auth-box:hover {
            box-shadow: 0 0 60px rgba(0, 140, 255, 0.15);
        }

        .auth-box h1 {
            text-align: center;
            color: #7ec8ff;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #061220;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .auth-box input:focus {
            border-color: #008cff;
            box-shadow: 0 0 20px rgba(0, 140, 255, 0.1);
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.2);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #0d2038;
            border: 1px solid #008cff;
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.success {
            border-color: #00c853;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                padding: 12px 16px;
            }
            .nav a {
                margin: 0 6px;
                font-size: 0.9rem;
            }
            .auth-box {
                padding: 25px 18px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
            }
            .toast {
                min-width: 150px;
                padding: 12px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="header">
        <div class="logo">💙 PackZone MC</div>
        <nav class="nav">
            <a href="index.html">خانه</a>
            <a href="signup.html">ثبت‌نام</a>
            <a href="login.html" style="color:#7ec8ff;">ورود</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-box">
            <h1>🔐 ورود</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">ایمیل</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPass">رمز عبور</label>
                    <input type="password" id="loginPass" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">ورود</button>
            </form>

            <div class="divider">
                <span>یا</span>
            </div>

            <p style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.9rem;">
                حساب کاربری نداری؟ <a href="signup.html" style="color:#7ec8ff;text-decoration:none;font-weight:600;">ثبت‌نام</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© PackZone MC</p>
    </footer>
        <script>
        // ============================================================
        // ===== Toast System =====
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        // ===== Login System (LocalStorage) =====
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('❌ لطفاً همه فیلدها را پر کنید', 'error');
                return;
            }

            // Get users from localStorage
            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];

            // Find user
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showToast('❌ ایمیل یا رمز عبور اشتباه است', 'error');
                return;
            }

            // Save current user
            localStorage.setItem('pzmc_current_user', JSON.stringify(user));

            showToast('✅ ورود موفق! خوش آمدید ' + (user.name || user.email), 'success');

            btn.disabled = true;
            btn.textContent = '⏳ در حال انتقال...';

            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1200);
        });

        // ============================================================
        // ===== Check if user is already logged in =====
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (currentUser && !window.location.pathname.includes('profile.html')) {
                window.location.href = 'profile.html';
            }
        });
    </script>
</body>
</html>
