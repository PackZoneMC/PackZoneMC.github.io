<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
                   RESET & BASE - مانیفست بولدر
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1040 40%, #0d0d2b 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 30px;
            background: rgba(13, 32, 56, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid rgba(108, 92, 231, 0.15);
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header:hover {
            border-bottom-color: rgba(108, 92, 231, 0.3);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav a {
            color: #9ecfff;
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
            transition: 0.3s;
            padding: 6px 12px;
            border-radius: 30px;
        }

        .nav a:hover {
            color: #fff;
            background: rgba(108, 92, 231, 0.15);
        }

        .nav a.active {
            color: #fff;
            background: rgba(108, 92, 231, 0.2);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 30px 20px;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            padding: 35px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(108, 92, 231, 0.04);
            transition: all 0.3s ease;
        }

        .auth-box:hover {
            border-color: rgba(108, 92, 231, 0.2);
            box-shadow: 0 12px 50px rgba(108, 92, 231, 0.06);
        }

        .auth-box h1 {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #7ec8ff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        .auth-box input:focus {
            border-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.05);
            box-shadow: 0 0 25px rgba(108, 92, 231, 0.05);
        }

        .auth-box input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
                   CAPTCHA
                   ============================================================ */
        .captcha-container {
            margin: 16px 0;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        #captchaCanvas {
            border-radius: 12px;
            border: 2px solid rgba(108, 92, 231, 0.15);
            background: #0a0a1a;
            cursor: pointer;
            height: 60px;
            width: 160px;
            transition: all 0.3s ease;
        }

        #captchaCanvas:hover {
            border-color: rgba(108, 92, 231, 0.3);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.05);
        }

        .captcha-refresh {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ddd;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            flex-shrink: 0;
        }

        .captcha-refresh:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: #6c5ce7;
            color: #fff;
            transform: rotate(60deg);
        }

        .captcha-input label {
            display: block;
            font-size: 0.85rem;
            color: #9ecfff;
            margin-bottom: 4px;
        }

        .captcha-input input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 6px;
            font-weight: 700;
            font-family: inherit;
        }

        .captcha-input input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.05);
        }

        .captcha-input input::placeholder {
            letter-spacing: 2px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.2);
        }

        .captcha-error {
            display: block;
            margin-top: 4px;
            font-size: 0.8rem;
            color: #ff6b6b;
            min-height: 20px;
        }

        .captcha-error.success {
            color: #00c853;
        }

        /* ============================================================
                   BUTTONS
                   ============================================================ */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.15);
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 35px rgba(108, 92, 231, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 18px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .divider span {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .auth-footer {
            text-align: center;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #a29bfe;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .auth-footer a:hover {
            text-decoration: underline;
            color: #fff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(13, 32, 56, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(108, 92, 231, 0.2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            z-index: 999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            min-width: 200px;
            text-align: center;
            font-family: inherit;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #e74c3c;
        }

        .toast.success {
            border-color: #00c853;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: auto;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                padding: 12px 16px;
            }
            .nav a {
                margin: 0 6px;
                font-size: 0.85rem;
                padding: 4px 10px;
            }
            .auth-box {
                padding: 25px 18px;
                border-radius: 20px;
            }
            .auth-box h1 {
                font-size: 1.4rem;
            }
            .auth-box input {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .btn-primary {
                padding: 12px;
                font-size: 0.95rem;
            }
            .toast {
                min-width: 150px;
                padding: 12px 20px;
                font-size: 0.85rem;
            }
            #captchaCanvas {
                width: 130px;
                height: 50px;
            }
            .captcha-refresh {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="header">
        <div class="logo">💙 PackZone MC</div>
        <nav class="nav">
            <a href="index.html">خانه</a>
            <a href="signup.html">ثبت‌نام</a>
            <a href="login.html" class="active">ورود</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-box">
            <h1>🔐 ورود</h1>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">ایمیل</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPass">رمز عبور</label>
                    <input type="password" id="loginPass" placeholder="رمز عبور خود را وارد کنید" required>
                </div>

                <!-- ===== کد امنیتی (کپچا) ===== -->
                <div class="captcha-container">
                    <div class="captcha-box">
                        <canvas id="captchaCanvas" width="160" height="60"></canvas>
                        <button type="button" onclick="generateCaptcha()" class="captcha-refresh" title="تغییر کد امنیتی">🔄</button>
                    </div>
                    <div class="captcha-input">
                        <label for="captchaInput">کد امنیتی را وارد کنید</label>
                        <input type="text" id="captchaInput" placeholder="مثلاً ۷۳۶۰۵" maxlength="5" autocomplete="off">
                        <span id="captchaError" class="captcha-error"></span>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">ورود</button>
            </form>

            <div class="divider">
                <span>یا</span>
            </div>

            <p class="auth-footer">حساب کاربری نداری؟ <a href="signup.html">ثبت‌نام</a></p>
        </section>
    </main>

    <footer class="footer">
        <p>© PackZone MC 💙</p>
    </footer>
    <script>
        // ============================================================
        // ===== Toast System =====
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast';
            if (type === 'error') toast.classList.add('error');
            if (type === 'success') toast.classList.add('success');
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        // ===== CAPTCHA SYSTEM =====
        // ============================================================
        let currentCaptcha = '';
        let captchaTimer = null;

        function generateCaptcha() {
            const canvas = document.getElementById('captchaCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            // پس‌زمینه
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#0d0d2b');
            gradient.addColorStop(0.5, '#1a1040');
            gradient.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // نویز (نقاط)
            for (let i = 0; i < 80; i++) {
                ctx.fillStyle = `rgba(${Math.random()*255|0}, ${Math.random()*255|0}, ${Math.random()*255|0}, 0.08)`;
                ctx.beginPath();
                ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // خطوط اعوجاج
            for (let i = 0; i < 6; i++) {
                ctx.strokeStyle = `rgba(${Math.random()*255|0}, ${Math.random()*255|0}, ${Math.random()*255|0}, 0.12)`;
                ctx.lineWidth = Math.random() * 2 + 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
                ctx.stroke();
            }

            // منحنی‌ها
            for (let i = 0; i < 3; i++) {
                ctx.strokeStyle = `rgba(${Math.random()*255|0}, ${Math.random()*255|0}, ${Math.random()*255|0}, 0.08)`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                const startX = Math.random() * width;
                const startY = Math.random() * height;
                ctx.moveTo(startX, startY);
                for (let j = 0; j < 5; j++) {
                    const cpX = Math.random() * width;
                    const cpY = Math.random() * height;
                    const endX = Math.random() * width;
                    const endY = Math.random() * height;
                    ctx.quadraticCurveTo(cpX, cpY, endX, endY);
                }
                ctx.stroke();
            }

            // تولید کد ۵ رقمی عددی
            let code = '';
            for (let i = 0; i < 5; i++) {
                code += Math.floor(Math.random() * 10);
            }
            currentCaptcha = code;

            // رسم اعداد
            const charWidth = width / (code.length + 1);
            const colors = ['#6c5ce7', '#a29bfe', '#fd79a8', '#fdcb6e', '#55efc4', '#74b9ff', '#ff6b6b', '#e17055', '#00cec9'];

            for (let i = 0; i < code.length; i++) {
                const x = charWidth * (i + 0.5) + Math.random() * 6 - 3;
                const y = height / 2 + Math.random() * 12 - 6;
                const angle = (Math.random() - 0.5) * 0.4;
                const fontSize = 28 + Math.random() * 8;
                const color = colors[i % colors.length];

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.font = `bold ${fontSize}px "Inter", "Vazirmatn", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.shadowColor = 'rgba(108, 92, 231, 0.15)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = color;
                ctx.fillText(code[i], 0, 0);

                ctx.shadowBlur = 0;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.04)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-12, 12);
                ctx.lineTo(12, 12);
                ctx.stroke();

                ctx.restore();
            }

            // خطوط اضافی
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = `rgba(${Math.random()*255|0}, ${Math.random()*255|0}, ${Math.random()*255|0}, 0.06)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * width, Math.random() * height);
                ctx.lineTo(Math.random() * width, Math.random() * height);
                ctx.stroke();
            }

            const errorEl = document.getElementById('captchaError');
            if (errorEl) {
                errorEl.textContent = '';
                errorEl.className = 'captcha-error';
            }
        }

        function validateCaptcha() {
            const input = document.getElementById('captchaInput');
            const errorEl = document.getElementById('captchaError');
            if (!input || !errorEl) return false;

            const userCode = input.value.trim();

            if (!userCode) {
                errorEl.textContent = '❌ لطفاً کد امنیتی را وارد کنید';
                errorEl.className = 'captcha-error';
                return false;
            }

            if (userCode !== currentCaptcha) {
                errorEl.textContent = '❌ کد امنیتی اشتباه است';
                errorEl.className = 'captcha-error';
                setTimeout(() => {
                    generateCaptcha();
                    input.value = '';
                    errorEl.textContent = '🔄 کد امنیتی جدید ساخته شد';
                    errorEl.className = 'captcha-error';
                    setTimeout(() => {
                        errorEl.textContent = '';
                        errorEl.className = 'captcha-error';
                    }, 2000);
                }, 800);
                return false;
            }

            errorEl.textContent = '✅ کد امنیتی صحیح است';
            errorEl.className = 'captcha-error success';
            setTimeout(() => {
                errorEl.textContent = '';
                errorEl.className = 'captcha-error';
            }, 2000);
            return true;
        }

        function startCaptchaTimer() {
            if (captchaTimer) clearInterval(captchaTimer);
            captchaTimer = setInterval(() => {
                generateCaptcha();
                const input = document.getElementById('captchaInput');
                if (input) input.value = '';
                const errorEl = document.getElementById('captchaError');
                if (errorEl) {
                    errorEl.textContent = '🔄 کد امنیتی خودکار تغییر کرد';
                    errorEl.className = 'captcha-error';
                    setTimeout(() => {
                        if (errorEl) {
                            errorEl.textContent = '';
                            errorEl.className = 'captcha-error';
                        }
                    }, 2000);
                }
            }, 60000);
        }

        // ============================================================
        // ===== Login System (LocalStorage) =====
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // ===== بررسی کد امنیتی =====
            if (!validateCaptcha()) {
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showToast('❌ لطفاً همه فیلدها را پر کنید', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('pzmc_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showToast('❌ ایمیل یا رمز عبور اشتباه است', 'error');
                return;
            }

            localStorage.setItem('pzmc_current_user', JSON.stringify(user));

            showToast('✅ ورود موفق! خوش آمدید ' + (user.name || user.email), 'success');

            btn.disabled = true;
            btn.textContent = '⏳ در حال انتقال...';

            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1200);
        });

        // ============================================================
        // ===== Check if user is already logged in =====
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('pzmc_current_user'));
            if (currentUser && !window.location.pathname.includes('profile.html')) {
                window.location.href = 'profile.html';
            }

            // ===== مقداردهی کپچا =====
            generateCaptcha();
            startCaptchaTimer();

            // رفرش با کلیک روی کپچا
            const canvas = document.getElementById('captchaCanvas');
            if (canvas) {
                canvas.addEventListener('click', function() {
                    generateCaptcha();
                    const input = document.getElementById('captchaInput');
                    if (input) input.value = '';
                    const errorEl = document.getElementById('captchaError');
                    if (errorEl) {
                        errorEl.textContent = '🔄 کد امنیتی تغییر کرد';
                        errorEl.className = 'captcha-error';
                        setTimeout(() => {
                            if (errorEl) {
                                errorEl.textContent = '';
                                errorEl.className = 'captcha-error';
                            }
                        }, 1500);
                    }
                });
            }
        });
    </script>
</body>
</html>
