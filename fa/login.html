<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | PackZone MC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../src/css/style.css">

    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 40px 20px;
            background: radial-gradient(ellipse at center, #0d2038, #050b18);
        }
        .auth-box {
            background: rgba(13, 32, 56, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px 40px;
            border-radius: 28px;
            border: 1px solid rgba(0, 140, 255, 0.25);
            max-width: 440px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .auth-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: conic-gradient(from 0deg, #008cff, #7b00ff, #ff00aa, #008cff);
            background-size: 400% 400%;
            animation: rotateBorder 6s linear infinite;
            z-index: -1;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }
        @keyframes rotateBorder {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        .auth-box h1 {
            text-align: center;
            color: #7ec8ff;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ecfff;
            margin-bottom: 6px;
        }
        .auth-box input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(6, 18, 32, 0.7);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .auth-box input:focus {
            border-color: #008cff;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.08);
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #008cff, #6c3cff);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(0, 140, 255, 0.35);
        }
        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.4);
        }
        .auth-footer a {
            color: #7ec8ff;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            color: #008cff;
            text-decoration: underline;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 32, 56, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 140, 255, 0.15);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #7ec8ff;
        }
        .nav a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            margin: 0 12px;
        }
        .nav a:hover,
        .nav a.active {
            color: #7ec8ff;
        }
        .nav a.active {
            border-bottom: 2px solid #008cff;
            padding-bottom: 4px;
        }
        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }
            .auth-box {
                padding: 30px 20px;
            }
            .auth-box h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">💙 PackZone MC</div>
        <nav class="nav">
            <a href="index.html">خانه</a>
            <a href="signup.html">ثبت‌نام</a>
            <a href="login.html" class="active">ورود</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-box">
            <h1>🔐 ورود</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">ایمیل</label>
                    <input type="email" id="loginEmail" placeholder="example@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPass">رمز عبور</label>
                    <input type="password" id="loginPass" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                <button type="submit" class="btn-primary">ورود</button>
            </form>
            <p class="auth-footer">عضو نیستی؟ <a href="signup.html">ثبت‌نام</a></p>
        </section>
    </main>

    <footer class="footer">
        <p>© PackZone MC</p>
    </footer>

    <script src="../src/js/main.js"></script>
</body>
</html>
