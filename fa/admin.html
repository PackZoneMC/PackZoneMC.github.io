<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 پنل ادمین</title>
    <style>
        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            background: linear-gradient(145deg, #2d1b22, #1a0f14);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 240, 245, 0.95);
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            color: #a02c5a;
            text-align: center;
            font-size: 1.8rem;
        }
        .login-box {
            text-align: center;
            padding: 20px 0;
        }
        .login-box input {
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid #d43f6b;
            font-size: 1.1rem;
            width: 80%;
            margin: 10px 0;
            text-align: center;
            outline: none;
        }
        .login-box button {
            background: #a02c5a;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .login-box button:active {
            transform: scale(0.95);
        }
        .messages-box {
            display: none;
            margin-top: 20px;
        }
        .messages-box .msg {
            background: white;
            padding: 12px;
            border-radius: 15px;
            margin: 8px 0;
            border-right: 4px solid #d43f6b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .messages-box .msg .time {
            font-size: 0.75rem;
            color: #888;
        }
        .error {
            color: #d43f6b;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        .clear-btn {
            background: #888;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #a02c5a;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 پنل ادمین</h1>
        <div id="loginSection" class="login-box">
            <p style="color:#555;">رمز عبور را وارد کنید:</p>
            <input type="password" id="passwordInput" placeholder="رمز عبور...">
            <br>
            <button id="loginBtn">ورود</button>
            <div id="loginError" class="error"></div>
        </div>
        <div id="messagesSection" class="messages-box">
            <h3 style="color:#a02c5a;">📩 پیام‌های عاشقانه</h3>
            <div id="messagesList"></div>
            <button class="clear-btn" id="clearBtn">🗑️ پاک کردن همه پیام‌ها</button>
            <a href="../index.html" class="back-btn">↩️ برگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        const PASSWORD = '1234'; // رمز رو به دلخواه عوض کن

        document.getElementById('loginBtn').addEventListener('click', function() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('messagesSection').style.display = 'block';
                loadMessages();
            } else {
                document.getElementById('loginError').textContent = '❌ رمز اشتباه است!';
            }
        });

        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });

        function loadMessages() {
            const saved = localStorage.getItem('loveMessages');
            const list = document.getElementById('messagesList');
            
            if (!saved) {
                list.innerHTML = '<p style="color:#888; text-align:center;">هنوز پیامی ثبت نشده 🥺</p>';
                return;
            }

            try {
                const messages = JSON.parse(saved);
                if (messages.length === 0) {
                    list.innerHTML = '<p style="color:#888; text-align:center;">هنوز پیامی ثبت نشده 🥺</p>';
                    return;
                }
                let html = '';
                messages.forEach(msg => {
                    html += `
                        <div class="msg">
                            <div class="time">🕒 ${msg.time}</div>
                            <div>${msg.text}</div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch(e) {
                list.innerHTML = '<p style="color:#888; text-align:center;">خطا در خواندن پیام‌ها</p>';
            }
        }

        document.getElementById('clearBtn').addEventListener('click', function() {
            if (confirm('مطمئنی همه پیام‌ها رو پاک کنی؟')) {
                localStorage.removeItem('loveMessages');
                loadMessages();
            }
        });
    </script>
</body>
</html>
