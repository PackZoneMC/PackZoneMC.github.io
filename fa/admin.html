<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔒 پنل ادمین - بازی ریحانه</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 30px 25px;
            max-width: 550px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #fff;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.2);
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* ===== لاگین ===== */
        .login-box {
            text-align: center;
            padding: 20px 0;
        }

        .login-box input {
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            width: 80%;
            max-width: 250px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .login-box input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-box .login-btn {
            margin-top: 15px;
            padding: 14px 40px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 210, 255, 0.2);
            font-family: inherit;
        }

        .login-box .login-btn:active {
            transform: scale(0.95);
        }

        .login-box .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* ===== بخش پیام‌ها (بعد از لاگین) ===== */
        .messages-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 12px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-width: 80px;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00d2ff;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .stat-card .number.wrong {
            color: #ff6b6b;
        }

        /* ===== لیست پیام‌ها ===== */
        .messages-list {
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .messages-list::-webkit-scrollbar {
            width: 4px;
        }

        .messages-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .messages-list::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.3);
            border-radius: 10px;
        }

        .msg-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 10px;
            border-right: 3px solid rgba(0, 210, 255, 0.2);
            transition: all 0.3s ease;
        }

        .msg-item.correct {
            border-right-color: #00d2ff;
        }

        .msg-item.wrong {
            border-right-color: #ff6b6b;
            opacity: 0.6;
        }

        .msg-item .q-text {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .msg-item .a-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .msg-item .status {
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .msg-item .status .correct-badge {
            color: #00d2ff;
        }

        .msg-item .status .wrong-badge {
            color: #ff6b6b;
        }

        .no-msg {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 30px 0;
            font-size: 0.95rem;
        }

        /* ===== دکمه‌ها ===== */
        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .actions .btn {
            padding: 10px 25px;
            border-radius: 30px;
            border: none;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .actions .btn-clear {
            background: rgba(255, 68, 68, 0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .actions .btn-clear:hover {
            background: rgba(255, 68, 68, 0.25);
        }

        .actions .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .actions .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== انیمیشن‌ها ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .stat-card .number {
                font-size: 1.4rem;
            }
            .stat-card {
                padding: 8px 15px;
                min-width: 60px;
            }
            .msg-item .q-text {
                font-size: 0.85rem;
            }
            .login-box input {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== هدر ===== -->
        <div class="header">
            <h1>🔒 پنل ادمین</h1>
            <div class="subtitle">📩 پیام‌های بازی «چقدر منو بلدی؟»</div>
        </div>

        <!-- ===== لاگین ===== -->
        <div class="login-box" id="loginBox">
            <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کن..." maxlength="20">
            <br>
            <button class="login-btn" id="loginBtn">🚪 ورود</button>
            <div class="error-msg" id="errorMsg">❌ رمز اشتباه است!</div>
        </div>

        <!-- ===== بخش پیام‌ها ===== -->
        <div class="messages-section" id="messagesSection">

            <!-- آمار -->
            <div class="stats" id="statsBox">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">مجموع سوالات</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="correctCount">0</div>
                    <div class="label">✅ درست</div>
                </div>
                <div class="stat-card">
                    <div class="number wrong" id="wrongCount">0</div>
                    <div class="label">❌ اشتباه</div>
                </div>
            </div>

            <!-- لیست پیام‌ها -->
            <div class="messages-list" id="messagesList">
                <div class="no-msg">📭 هنوز پیامی نیومده...</div>
            </div>

            <!-- دکمه‌ها -->
            <div class="actions">
                <button class="btn btn-clear" id="clearBtn">🗑️ پاک کردن همه</button>
                <button class="btn btn-back" id="backBtn">↩️ برگشت</button>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        // ===== رمز عبور =====
        // ============================================================
        const PASSWORD = '1234';

        // ============================================================
        // ===== عناصر =====
        // ============================================================
        const loginBox = document.getElementById('loginBox');
        const messagesSection = document.getElementById('messagesSection');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const messagesList = document.getElementById('messagesList');
        const totalCount = document.getElementById('totalCount');
        const correctCount = document.getElementById('correctCount');
        const wrongCount = document.getElementById('wrongCount');
        const clearBtn = document.getElementById('clearBtn');
        const backBtn = document.getElementById('backBtn');

        // ============================================================
        // ===== توابع =====
        // ============================================================

        function loadData() {
            const raw = localStorage.getItem('amirGameLog');
            if (!raw) {
                return null;
            }
            try {
                return JSON.parse(raw);
            } catch {
                return null;
            }
        }

        function renderMessages() {
            const data = loadData();
            if (!data || !data.answers || data.answers.length === 0) {
                messagesList.innerHTML = `<div class="no-msg">📭 هنوز پیامی نیومده...</div>`;
                totalCount.textContent = '0';
                correctCount.textContent = '0';
                wrongCount.textContent = '0';
                return;
            }

            // آمار
            const total = data.answers.length;
            const correct = data.answers.filter(a => a.correct).length;
            const wrong = total - correct;

            totalCount.textContent = total;
            correctCount.textContent = correct;
            wrongCount.textContent = wrong;

            // لیست
            let html = '';
            data.answers.forEach((item, index) => {
                const statusClass = item.correct ? 'correct' : 'wrong';
                const badge = item.correct ?
                    '<span class="correct-badge">✅ درست</span>' :
                    '<span class="wrong-badge">❌ اشتباه</span>';

                html += `
                    <div class="msg-item ${statusClass}">
                        <div class="q-text">${index + 1}. ${item.question}</div>
                        <div class="a-text">📝 پاسخ: ${item.answer}</div>
                        <div class="status">${badge}</div>
                    </div>
                `;
            });

            messagesList.innerHTML = html;
        }

        function clearData() {
            if (confirm('🗑️ مطمئنی همه پیام‌ها رو پاک کنی؟')) {
                localStorage.removeItem('amirGameLog');
                renderMessages();
            }
        }

        // ============================================================
        // ===== لاگین =====
        // ============================================================
        loginBtn.addEventListener('click', function() {
            const pass = passwordInput.value.trim();
            if (pass === PASSWORD) {
                loginBox.style.display = 'none';
                messagesSection.style.display = 'block';
                renderMessages();
                errorMsg.style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        // ============================================================
        // ===== دکمه‌ها =====
        // ============================================================
        clearBtn.addEventListener('click', clearData);

        backBtn.addEventListener('click', function() {
            window.location.href = '../index.html';
        });

        // ============================================================
        // ===== خودکار چک کردن =====
        // ============================================================
        // اگه قبلاً لاگین کرده باشه (برای راحتی)
        // (ولی اینجا هر بار باید لاگین کنه)

        console.log('🔒 پنل ادمین آماده‌ست!');
    </script>
</body>
</html>
