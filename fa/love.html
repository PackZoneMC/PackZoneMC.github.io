<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💖 سوالات عاشقانه 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #ffd1dc, #ffb3c6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-bg span {
            position: absolute;
            display: block;
            font-size: 2.5rem;
            color: rgba(255, 80, 120, 0.2);
            animation: floatHeart 12s infinite linear;
        }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 240, 245, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 30px 25px;
            max-width: 500px;
            width: 92%;
            box-shadow: 0 25px 50px -8px rgba(200, 50, 80, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            transition: all 0.3s ease;
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #a02c5a;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 100, 150, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: #b3416e;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .question-box {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            padding: 18px 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 200, 220, 0.6);
            box-shadow: inset 0 2px 8px rgba(255, 200, 220, 0.3);
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #4a1a2c;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .question-text .emoji {
            font-size: 1.8rem;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 14px rgba(200, 60, 100, 0.25);
            min-width: 85px;
            letter-spacing: 1px;
            touch-action: manipulation;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b8a, #ee3b6b);
            color: white;
        }
        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: #d1d1d1;
            color: #555;
            cursor: default;
            opacity: 0.5;
            position: relative;
            pointer-events: none;
        }

        .btn-no.runaway {
            pointer-events: auto;
            cursor: default;
        }

        .time-panel {
            margin-top: 20px;
            background: rgba(255, 220, 235, 0.5);
            border-radius: 40px;
            padding: 18px 15px;
            border: 1px solid #ffb0c8;
            display: none;
        }

        .time-panel label {
            display: block;
            font-size: 1.1rem;
            color: #6e2b45;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .time-panel input[type="time"] {
            padding: 10px 16px;
            border-radius: 40px;
            border: 2px solid #ff8aa8;
            background: white;
            font-size: 1.2rem;
            color: #3d1a28;
            outline: none;
            width: 80%;
            max-width: 200px;
            text-align: center;
            font-weight: 600;
            -webkit-appearance: none;
        }

        .time-panel input[type="time"]:focus {
            border-color: #d43f6b;
            box-shadow: 0 0 0 3px rgba(212, 63, 107, 0.2);
        }

        .btn-send {
            margin-top: 15px;
            background: linear-gradient(135deg, #a02c5a, #7a1f42);
            color: white;
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(160, 44, 90, 0.35);
            transition: all 0.2s ease;
            touch-action: manipulation;
        }
        .btn-send:active {
            transform: scale(0.95);
        }

        .hidden-message {
            display: none;
            margin-top: 15px;
            font-size: 1rem;
            color: #a02c5a;
            background: #ffe2ec;
            padding: 12px;
            border-radius: 40px;
            border: 1px solid #ffb0c8;
        }

        .admin-section {
            margin-top: 25px;
            padding: 15px;
            background: rgba(200, 200, 200, 0.15);
            border-radius: 40px;
            border: 1px dashed #b3416e;
            display: none;
        }
        .admin-section.show-admin {
            display: block;
        }

        .admin-toggle {
            background: none;
            border: none;
            color: #7a1f42;
            font-size: 0.75rem;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.2s;
            padding: 8px;
            touch-action: manipulation;
        }
        .admin-toggle:active {
            opacity: 0.9;
        }

        .admin-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 12px;
            border-radius: 30px;
            margin-top: 10px;
            text-align: right;
            font-size: 0.9rem;
            color: #2d111e;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #f0b8cc;
        }

        .admin-box p {
            margin: 5px 0;
            border-bottom: 1px solid #fcd0df;
            padding: 4px 0;
            word-break: break-word;
        }

        .secret-back {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: rgba(255,255,255,0.2);
            font-size: 0.6rem;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 999;
            touch-action: manipulation;
        }
        .secret-back:active {
            background: rgba(255,255,255,0.3);
        }

        @media (max-width: 480px) {
            .container { padding: 20px 15px; margin: 10px; }
            .question-text { font-size: 1.1rem; }
            .btn { min-width: 70px; padding: 10px 16px; font-size: 0.95rem; }
            h1 { font-size: 1.6rem; }
        }

        @media (max-width: 380px) {
            .container { padding: 15px 10px; }
            .question-text { font-size: 1rem; }
            .btn { min-width: 60px; padding: 8px 12px; font-size: 0.85rem; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #ffe2ec; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #d43f6b; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <h1>✨ سوالات عاشقانه ✨</h1>
        <div class="subtitle">💕 فقط راستشو بگو 💕</div>

        <div class="question-box" id="q1Box">
            <div class="question-text">
                <span class="emoji">🥰</span>
                منو دوست داری؟
                <span class="emoji">👉🏻👈🏻</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-yes" id="q1Yes">آره ❤️</button>
                <button class="btn btn-no runaway" id="q1No">نه 😤</button>
            </div>
            <div style="margin-top: 8px; font-size: 0.75rem; color: #b3416e; opacity:0.7;">نمی‌تونی نه بزنی 😜</div>
        </div>

        <div class="question-box" id="q2Box" style="display: none;">
            <div class="question-text">
                <span class="emoji">🌳🌸</span>
                خب حالا که دوستم داری، میای بریم پارک؟ 
                <span class="emoji">👉🏻👈🏻</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-yes" id="q2Yes">آره حتماً! 💖</button>
                <button class="btn btn-no" id="q2No">نه 😒</button>
            </div>
            <div style="margin-top: 8px; font-size: 0.75rem; color: #b3416e; opacity:0.7;">فقط آره معنی داره 😉</div>
        </div>

        <div class="time-panel" id="timePanel">
            <label>⏰ چه ساعتی بیام دنبالت؟</label>
            <input type="time" id="pickTime" value="18:00">
            <br>
            <button class="btn-send" id="sendTimeBtn">📨 بفرست برای عزیز دلم</button>
            <div class="hidden-message" id="msgSent">🎀 ارسال شد! منتظرتم عزیزم 🎀</div>
        </div>

        <button class="admin-toggle" id="adminToggle">🔒 نمایش پیام‌های ادمین</button>
        <div class="admin-section" id="adminSection">
            <div style="font-weight:600; color:#6e2b45;">📩 پیام‌های دریافتی:</div>
            <div class="admin-box" id="adminMessages">
                <p style="color:#888;">هنوز پیامی نیست...</p>
            </div>
        </div>
    </div>

    <button class="secret-back" id="secretBack">↩️ خروج</button>

    <script>
        (function() {
            // قلب‌های پس‌زمینه
            const heartBg = document.getElementById('heartBg');
            const heartEmojis = ['❤️', '💖', '💗', '💓', '💕', '💘', '💝', '🌸', '🌺'];
            for (let i = 0; i < 25; i++) {
                const span = document.createElement('span');
                span.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.fontSize = (1.5 + Math.random() * 3) + 'rem';
                span.style.animationDuration = (10 + Math.random() * 18) + 's';
                span.style.animationDelay = (Math.random() * 10) + 's';
                heartBg.appendChild(span);
            }

            const q1Box = document.getElementById('q1Box');
            const q2Box = document.getElementById('q2Box');
            const timePanel = document.getElementById('timePanel');
            const msgSent = document.getElementById('msgSent');

            const q1Yes = document.getElementById('q1Yes');
            const q1No = document.getElementById('q1No');
            const q2Yes = document.getElementById('q2Yes');
            const q2No = document.getElementById('q2No');

            const sendTimeBtn = document.getElementById('sendTimeBtn');
            const pickTime = document.getElementById('pickTime');

            const adminSection = document.getElementById('adminSection');
            const adminToggle = document.getElementById('adminToggle');
            const adminMessages = document.getElementById('adminMessages');
            const secretBack = document.getElementById('secretBack');

            let messagesLog = [];

            // ذخیره پیام‌ها در localStorage (برای دسترسی ادمین)
            function saveMessages() {
                localStorage.setItem('loveMessages', JSON.stringify(messagesLog));
            }

            function loadMessages() {
                const saved = localStorage.getItem('loveMessages');
                if (saved) {
                    try {
                        messagesLog = JSON.parse(saved);
                    } catch(e) {
                        messagesLog = [];
                    }
                }
                renderAdminMessages();
            }

            function addAdminMessage(text) {
                const timestamp = new Date().toLocaleString('fa-IR');
                messagesLog.push({ time: timestamp, text: text });
                saveMessages();
                renderAdminMessages();
            }

            function renderAdminMessages() {
                if (messagesLog.length === 0) {
                    adminMessages.innerHTML = `<p style="color:#888;">هنوز پیامی نیست...</p>`;
                    return;
                }
                let html = '';
                messagesLog.forEach(msg => {
                    html += `<p>🕒 ${msg.time} — ${msg.text}</p>`;
                });
                adminMessages.innerHTML = html;
                adminMessages.scrollTop = adminMessages.scrollHeight;
            }

            // دکمه نه فراری
            function moveNoButton() {
                const btn = q1No;
                const container = btn.parentElement;
                const containerRect = container.getBoundingClientRect();
                const btnRect = btn.getBoundingClientRect();

                const maxX = containerRect.width - btnRect.width - 10;
                const maxY = containerRect.height - btnRect.height - 10;

                const newX = Math.random() * maxX;
                const newY = Math.random() * maxY;

                btn.style.position = 'relative';
                btn.style.left = newX + 'px';
                btn.style.top = newY + 'px';
            }

            q1No.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (!q1No.classList.contains('disable-no')) {
                    moveNoButton();
                }
            });

            q1No.addEventListener('mouseenter', function() {
                if (!q1No.classList.contains('disable-no')) {
                    moveNoButton();
                }
            });

            setTimeout(() => {
                if (!q1No.classList.contains('disable-no')) {
                    moveNoButton();
                }
            }, 300);

            // سوال اول
            q1Yes.addEventListener('click', function() {
                q1Yes.disabled = true;
                q1Yes.style.opacity = '0.6';
                q1No.classList.add('disable-no');
                q1No.style.pointerEvents = 'none';

                addAdminMessage('💖 به سوال اول پاسخ داد: "آره" (دوست دارم)');

                q1Box.style.opacity = '0.6';
                q2Box.style.display = 'block';
                q2Box.style.animation = 'fadeIn 0.5s ease';

                setTimeout(() => {
                    q2Box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });

            // سوال دوم
            q2No.addEventListener('click', function(e) {
                e.preventDefault();
                alert('🥺 نه گفتن ممنوع! فقط آره...');
            });

            q2No.addEventListener('touchstart', function(e) {
                e.preventDefault();
                alert('🥺 نه گفتن ممنوع! فقط آره...');
            });

            q2Yes.addEventListener('click', function() {
                q2Yes.disabled = true;
                q2Yes.style.opacity = '0.6';
                q2No.classList.add('disable-no');
                q2No.style.pointerEvents = 'none';

                addAdminMessage('💖 به سوال دوم پاسخ داد: "آره" (میاد پارک)');

                timePanel.style.display = 'block';
                timePanel.style.animation = 'fadeIn 0.6s ease';
                setTimeout(() => {
                    timePanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            });

            // ارسال ساعت
            sendTimeBtn.addEventListener('click', function() {
                const timeValue = pickTime.value;
                if (!timeValue) {
                    alert('لطفاً یک ساعت انتخاب کن عزیزم!');
                    return;
                }
                msgSent.style.display = 'block';
                msgSent.textContent = `🎀 ساعت ${timeValue} منتظرتم عزیزم! 💕`;

                addAdminMessage(`⏰ ساعت انتخابی: ${timeValue}`);

                sendTimeBtn.disabled = true;
                sendTimeBtn.style.opacity = '0.6';
                sendTimeBtn.textContent = '✅ ارسال شد';
                pickTime.disabled = true;

                setTimeout(() => {
                    alert('😍 عالی! منتظرت هستم عزیزم ❤️');
                }, 300);
            });

            // نمایش ادمین
            adminToggle.addEventListener('click', function() {
                adminSection.classList.toggle('show-admin');
                adminToggle.textContent = adminSection.classList.contains('show-admin') 
                    ? '🔒 مخفی کردن پیام‌ها' 
                    : '🔒 نمایش پیام‌های ادمین';
            });

            // خروج مخفی
            secretBack.addEventListener('click', function() {
                if (confirm('میخوای بری بیرون؟ مطمئنی؟ 🥺')) {
                    window.location.href = '../index.html';
                }
            });

            // بارگذاری پیام‌های ذخیره شده
            loadMessages();

            // جلوگیری از خروج
            window.addEventListener('popstate', function(e) {
                history.pushState(null, null, window.location.href);
            });
            history.pushState(null, null, window.location.href);

            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = 'صبر کن عزیزم! حتماً جواب بده 😉';
                return 'صبر کن عزیزم! حتماً جواب بده 😉';
            });

            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'F4' && (e.altKey || e.metaKey)) {
                    e.preventDefault();
                    alert('🙈 نههه! اول جواب بده عزیزم!');
                    return false;
                }
                if ((e.ctrlKey && e.key === 'w') || (e.ctrlKey && e.key === 'W')) {
                    e.preventDefault();
                    alert('🥺 نمی‌ذارم بری! جواب بده لطفاً...');
                    return false;
                }
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))) {
                    e.preventDefault();
                    alert('🔒 اینجا جای کنجکاوی نیست عزیزم!');
                    return false;
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    alert('😘 فرار ممنوع! لطفاً جواب بده.');
                }
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    alert('🙈 کجا داری میری؟! بیا برگرد!');
                }
            });

            const styleSheet = document.createElement("style");
            styleSheet.textContent = `
                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(20px); }
                    to { opacity: 1; transform: translateY(0); }
                }
            `;
            document.head.appendChild(styleSheet);

            console.log('❤️ همه چیز آماده! عشق بازی شروع شد!');
        })();
    </script>
</body>
</html>
