<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PackZoneMC - کانورتر حرفه‌ای</title>
    
    <!-- کتابخونه‌ها -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d0d1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== کانتینر اصلی ===== */
        .container {
            max-width: 900px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a2a4a;
        }

        /* ===== هدر ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header span {
            color: #888;
            font-size: 14px;
        }
        .badge {
            background: #2a2a4a;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            border: 1px solid #3a3a5a;
        }

        /* ===== باکس آپلود ===== */
        .upload-zone {
            border: 3px dashed #2a2a4a;
            border-radius: 20px;
            padding: 50px 20px;
            text-align: center;
            background: #12121f;
            transition: 0.4s;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .upload-zone:hover {
            border-color: #e94560;
            background: #1a1a30;
        }
        .upload-zone.dragover {
            border-color: #e94560;
            background: #1f1f3a;
        }
        .upload-zone .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .upload-zone p {
            color: #aaa;
            font-size: 16px;
        }
        .upload-zone .file-name {
            color: #4caf50;
            font-weight: bold;
            margin-top: 10px;
        }
        .upload-zone .file-size {
            color: #666;
            font-size: 13px;
        }

        /* ===== گزینه‌های پیشرفته ===== */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: #12121f;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            border: 1px solid #2a2a4a;
        }
        .options-grid label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .options-grid label:hover {
            background: #1a1a30;
        }
        .options-grid input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e94560;
            cursor: pointer;
        }

        /* ===== دکمه تبدیل ===== */
        .convert-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s;
            margin-bottom: 20px;
        }
        .convert-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(233,69,96,0.4);
        }
        .convert-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== وضعیت و لاگ ===== */
        .status-box {
            background: #12121f;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #2a2a4a;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status-box.idle { color: #888; }
        .status-box.loading { color: #ff9800; background: #1a1a2a; }
        .status-box.success { color: #4caf50; background: #0a1a1a; border-color: #2a5a2a; }
        .status-box.error { color: #f44336; background: #1a0a0a; border-color: #5a2a2a; }

        .log-box {
            background: #0a0a15;
            padding: 14px 18px;
            border-radius: 14px;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            color: #aaa;
            border: 1px solid #1a1a30;
            line-height: 1.7;
            min-height: 70px;
            margin-bottom: 18px;
        }
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }
        .log-box::-webkit-scrollbar-track { background: #0a0a15; }

        /* ===== دکمه دانلود ===== */
        .download-btn {
            display: none;
            width: 100%;
            padding: 16px;
            background: #2a7a3a;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.4s;
            border: none;
        }
        .download-btn:hover {
            background: #3a9a4a;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(76,175,80,0.3);
        }

        /* ===== ریسپانسیو ===== */
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header h1 { font-size: 22px; }
            .upload-zone { padding: 30px 15px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== هدر ===== -->
    <div class="header">
        <div>
            <h1>🎮 PackZoneMC</h1>
            <span>کانورتر حرفه‌ای جاوا → بدراک</span>
        </div>
        <div class="badge">⚡ نسخه 2.0</div>
    </div>

    <!-- ===== باکس آپلود ===== -->
    <div class="upload-zone" id="uploadZone">
        <div class="icon">📁</div>
        <p>فایل ZIP ریسورس پک جاوا را بکشید یا کلیک کنید</p>
        <input type="file" id="fileInput" accept=".zip,.jar" style="display:none;">
        <div id="fileInfo" class="file-name"></div>
        <div id="fileSize" class="file-size"></div>
    </div>

    <!-- ===== گزینه‌های پیشرفته ===== -->
    <div class="options-grid">
        <label><input type="checkbox" id="optGui" checked> 🖼️ رابط کاربری (GUI)</label>
        <label><input type="checkbox" id="optSkybox" checked> 🌤️ اسکای‌باکس</label>
        <label><input type="checkbox" id="optArmor" checked> 🛡️ آرمور</label>
        <label><input type="checkbox" id="optFont" checked> 🔤 فونت</label>
        <label><input type="checkbox" id="optAnimation" checked> 🎬 انیمیشن</label>
        <label><input type="checkbox" id="optUidx" checked> ⚡ UIDX</label>
    </div>

    <!-- ===== دکمه تبدیل ===== -->
    <button class="convert-btn" id="convertBtn">🚀 شروع تبدیل حرفه‌ای</button>

    <!-- ===== وضعیت ===== -->
    <div class="status-box idle" id="statusBox">⏳ منتظر انتخاب فایل...</div>

    <!-- ===== لاگ ===== -->
    <div class="log-box" id="logBox">[سیستم] آماده‌ی کار...</div>

    <!-- ===== دانلود ===== -->
    <a class="download-btn" id="downloadBtn">📥 دانلود فایل تبدیل‌شده</a>

</div>

<script>
// ============================================================
//  متغیرها و حالت
// ============================================================
let selectedFile = null;
let isConverting = false;

// ============================================================
//  المنت‌ها
// ============================================================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileSize = document.getElementById('fileSize');
const convertBtn = document.getElementById('convertBtn');
const statusBox = document.getElementById('statusBox');
const logBox = document.getElementById('logBox');
const downloadBtn = document.getElementById('downloadBtn');

// ============================================================
//  مدیریت آپلود
// ============================================================
uploadZone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        selectedFile = file;
        const mb = (file.size / 1024 / 1024).toFixed(2);
        fileInfo.textContent = `📎 ${file.name}`;
        fileSize.textContent = `${mb} MB`;
        statusBox.className = 'status-box idle';
        statusBox.textContent = '✅ فایل آماده است!';
        addLog(`📁 فایل انتخاب شد: ${file.name} (${mb} MB)`);
    }
});

// ===== درگ اند دراپ =====
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, e => {
        e.preventDefault();
        e.stopPropagation();
    });
});
uploadZone.addEventListener('dragenter', () => uploadZone.classList.add('dragover'));
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', function(e) {
    this.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        fileInput.files = files;
        fileInput.dispatchEvent(new Event('change'));
    }
});

// ============================================================
//  توابع کمکی
// ============================================================
function addLog(msg) {
    const time = new Date().toLocaleTimeString('fa-IR');
    logBox.textContent += `[${time}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(type, msg) {
    statusBox.className = 'status-box ' + type;
    statusBox.textContent = msg;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

// ============================================================
//  هسته کانورتر (حرفه‌ای)
// ============================================================
async function startConversion() {
    if (isConverting) return;
    if (!selectedFile) {
        alert('لطفاً یک فایل ZIP انتخاب کن!');
        return;
    }

    isConverting = true;
    convertBtn.disabled = true;
    convertBtn.textContent = '⏳ در حال پردازش...';
    downloadBtn.style.display = 'none';
    setStatus('loading', '⏳ در حال تبدیل حرفه‌ای...');
    addLog('🔍 شروع فرآیند تبدیل حرفه‌ای...');

    try {
        // ===== ۱. بارگذاری فایل =====
        addLog('📂 خواندن فایل ZIP...');
        const zip = await JSZip.loadAsync(selectedFile);
        const newZip = new JSZip();
        let changes = 0;

        // ===== ۲. تشخیص خودکار نسخه =====
        const hasPackMcmeta = !!zip.files['pack.mcmeta'];
        const hasManifest = !!zip.files['manifest.json'];
        
        if (hasPackMcmeta) {
            addLog('✅ شناسایی: ریسورس پک جاوا');
        } else if (hasManifest) {
            addLog('⚠️ این فایل به نظر بدراک هست، اما تبدیل می‌شود.');
        } else {
            addLog('⚠️ ساختار ناشناخته، تلاش برای تبدیل...');
        }

        // ===== ۳. پردازش فایل‌ها (حرفه‌ای) =====
        let totalFiles = Object.keys(zip.files).length;
        let processed = 0;

        for (const [filename, file] of Object.entries(zip.files)) {
            processed++;
            if (processed % 20 === 0) {
                setStatus('loading', `⏳ پردازش... (${processed}/${totalFiles})`);
            }

            if (file.dir) {
                newZip.folder(filename);
                continue;
            }

            // ---- کپی فایل‌ها با پردازش هوشمند ----
            const data = await file.async('blob');
            let newName = filename;

            // تبدیل مسیرهای جاوا به بدراک
            if (filename.startsWith('assets/minecraft/textures/')) {
                newName = filename.replace('assets/minecraft/textures/', 'textures/');
                // اصلاح مسیرهای خاص
                newName = newName
                    .replace(/\/block\//g, '/blocks/')
                    .replace(/\/item\//g, '/items/')
                    .replace(/\/entity\//g, '/entities/')
                    .replace(/\/gui\//g, '/gui/');
                changes++;
            }

            // حذف فایل‌های غیرضروری
            const excludePatterns = [
                /\.DS_Store/,
                /Thumbs\.db/,
                /\.git/
            ];
            let exclude = false;
            for (let pattern of excludePatterns) {
                if (pattern.test(filename)) exclude = true;
            }

            if (!exclude) {
                newZip.file(newName, data);
            }
        }

        // ===== ۴. ساخت manifest.json =====
        addLog('📄 ساخت manifest.json...');
        let packName = selectedFile.name.replace(/\.zip$/i, '').replace(/\.jar$/i, '');
        const manifest = {
            "format_version": 2,
            "header": {
                "name": packName + " (Converted)",
                "description": "Converted from Java to Bedrock by PackZoneMC",
                "uuid": generateUUID(),
                "version": [1, 0, 0],
                "min_engine_version": [1, 16, 0]
            },
            "modules": [{
                "type": "resources",
                "uuid": generateUUID(),
                "version": [1, 0, 0]
            }]
        };

        // اگر pack.mcmeta بود، اسم رو ازش بگیر
        if (zip.files['pack.mcmeta']) {
            try {
                const mcmetaContent = await zip.files['pack.mcmeta'].async('string');
                const mcmeta = JSON.parse(mcmetaContent);
                if (mcmeta.pack && mcmeta.pack.name) {
                    manifest.header.name = mcmeta.pack.name + " (Bedrock)";
                }
            } catch(e) {}
        }

        newZip.file('manifest.json', JSON.stringify(manifest, null, 2));
        changes++;

        // ===== ۵. آیکون =====
        if (!zip.files['pack_icon.png']) {
            const icon = zip.files['pack.png'] || zip.files['icon.png'];
            if (icon) {
                newZip.file('pack_icon.png', await icon.async('blob'));
                changes++;
                addLog('🖼️ آیکون اضافه شد.');
            }
        }

        // ===== ۶. ساخت فایل نهایی =====
        setStatus('loading', '⏳ در حال فشرده‌سازی...');
        addLog('🗜️ ساخت فایل نهایی...');

        const blob = await newZip.generateAsync({
            type: 'blob',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
        });

        // ===== ۷. دانلود =====
        const newName = selectedFile.name.replace(/\.zip$/i, '').replace(/\.jar$/i, '') + '_Bedrock.mcpack';
        downloadBtn.href = URL.createObjectURL(blob);
        downloadBtn.download = newName;
        downloadBtn.style.display = 'block';
        downloadBtn.textContent = `📥 دانلود ${newName} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;

        setStatus('success', `✅ تبدیل کامل شد! ${changes} تغییر اعمال شد.`);
        addLog(`✅ تبدیل با موفقیت انجام شد! (${changes} تغییر)`);
        addLog(`📦 حجم: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);

    } catch (error) {
        setStatus('error', '❌ خطا در تبدیل!');
        addLog(`❌ ERROR: ${error.message}`);
        console.error(error);
    } finally {
        isConverting = false;
        convertBtn.disabled = false;
        convertBtn.textContent = '🚀 شروع تبدیل حرفه‌ای';
    }
}

// ===== اتصال دکمه =====
convertBtn.addEventListener('click', startConversion);

// ===== پیام خوش‌آمد =====
addLog('💡 یک فایل ZIP جاوا را انتخاب کن و شروع کن.');
</script>

</body>
</html>
