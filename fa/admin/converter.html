<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>⚡ PackZoneMC - کانورتر حرفه‌ای v11.0</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(233,69,96,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(76,175,80,0.05) 0%, transparent 60%);
        }
        .container {
            max-width: 920px;
            width: 100%;
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 45px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(233,69,96,0.03), transparent, rgba(76,175,80,0.02), transparent);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
            z-index: 1;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 25px rgba(233,69,96,0.3);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #e94560 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header .subtitle {
            color: #888;
            font-size: 13px;
            -webkit-text-fill-color: #888;
        }
        .badge {
            background: rgba(233,69,96,0.15);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 12px;
            color: #e94560;
            border: 1px solid rgba(233,69,96,0.2);
            font-weight: 600;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }
        .badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 45px 20px 35px;
            text-align: center;
            background: rgba(255,255,255,0.02);
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .upload-zone:hover {
            border-color: rgba(233,69,96,0.4);
            background: rgba(233,69,96,0.05);
            transform: translateY(-2px);
        }
        .upload-zone.dragover {
            border-color: #e94560;
            background: rgba(233,69,96,0.08);
            transform: scale(1.01);
            box-shadow: 0 0 60px rgba(233,69,96,0.05);
        }
        .upload-zone .icon {
            font-size: 56px;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 8px 20px rgba(233,69,96,0.15));
        }
        .upload-zone p {
            color: #aaa;
            font-size: 16px;
            font-weight: 300;
            margin-bottom: 15px;
        }
        .upload-zone .file-name {
            color: #4caf50;
            font-weight: 700;
            margin-top: 12px;
            font-size: 16px;
        }
        .upload-zone .file-size {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
        }
        .file-select-btn {
            background: linear-gradient(135deg, #0f3460, #1a4a7a);
            color: #fff;
            border: none;
            padding: 14px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(15,52,96,0.3);
            display: inline-block;
            margin: 5px 0;
        }
        .file-select-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(15,52,96,0.4);
        }
        .file-select-btn:active {
            transform: scale(0.95);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            background: rgba(255,255,255,0.02);
            padding: 20px 24px;
            border-radius: 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
            z-index: 1;
        }
        .options-grid label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #bbb;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 10px;
            transition: 0.3s;
            font-weight: 400;
        }
        .options-grid label:hover {
            color: #fff;
            background: rgba(255,255,255,0.04);
        }
        .options-grid input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #e94560;
            cursor: pointer;
            flex-shrink: 0;
        }
        .convert-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 30px rgba(233,69,96,0.25);
        }
        .convert-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 15px 45px rgba(233,69,96,0.35);
        }
        .convert-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .convert-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .status-box {
            background: rgba(255,255,255,0.02);
            padding: 14px 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            position: relative;
            z-index: 1;
            transition: 0.3s;
        }
        .status-box.idle { color: #888; }
        .status-box.loading { 
            color: #ff9800; 
            background: rgba(255,152,0,0.06);
            border-color: rgba(255,152,0,0.1);
        }
        .status-box.success { 
            color: #4caf50; 
            background: rgba(76,175,80,0.06);
            border-color: rgba(76,175,80,0.1);
        }
        .status-box.error { 
            color: #f44336; 
            background: rgba(244,67,54,0.06);
            border-color: rgba(244,67,54,0.1);
        }
        .log-box {
            background: rgba(0,0,0,0.4);
            padding: 14px 18px;
            border-radius: 14px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            color: #999;
            border: 1px solid rgba(255,255,255,0.04);
            line-height: 1.8;
            min-height: 60px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }
        .log-box::-webkit-scrollbar { width: 5px; }
        .log-box::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }
        .log-box::-webkit-scrollbar-track { background: transparent; }
        .download-btn {
            display: none;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2a7a3a, #3a9a4a);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 30px rgba(76,175,80,0.2);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 45px rgba(76,175,80,0.3);
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #444;
            font-size: 12px;
            position: relative;
            z-index: 1;
        }
        .footer a {
            color: #666;
            text-decoration: none;
        }
        #fileInput {
            display: none;
        }
        @media (max-width: 640px) {
            .container { padding: 24px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header h1 { font-size: 22px; }
            .logo-icon { width: 40px; height: 40px; font-size: 20px; }
            .upload-zone { padding: 30px 15px; }
            .options-grid { grid-template-columns: 1fr 1fr; padding: 16px; }
            .convert-btn { font-size: 17px; padding: 15px; }
        }
        @media (max-width: 420px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="header-left">
            <div class="logo-icon">⚡</div>
            <div>
                <h1>PackZoneMC</h1>
                <span class="subtitle">کانورتر حرفه‌ای جاوا → بدراک</span>
            </div>
        </div>
        <div class="badge">نسخه ۱۱.۰ · سبک و سریع</div>
    </div>

    <div class="upload-zone" id="uploadZone">
        <span class="icon">📦</span>
        <p>فایل ZIP ریسورس پک جاوا را بکشید یا کلیک کنید</p>
        <button class="file-select-btn" id="fileSelectBtn">📂 انتخاب فایل</button>
        <input type="file" id="fileInput" accept=".zip,.jar">
        <div id="fileInfo" class="file-name"></div>
        <div id="fileSize" class="file-size"></div>
    </div>

    <div class="options-grid">
        <label><input type="checkbox" id="optGui" checked> 🖼️ رابط کاربری</label>
        <label><input type="checkbox" id="optSkybox" checked> 🌤️ اسکای‌باکس</label>
        <label><input type="checkbox" id="optArmor" checked> 🛡️ آرمور</label>
        <label><input type="checkbox" id="optFont" checked> 🔤 فونت</label>
        <label><input type="checkbox" id="optAnimation" checked> 🎬 انیمیشن</label>
        <label><input type="checkbox" id="optUidx" checked> ⚡ UIDX</label>
    </div>

    <button class="convert-btn" id="convertBtn">🚀 شروع تبدیل حرفه‌ای</button>

    <div class="status-box idle" id="statusBox">⏳ منتظر انتخاب فایل...</div>
    <div class="log-box" id="logBox">[سیستم] آماده‌ی کار...</div>

    <a class="download-btn" id="downloadBtn">📥 دانلود فایل تبدیل‌شده</a>

    <div class="footer">
        ساخته شده با ❤️ برای <a href="#">PackZoneMC</a> · v11.0 · سبک و بدون لگ
    </div>

</div>

<script>
// ============================================================
//  متغیرها و حالت
// ============================================================
let selectedFile = null;
let isConverting = false;

// ============================================================
//  المنت‌ها
// ============================================================
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileSelectBtn = document.getElementById('fileSelectBtn');
const fileInfo = document.getElementById('fileInfo');
const fileSize = document.getElementById('fileSize');
const convertBtn = document.getElementById('convertBtn');
const statusBox = document.getElementById('statusBox');
const logBox = document.getElementById('logBox');
const downloadBtn = document.getElementById('downloadBtn');

// ============================================================
//  مدیریت آپلود (نسخه ۱۰۰% تضمینی)
// ============================================================
fileSelectBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    fileInput.click();
});

uploadZone.addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SPAN') {
        fileInput.click();
    }
});

fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        selectedFile = file;
        const mb = (file.size / 1024 / 1024).toFixed(2);
        fileInfo.textContent = `📎 ${file.name}`;
        fileSize.textContent = `${mb} MB`;
        statusBox.className = 'status-box idle';
        statusBox.textContent = '✅ فایل آماده است!';
        addLog(`📁 ${file.name} (${mb} MB)`);
    }
});

// ===== درگ اند دراپ =====
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
    uploadZone.addEventListener(ev, e => {
        e.preventDefault();
        e.stopPropagation();
    });
});
uploadZone.addEventListener('dragenter', () => uploadZone.classList.add('dragover'));
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', function(e) {
    this.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        fileInput.files = files;
        fileInput.dispatchEvent(new Event('change'));
    }
});

// ============================================================
//  توابع کمکی
// ============================================================
function addLog(msg) {
    const time = new Date().toLocaleTimeString('fa-IR');
    logBox.textContent += `[${time}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

function setStatus(type, msg) {
    statusBox.className = 'status-box ' + type;
    statusBox.textContent = msg;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

// ============================================================
//  هسته کانورتر نسخه ۱۱.۰ - سبک و سریع
// ============================================================
async function startConversion() {
    if (isConverting) return;
    if (!selectedFile) {
        alert('لطفاً یک فایل ZIP انتخاب کن!');
        return;
    }

    isConverting = true;
    convertBtn.disabled = true;
    convertBtn.textContent = '⏳ در حال پردازش...';
    downloadBtn.style.display = 'none';
    setStatus('loading', '⏳ در حال تبدیل...');
    addLog('🔍 شروع تبدیل...');

    try {
        addLog('📂 خواندن فایل...');
        const zip = await JSZip.loadAsync(selectedFile);
        const newZip = new JSZip();
        let changes = 0;
        let processed = 0;
        let totalFiles = Object.keys(zip.files).length;

        // لیست فایل‌های ممنوعه
        const exclude = ['pack.mcmeta', 'pack.png', '.DS_Store', 'Thumbs.db', '.git', '.gitignore'];

        // پردازش فایل‌ها
        for (const [filename, file] of Object.entries(zip.files)) {
            processed++;
            if (processed % 50 === 0) {
                setStatus('loading', `⏳ پردازش... ${Math.round(processed/totalFiles*100)}%`);
            }

            if (file.dir) {
                if (!exclude.includes(filename)) newZip.folder(filename);
                continue;
            }

            if (exclude.includes(filename)) {
                addLog(`🗑️ ${filename}`);
                continue;
            }

            // تبدیل انیمیشن‌ها
            if (filename.endsWith('.mcmeta') && !filename.includes('pack.mcmeta')) {
                try {
                    const content = await file.async('string');
                    const json = JSON.parse(content);
                    if (json.animation) {
                        const data = new Blob([JSON.stringify({
                            animation: {
                                frametime: json.animation.frametime || 1,
                                interpolate: json.animation.interpolate || false,
                                frames: json.animation.frames || []
                            }
                        }, null, 2)], { type: 'application/json' });
                        newZip.file(filename, data);
                        addLog(`🎬 ${filename}`);
                        continue;
                    }
                } catch(e) {}
            }

            // کپی فایل
            const data = await file.async('blob');
            newZip.file(filename, data);
        }

        // ساخت manifest.json
        addLog('📄 manifest.json...');
        let packName = selectedFile.name.replace(/\.zip$/i, '').replace(/\.jar$/i, '');
        if (zip.files['pack.mcmeta']) {
            try {
                const mcmeta = JSON.parse(await zip.files['pack.mcmeta'].async('string'));
                if (mcmeta.pack?.name) packName = mcmeta.pack.name;
            } catch(e) {}
        }

        newZip.file('manifest.json', JSON.stringify({
            format_version: 2,
            header: {
                name: packName + ' (Bedrock)',
                description: 'Converted by PackZoneMC v11.0',
                uuid: generateUUID(),
                version: [1, 0, 0],
                min_engine_version: [1, 16, 0]
            },
            modules: [{ type: 'resources', uuid: generateUUID(), version: [1, 0, 0] }]
        }, null, 2));
        changes++;

        // آیکون
        if (!zip.files['pack_icon.png']) {
            const icon = zip.files['pack.png'] || zip.files['icon.png'];
            if (icon) {
                newZip.file('pack_icon.png', await icon.async('blob'))
