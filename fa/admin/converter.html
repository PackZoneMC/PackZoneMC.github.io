<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>🔒 پنل ادمین - PackZoneMC</title>
    
    <!-- کتابخونه‌ها از CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { 
            max-width: 820px; 
            width: 100%; 
            margin: 0 auto; 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            background: #16213e;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid #0f3460;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { 
            color: #e94560; 
            font-size: 24px;
        }
        .header .subtitle {
            color: #888;
            font-size: 13px;
        }

        .converter-box {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #0f3460;
        }
        .upload-area {
            border: 3px dashed #0f3460;
            padding: 35px 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            background: #0a0a1a;
            transition: 0.3s;
            cursor: pointer;
        }
        .upload-area:hover { 
            border-color: #e94560; 
            background: #0f0f2a;
        }
        .upload-area.dragover {
            border-color: #e94560;
            background: #1a1a3e;
        }
        .upload-area p {
            color: #aaa;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .upload-area .file-name {
            color: #4caf50;
            font-weight: bold;
            margin-top: 8px;
            font-size: 14px;
        }
        .select-btn {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .select-btn:hover { 
            background: #1a4a7a; 
            transform: scale(1.05);
        }

        .options {
            background: #0a0a1a;
            padding: 18px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #0f3460;
        }
        .options h3 { 
            color: #e94560; 
            margin-bottom: 12px;
            font-size: 16px;
        }
        .options label {
            display: block;
            padding: 6px 0;
            color: #ccc;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .options label:hover { color: #fff; }
        .options input[type="checkbox"] {
            margin-left: 10px;
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: #e94560;
            vertical-align: middle;
        }

        .convert-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 18px;
        }
        .convert-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(233,69,96,0.3);
        }
        .convert-btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.success { background: #1a4a2a; color: #4caf50; }
        .status.error { background: #4a1a1a; color: #f44336; }
        .status.loading { background: #1a2a4a; color: #ff9800; }
        .status.idle { background: transparent; color: #888; }

        .log-box {
            background: #0a0a1a;
            padding: 12px 15px;
            border-radius: 10px;
            max-height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            color: #aaa;
            margin-bottom: 15px;
            border: 1px solid #0f3460;
            line-height: 1.6;
            min-height: 60px;
        }
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-track { background: #0a0a1a; }
        .log-box::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #4caf50;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
            border: none;
        }
        .download-btn:hover { 
            background: #45a049; 
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(76,175,80,0.3);
        }

        @media (max-width: 600px) {
            .header { flex-direction: column; text-align: center; }
            .header h1 { font-size: 20px; }
            .converter-box { padding: 18px; }
            .upload-area { padding: 20px 15px; }
            .options label { font-size: 13px; }
            .convert-btn { font-size: 17px; padding: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>🎮 PackZoneMC</h1>
            <span class="subtitle">تبدیل جاوا → بدراک (پنل ادمین)</span>
        </div>
    </div>

    <div class="converter-box">
        <!-- آپلود فایل -->
        <div class="upload-area" id="uploadArea">
            <p>📁 فایل ZIP ریسورس پک جاوا را انتخاب کن</p>
            <input type="file" id="fileInput" accept=".zip" style="display:none;">
            <button onclick="document.getElementById('fileInput').click()" class="select-btn" type="button">انتخاب فایل</button>
            <div id="fileInfo" class="file-name"></div>
        </div>

        <!-- تنظیمات -->
        <div class="options">
            <h3>⚙️ تنظیمات تبدیل</h3>
            <label><input type="checkbox" id="fixAnimations" checked> ترمیم انیمیشن‌ها</label>
            <label><input type="checkbox" id="fixModels" checked> تبدیل مدل‌ها</label>
            <label><input type="checkbox" id="fixTextures" checked> اصلاح مسیر بافت‌ها</label>
            <label><input type="checkbox" id="addPackIcon" checked> افزودن آیکون بدراک</label>
        </div>

        <!-- دکمه تبدیل -->
        <button onclick="startConversion()" class="convert-btn" id="convertBtn">
            🚀 شروع تبدیل
        </button>

        <!-- وضعیت و لاگ -->
        <div id="status" class="status idle">⏳ منتظر انتخاب فایل...</div>
        <div id="log" class="log-box">[سیستم] آماده‌ی کار...</div>

        <!-- دانلود -->
        <a id="downloadLink" style="display:none;" class="download-btn">
            📥 دانلود فایل تبدیل‌شده
        </a>
    </div>
</div>

<script>
// ============================================================
//  متغیرها
// ============================================================
let selectedFile = null;
let convertedBlob = null;
let isConverting = false;

// ============================================================
//  مدیریت فایل
// ============================================================
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        selectedFile = file;
        const sizeMB = (file.size / 1024 / 1024).toFixed(2);
        document.getElementById('fileInfo').textContent = `📎 ${file.name} (${sizeMB} MB)`;
        addLog(`📁 فایل انتخاب شد: ${file.name} (${sizeMB} MB)`);
        updateStatus('idle', '✅ فایل آماده است!');
    }
});

const uploadArea = document.getElementById('uploadArea');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
    uploadArea.addEventListener(ev, e => {
        e.preventDefault();
        e.stopPropagation();
    });
});

uploadArea.addEventListener('dragenter', () => {
    uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', function(e) {
    this.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
        const input = document.getElementById('fileInput');
        input.files = files;
        input.dispatchEvent(new Event('change'));
    }
});

uploadArea.addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON') {
        document.getElementById('fileInput').click();
    }
});

// ============================================================
//  توابع کمکی
// ============================================================
function updateStatus(type, message) {
    const status = document.getElementById('status');
    status.className = 'status ' + type;
    status.textContent = message;
}

function addLog(msg) {
    const logBox = document.getElementById('log');
    const time = new Date().toLocaleTimeString('fa-IR');
    logBox.textContent += `[${time}] ${msg}\n`;
    logBox.scrollTop = logBox.scrollHeight;
}

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

// ============================================================
//  تبدیل اصلی
// ============================================================
async function startConversion() {
    if (isConverting) return;
    
    if (!selectedFile) {
        alert('لطفاً اول یک فایل ZIP انتخاب کن!');
        return;
    }

    const convertBtn = document.getElementById('convertBtn');
    const downloadLink = document.getElementById('downloadLink');
    
    isConverting = true;
    convertBtn.disabled = true;
    convertBtn.textContent = '⏳ در حال تبدیل...';
    downloadLink.style.display = 'none';
    updateStatus('loading', '⏳ در حال پردازش...');
    addLog('🔍 شروع فرآیند تبدیل...');
    
    try {
        addLog('📂 در حال خواندن فایل ZIP...');
        const zip = await JSZip.loadAsync(selectedFile);
        const newZip = new JSZip();
        let changes = 0;
        let fileCount = 0;
        const totalFiles = Object.keys(zip.files).length;
        
        addLog(`📂 ${totalFiles} فایل در پک پیدا شد.`);

        for (const [filename, file] of Object.entries(zip.files)) {
            fileCount++;
            
            if (fileCount % 5 === 0) {
                updateStatus('loading', `⏳ در حال پردازش... (${fileCount}/${totalFiles})`);
            }
            
            if (file.dir) {
                newZip.folder(filename);
                continue;
            }
            
            let content = await file.async('string');
            let modified = false;
            let fileChanged = false;
            
            // ---- ۱. تبدیل JSON (مدل‌ها) ----
            if (filename.endsWith('.json') && !filename.includes('pack.mcmeta')) {
                try {
                    const json = JSON.parse(content);
                    
                    if (document.getElementById('fixModels').checked && json.textures) {
                        let texChanged = false;
                        for (let key in json.textures) {
                            if (typeof json.textures[key] === 'string') {
                                const old = json.textures[key];
                                json.textures[key] = old
                                    .replace(/^minecraft:/, '')
                                    .replace(/^block\//, 'blocks/')
                                    .replace(/^item\//, 'items/');
                                if (json.textures[key] !== old) texChanged = true;
                            }
                        }
                        if (texChanged) {
                            content = JSON.stringify(json, null, 2);
                            modified = true;
                            fileChanged = true;
                        }
                    }
                } catch(e) {}
            }
            
            // ---- ۲. تبدیل انیمیشن‌ها (.mcmeta) ----
            if (filename.endsWith('.mcmeta') && document.getElementById('fixAnimations').checked) {
                try {
                    const meta = JSON.parse(content);
                    if (meta.animation) {
                        content = JSON.stringify({
                            animation: {
                                frametime: meta.animation.frametime || 1,
                                interpolate: meta.animation.interpolate || false,
                                frames: meta.animation.frames || []
                            }
                        }, null, 2);
                        modified = true;
                        fileChanged = true;
                        addLog(`🎬 انیمیشن اصلاح شد: ${filename}`);
                    }
                } catch(e) {}
            }
            
            // ---- ۳. اصلاح مسیر PNG ----
            if (filename.endsWith('.png') && document.getElementById('fixTextures').checked) {
                let newName = filename
                    .replace(/^textures\//, 'textures/')
                    .replace(/\/block\//g, '/blocks/')
                    .replace(/\/item\//g, '/items/')
                    .replace(/\/entity\//g, '/entities/');
                
                if (newName !== filename) {
                    const pngData = await file.async('blob');
                    newZip.file(newName, pngData);
                    modified = true;
                    fileChanged = true;
                    changes++;
                    addLog(`🖼️ مسیر بافت اصلاح شد: ${filename} → ${newName}`);
                }
            }
            
            if (modified) {
                if (!filename.endsWith('.png')) {
                    newZip.file(filename, content);
                }
                if (!fileChanged) changes++;
            } else {
                const data = await file.async('blob');
                newZip.file(filename, data);
            }
        }
        
        // ---- افزودن آیکون ----
        if (document.getElementById('addPackIcon').checked && !zip.files['pack_icon.png']) {
            const icon = zip.files['pack.png'] || zip.files['icon.png'];
            if (icon) {
                newZip.file('pack_icon.png', await icon.async('blob'));
                changes++;
                addLog('🖼️ آیکون بدراک اضافه شد.');
            } else {
                addLog('⚠️ آیکونی برای افزودن پیدا نشد.');
            }
        }
        
        // ---- ساخت manifest ----
        if (zip.files['pack.mcmeta']) {
            try {
                const manifest = JSON.parse(await zip.files['pack.mcmeta'].async('string'));
                newZip.file('manifest.json', JSON.stringify({
                    "format_version": 2,
                    "header": {
                        "name": manifest.pack?.name || "Converted Pack",
                        "description": manifest.pack?.description || "Converted from Java to Bedrock",
                        "uuid": generateUUID(),
                        "version": [1, 0, 0],
                        "min_engine_version": [1, 16, 0]
                    },
                    "modules": [{
                        "type": "resources",
                        "uuid": generateUUID(),
                        "version": [1, 0, 0]
                    }]
                }, null, 2));
                changes++;
                addLog('📄 فایل manifest.json ساخته شد.');
            } catch(e) {
                addLog('⚠️ خطا در ساخت manifest: ' + e.message);
            }
        } else {
            addLog('⚠️ فایل pack.mcmeta پیدا نشد، manifest ساخته نشد.');
        }
        
        // ---- ساخت فایل نهایی ----
        updateStatus('loading', '⏳ در حال فشرده‌سازی...');
        addLog('🗜️ در حال ساخت فایل ZIP نهایی...');
        
        const blob = await newZip.generateAsync({
            type: 'blob',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
        });
        
        convertedBlob = blob;
        const newName = selectedFile.name.replace(/\.zip$/i, '_Bedrock.zip');
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = newName;
        downloadLink.style.display = 'block';
        downloadLink.textContent = `📥 دانلود ${newName} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`;
        
        updateStatus('success', `✅ تبدیل کامل شد! ${changes} تغییر اعمال شد.`);
        addLog(`✅ تبدیل با موفقیت انجام شد! (${changes} تغییر)`);
        addLog(`📦 حجم فایل نهایی: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);
        
    } catch (error) {
        updateStatus('error', '❌ خطا در تبدیل!');
        addLog(`❌ ERROR: ${error.message}`);
        console.error(error);
    } finally {
        isConverting = false;
        convertBtn.disabled = false;
        convertBtn.textContent = '🚀 شروع تبدیل';
    }
}

addLog('💡 یک فایل ZIP ریسورس پک جاوا را انتخاب کن و شروع کن.');
</script>

</body>
</html>
